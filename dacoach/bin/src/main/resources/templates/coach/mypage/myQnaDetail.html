<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>dacoach</title>

  <link rel="stylesheet" th:href="@{/css/main.css}" />
  <link rel="stylesheet" th:href="@{/css/mypage.css}" />
</head>
<body>
  <div th:replace="layout/header :: siteHeader"></div>

  <main class="main">
    <div class="container">

      <!-- breadcrumb -->
      <div class="breadcrumb">
        <a th:href="@{/mypage}">마이페이지</a>
        <span class="sep">&gt;</span>
        <a th:href="@{/myQnaList}">1:1 문의</a>
        <span class="sep">&gt;</span>
        <span>상세</span>
      </div>

      <h2 class="pageTitle">1:1 문의 상세</h2>
      <hr class="line" />

      <!-- 질문 카드 -->
      <section class="qnaDetailCard">
        <div class="qnaDetailTop">
          <div class="qnaDetailTitleRow">
            <span class="qMark">Q.</span>
            <span class="qTitle" th:text="${qna.title}">문의 제목</span>
          </div>

          <!-- 답변 상태: answer가 있으면 완료 / 없으면 대기 -->
          <span class="status done" th:if="${answer != null}">답변완료</span>
          <span class="status wait" th:if="${answer == null}">답변대기</span>
        </div>

        <div class="qnaMeta">
          <span class="metaItem">
            <b>유형</b> <span th:text="${qna.qna_type}">CHAT</span>
          </span>
          <span class="metaItem">
            <b>작성일</b>
            <span th:text="${#dates.format(qna.created_at,'yyyy-MM-dd HH:mm')}">2026-02-03 12:00</span>
          </span>
        </div>

        <div class="qnaContent" th:text="${qna.question}">
          질문 내용이 여기에 나와야 함
        </div>

      </section>

      <!-- 답변 카드 -->
      <section class="qnaDetailCard answerCard" th:if="${answer != null}">
        <div class="qnaDetailTop">
          <div class="qnaDetailTitleRow">
            <span class="aMark">A.</span>
            <span class="aTitle" th:text="${answer.title}">답변 제목</span>
          </div>

          
        </div>
        
        <div class="qnaMeta">
	          <span class="metaItem">
	            <b>작성자</b> <span>관리자</span>
	          </span>
	          <span class="metaItem">
	            <b>작성일</b>
	            <span th:text="${#dates.format(answer.createdAt,'yyyy-MM-dd HH:mm')}">2026-02-03 12:00</span>
	          </span>
	        </div>

        <div class="qnaContent" th:text="${answer.answer}">
          답변 내용이 여기에 나와야 함
        </div>
      </section>

      <!-- 답변 없을 때 안내 -->
      <section class="qnaDetailCard answerCard waitingCard" th:if="${answer == null}">
        <div class="waitingText">
          아직 답변이 등록되지 않았습니다. 조금만 기다려 주세요.
        </div>
      </section>

    </div>
  </main>

  <div th:replace="layout/footer :: siteFooter"></div>
</body>
</html>
