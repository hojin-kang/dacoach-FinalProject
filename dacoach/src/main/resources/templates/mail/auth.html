<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
</head>
<body>
    <div style="margin: 20px; padding: 20px; border: 1px solid #e0e0e0; border-radius: 10px; font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;">
        <div style="text-align: center; margin-bottom: 20px;">
    		<img src="cid:logo" alt="다코치 로고" style="width: 150px;">
		</div>

        <h2 style="color: #4A90E2; text-align: center;">이메일 인증 안내</h2>
        <p style="text-align: center;">안녕하세요! 다코치 서비스를 이용해 주셔서 감사합니다.<br>
        아래 인증번호를 입력해 주세요.</p>
        
        <div style="background-color: #f8f9fa; padding: 20px; text-align: center; border-radius: 5px; margin: 20px 0;">
            <span style="font-size: 30px; font-weight: bold; color: #333; letter-spacing: 8px;" th:text="${authCode}">123456</span>
        </div>

        <div style="background-color: #fff2f0; padding: 10px; border: 1px solid #ffccc7; border-radius: 5px; text-align: center;">
            <p style="color: #ff4d4f; margin: 0; font-size: 0.9em;">
                <strong>※ 해당 인증번호는 발송 후 3분간 유효합니다.</strong>
            </p>
        </div>
        
        <p style="color: #888; font-size: 0.8em; margin-top: 30px; text-align: center;">
            본 메일은 발신 전용입니다. 문의 사항은 고객센터를 이용해 주세요.
        </p>
    </div>
</body>
</html>
