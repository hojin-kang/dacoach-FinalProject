<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

  <meta charset="UTF-8" />
  <title>dacoach</title>

  <link rel="stylesheet" th:href="@{/css/main.css}" />
  <link rel="stylesheet" th:href="@{/css/index.css}" />
</head>
<body>
  <div th:replace="~{layout/header :: siteHeader}"></div>

  <main class="main">
    <div class="container">
    	<div class="categoryArea">
    		<span>관심 분야를 선택해보세요</span>
    		
		      <div class="category">
		      	<div class="categoryUnit" th:each="m : ${majorFields}">
		      		<a th:href="@{/coach/search(majorField=${m.MAJOR_FIELD_IDX}, minorField='', majorRegion='', keyword='', sort='latest')}">
			      		<img th:src="@{/img/icon/{idx}.png(idx=${m.MAJOR_FIELD_IDX})}">
			      		<span th:text="${m.MAJOR_FIELD_CD}">IT/전자</span>
		      		</a>
		      	</div>
		      </div>
		      
    	</div>

			<section class="mainSection">
  <div class="sectionHeader">
    <span>실시간 <b class="accent">인기 코치</b></span>
  <div class="infoWrap">
    <img src="/img/icon/info.png" class="infoIcon" data-tooltip="coach">
    <div class="infoBubble" data-tooltip-box="coach">
      최근 7일 찜 수가 많은 코치 순으로 선정돼요.
    </div>
</div>
  </div>

  <div class="wrap">
  <button type="button" class="arrowBtn left" id="popPrev" aria-label="prev">‹</button>
    <div class="viewport">
      <div class="track" id="popularCoachTrack">
        <div class="popularCard" th:each="c : ${popularCoaches}">
          <a class="popularCardInner" th:href="@{/coach/detail(user_idx=${c.user_idx})}">
            
            <!-- 왼쪽: 프로필 영역 -->
            <div class="left">
              <div class="avatar">
                <img th:src="${c.photo != null and c.photo != ''} ? @{/uploads/{p}(p=${c.photo})} : @{/img/profile/defaultProfile.jpg}"
                     alt="coach">
              </div>

              <div class="badge" th:text="${c.rank_name}">베테랑 코치</div>
              <div class="name" th:text="${c.nickname}">홍길동</div>

              <div class="rating">
                <span class="star">★</span>
                <span th:text="${#numbers.formatDecimal(c.rating, 1, 1)}">4.7</span>
                <span class="cnt" th:text="'(' + ${c.review_count} + ')'">(54)</span>
              </div>
            </div>

            <!-- 오른쪽: 제공/관심 분야 -->
            <div class="right">
              <div class="row">
                <div class="label">제공분야</div>
                <div class="tags">
                  <span class="tag" th:each="t : ${c.hashtags}" th:text="${t}">#축구</span>
                </div>
              </div>

              <div class="row">
                <div class="label">관심분야</div>
                <div class="tags">
                  <span class="tag" th:each="t : ${c.interhashtags}" th:text="${t}">#야구</span>
                </div>
              </div>
            </div>

          </a>
        </div>
      </div>
    </div>

    <!-- 오른쪽 화살표 (스샷처럼 겹치기) -->
    <button type="button" class="arrowBtn right" id="popNext" aria-label="next">›</button>
  </div>
</section>


		<section class="mainSection">
      	<div class="sectionHeader">
    <span>실시간 <b class="accent">인기 분야</b></span>
	<div class="infoWrap">

  </div>

      </div>

      </div>	
      </form>
      </section>
      
      <section class="mainSection">
      	<div class="sectionHeader">
    <span>실시간 <b class="accent2">인기 클래스</b></span>

    <div class="viewport">
      <div class="track" id="popularClassTrack">
      <div class="popularCard_class" th:each="pc : ${popularClasses}">
          <a class="popularCardInner_class" th:href="@{/coach/classDetail(id=${pc.class_idx})}">
            
            <!-- 왼쪽: 프로필 영역 -->
            <div class="top">
              <div>
                <img th:src="${pc.photo != null and pc.photo != ''} ? @{/uploads/{p}(p=${pc.photo})} : @{/img/profile/default_company.jpg}"
                     alt="class">
              </div>
            </div>
            <div class="middle">
	            <div class="rating">
	                <span class="star">★</span>
	                <span th:text="${#numbers.formatDecimal(pc.avg_rating, 1, 1)}">4.7</span>
	                <span class="cnt" th:text="'(' + ${pc.review_cnt} + ')'">(54)</span>
	            </div>
            	<div th:text="|[${pc.user_name}]|" class="class_name">기업 이름</div>
            
            </div>
            <div class="bottom">
            	<div class="name" th:text="${pc.title}">클래스 이름</div>
            </div>
              

          </a>
        </div>
      </div>
      </div>
      <button type="button" class="arrowBtn right" id="popClassNext" aria-label="next">›</button>
      </div>
      </section>
    </div>
  </main>
  
  <div th:replace="~{layout/footer :: siteFooter}"></div>
<script th:inline="javascript">
  function showBanner(){
    const list = /*[[${list}]]*/ [];
    const banner = document.getElementById('banner');

    if(!list || list.length === 0) return;

    const num = Math.floor(Math.random() * list.length);

    banner.innerHTML =
      '<img src="/uploads/' + list[num].photo + '" onclick="sendForm()">' +
      '<input type="hidden" name="idx" value="'+ list[num].member_idx +'">' +
      '<input type="hidden" name="fromName" value="banner">';
  }

  window.onload = function(){
    showBanner();
    window.setInterval(showBanner, 10000);
  }

  function sendForm(){
    document.getElementById('bannerForm').submit();
  }
</script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const track = document.getElementById("popularCoachTrack");
  const nextBtn = document.getElementById("popNext");
  const prevBtn = document.getElementById("popPrev");
  if(!track || !nextBtn || !prevBtn) return;

  const cards = track.querySelectorAll(".popularCard");
  const total = cards.length;
  const visible = 3;

  let index = 0;
  let maxIndex = Math.max(0, total - visible);
  const gap = 12;

  function move(){
    if(total === 0) return;

    const cardWidth = cards[0].offsetWidth;
    track.style.transform = `translateX(${-(cardWidth + gap) * index}px)`;
  }

  function toggleButtons(){
    // 처음이면 prev 숨김
    if(index === 0) prevBtn.classList.add("isHidden");
    else prevBtn.classList.remove("isHidden");

    // 끝이면 next 숨김
    if(index === maxIndex) nextBtn.classList.add("isHidden");
    else nextBtn.classList.remove("isHidden");
  }

  function update(){
    maxIndex = Math.max(0, total - visible); // resize 시 재계산
    if(index > maxIndex) index = maxIndex;

    move();
    toggleButtons();
  }

  nextBtn.addEventListener("click", () => {
    index = Math.min(maxIndex, index + 1);
    update();
  });

  prevBtn.addEventListener("click", () => {
    index = Math.max(0, index - 1);
    update();
  });

  window.addEventListener("resize", update);
  update(); // 초기 상태 세팅(처음엔 prev 숨김)
});

// info 창 열기
document.addEventListener("click", (e) => {
	  const icon = e.target.closest(".infoIcon");

	  // 아이콘 눌렀을 때
	  if(icon){
	    const key = icon.dataset.tooltip;

	    // 다른 툴팁은 전부 닫고
	    document.querySelectorAll(".infoBubble").forEach(b => b.classList.remove("isOpen"));

	    // 해당 툴팁만 토글
	    const bubble = document.querySelector(`.infoBubble[data-tooltip-box="${key}"]`);
	    if(bubble) bubble.classList.toggle("isOpen");

	    e.stopPropagation();
	    return;
	  }

	  // 바깥 클릭하면 닫기
	  document.querySelectorAll(".infoBubble").forEach(b => b.classList.remove("isOpen"));
	});
</script>
