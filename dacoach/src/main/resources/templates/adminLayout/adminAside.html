<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<aside class="admin-aside" th:fragment="siteAside">
    <style>
        /* 사이드바 기본 레이아웃 */
        .admin-aside {
            width: 256px;
            min-height: 100vh;
            background-color: #ffffff;
            border-right: 1px solid #e5e7eb;
            padding-top: 40px;
            padding-bottom: 40px;
            flex-shrink: 0;
        }

        .admin-aside__list {
            display: flex;
            flex-direction: column;
            list-style: none;
            padding: 0;
            margin: 0;
        }

        /* 메뉴 공통 아이템 스타일 */
        .admin-aside__menu-item, 
        .admin-aside__trigger {
            display: block;
            width: 100%;
            text-align: left;
            padding: 16px 40px;
            color: #374151;
            font-weight: 500;
            text-decoration: none;
            border: none;
            background: none;
            cursor: pointer;
            border-left: 4px solid transparent;
            transition: all 0.3s;
        }

        /* 마우스 호버 시 */
        .admin-aside__menu-item:hover,
        .admin-aside__trigger:hover {
            background-color: #f0f9f7;
            color: #4a7c74;
            border-left-color: #4a7c74;
        }

        /* 활성화된 메뉴 상태 */
        .admin-aside__menu-item--active,
        .admin-aside__trigger--active {
            background-color: #f0f9f7;
            color: #4a7c74;
            border-left-color: #4a7c74;
            font-weight: 600;
        }

        /* 서브메뉴 레이아웃 */
        .admin-aside__submenu {
            background-color: #f9fafb;
            padding-bottom: 8px;
            list-style: none;
            padding-left: 0;
        }

        .admin-aside__submenu.hidden {
            display: none;
        }

        /* 서브메뉴 개별 링크 */
        .admin-aside__submenu-link {
            display: block;
            padding: 8px 56px;
            font-size: 14px;
            color: #4b5563;
            text-decoration: none;
            transition: color 0.2s;
        }

        .admin-aside__submenu-link:hover {
            color: #4a7c74;
        }

        /* 활성화된 서브메뉴 상태 */
        .admin-aside__submenu-link--active {
            color: #4a7c74;
            font-weight: 700;
            text-decoration: underline;
        }

        /* 아이콘 스타일 */
        .admin-aside__trigger {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .admin-aside__trigger::after {
            content: '+';
            font-size: 18px;
            font-weight: bold;
            color: #9ca3af;
        }

        .admin-aside__trigger.is-open::after {
            content: '-';
            color: #4a7c74;
        }
    </style>

    <nav>
        <ul class="admin-aside__list">
            <li>
                <button type="button" class="admin-aside__trigger" onclick="toggleSubMenu('personalSubmenu', this)">
                    개인서비스관리
                </button>
                <ul id="personalSubmenu" class="admin-aside__submenu hidden">
                    <li><a th:href="@{/admin/coach/coachList}" class="admin-aside__submenu-link">개인고객관리</a></li>
                    <li><a th:href="@{/admin/coach/matchList}" class="admin-aside__submenu-link">매칭관리</a></li>
                </ul>
            </li>
            
            <li>
                <a th:href="@{/admin/companyList}" class="admin-aside__menu-item">
                    기업고객관리
                </a>
            </li>

            <li>
                <button type="button" class="admin-aside__trigger" onclick="toggleSubMenu('profitSubmenu', this)">
                    수익관리
                </button>
                <ul id="profitSubmenu" class="admin-aside__submenu hidden">
                    <li><a th:href="@{/admin/refund}" class="admin-aside__submenu-link">결제관리</a></li>
                    <li><a th:href="@{/admin/statistics}" class="admin-aside__submenu-link">통계관리</a></li>
                </ul>
            </li>

            <li>
                <button type="button" class="admin-aside__trigger" onclick="toggleSubMenu('monitoringSubmenu', this)">
                    모니터링
                </button>
                <ul id="monitoringSubmenu" class="admin-aside__submenu hidden">
                    <li><a th:href="@{/admin/companyClassList}" class="admin-aside__submenu-link">클래스 프로필 검수</a></li>
                    <li><a th:href="@{/admin/monitoring/coachInfoList}" class="admin-aside__submenu-link">코치 프로필 검수</a></li>
                </ul>
            </li>

            <li>
                <button type="button" class="admin-aside__trigger" onclick="toggleSubMenu('supportSubmenu', this)">
                    고객센터
                </button>
                <ul id="supportSubmenu" class="admin-aside__submenu hidden">
                    <li><a th:href="@{/admin/support/notice}" class="admin-aside__submenu-link">공지</a></li>
                    <li><a th:href="@{/admin/support/qna}" class="admin-aside__submenu-link">Q&A</a></li>
                    <li><a th:href="@{/admin/support/policy}" class="admin-aside__submenu-link">운영정책</a></li>
                </ul>
            </li>

            <li><a th:href="@{/admin/adView}" class="admin-aside__menu-item">광고관리</a></li>
            <li><a th:href="@{/admin/keyword/keyword}" class="admin-aside__menu-item">키워드관리</a></li>

            <li>
                <button type="button" class="admin-aside__trigger" onclick="toggleSubMenu('filterSubmenu', this)">
                    필터관리
                </button>
                <ul id="filterSubmenu" class="admin-aside__submenu hidden">
                    <li><a th:href="@{/admin/filter/field}" class="admin-aside__submenu-link">분야 필터관리</a></li>
                    <li><a th:href="@{/admin/filter/regions}" class="admin-aside__submenu-link">지역 필터관리</a></li>
                </ul>
            </li>

            <li><a th:href="@{/admin/report}" class="admin-aside__menu-item">신고관리</a></li>
        </ul>
    </nav>

	<script>
    // 서브메뉴 토글 함수 (기존과 동일)
    function toggleSubMenu(id, btn) {
        const submenu = document.getElementById(id);
        const isOpen = !submenu.classList.toggle('hidden');
        btn.classList.toggle('is-open', isOpen);
    }

    document.addEventListener('DOMContentLoaded', function() {
        const currentPath = window.location.pathname;
        const hash = window.location.hash;

        // 1. URL 해시(#open=ID)가 있는 경우 강제 열기 (최우선 순위)
        if (hash && hash.includes('open=')) {
            const targetId = hash.split('open=')[1];
            const targetMenu = document.getElementById(targetId);
            if (targetMenu) {
                targetMenu.classList.remove('hidden');
                targetMenu.previousElementSibling?.classList.add('is-open');
                // 해시로 열었을 때는 아래 자동 감지 로직을 건너뛰고 싶다면 return;을 써도 되지만, 
                // 하위 링크 강조를 위해 계속 진행합니다.
            }
        }

        // 2. 서브메뉴 링크 및 부모 메뉴 감지
        const subLinks = document.querySelectorAll('.admin-aside__submenu-link');
        subLinks.forEach(link => {
            const menuHref = link.getAttribute('href');
            
            // [검사 조건] 주소가 완벽히 같거나, 상세 페이지 주소 패턴이 포함되어 있는지 확인
            const isExactMatch = currentPath === menuHref;
            const isSubPathMatch = menuHref !== '/admin' && currentPath.includes(menuHref.replace('List', ''));

            if (isExactMatch || isSubPathMatch) {
                // 현재 페이지면 밑줄 강조
                if(isExactMatch) link.classList.add('admin-aside__submenu-link--active');
                
                // 부모 서브메뉴 펼치기
                const parentSubmenu = link.closest('.admin-aside__submenu');
                if (parentSubmenu) {
                    parentSubmenu.classList.remove('hidden');
                    const triggerBtn = parentSubmenu.previousElementSibling;
                    if (triggerBtn && triggerBtn.classList.contains('admin-aside__trigger')) {
                        triggerBtn.classList.add('is-open');
                    }
                }
            }
        });
        
        // 3. 서브메뉴가 없는 일반 메뉴 아이템 처리
        const mainLinks = document.querySelectorAll('.admin-aside__menu-item');
        mainLinks.forEach(link => {
            const menuHref = link.getAttribute('href');
            if (currentPath === menuHref || (menuHref !== '/admin' && currentPath.startsWith(menuHref))) {
                link.classList.add('admin-aside__menu-item--active');
            }
        });
    });
</script>
</aside>
</html>
