<html xmlns:th="http://www.thymeleaf.org">
<aside class="w-64 min-h-screen bg-white border-r border-gray-200 py-10 flex-shrink-0" th:fragment="siteAside">
    <nav>
        <ul class="flex flex-col">
            <li>
                <a th:href="@{/admin/coach/coachList}" 
                   class="block px-10 py-4 text-gray-700 font-medium transition-all duration-300 
                          hover:bg-[#f0f9f7] hover:text-[#4a7c74] border-l-4 border-transparent hover:border-[#4a7c74]"
                   th:classappend="${activeMenu == 'coach'} ? ' bg-[#f0f9f7] text-[#4a7c74] border-[#4a7c74] font-semibold'">
                    개인고객관리
                </a>
            </li>
            
            <li>
                <a th:href="@{/admin/companyList}"
                   class="block px-10 py-4 text-gray-700 font-medium transition-all duration-300 
                          hover:bg-[#f0f9f7] hover:text-[#4a7c74] border-l-4 border-transparent hover:border-[#4a7c74]"
                   th:classappend="${activeMenu == 'company'} ? ' bg-[#f0f9f7] text-[#4a7c74] border-[#4a7c74] font-semibold'">
                    기업고객관리
                </a>
            </li>

            <li>
                <button type="button"
                        class="w-full text-left px-10 py-4 text-gray-700 font-medium transition-all duration-300 
                               hover:bg-[#f0f9f7] hover:text-[#4a7c74] border-l-4 border-transparent hover:border-[#4a7c74]"
                        th:classappend="${activeMenu == 'profit'} ? ' bg-[#f0f9f7] text-[#4a7c74] border-[#4a7c74] font-semibold'"
                        onclick="toggleSubMenu('profitSubmenu')">
                    수익관리
                </button>
                <ul id="profitSubmenu" class="bg-gray-50 pb-2" th:classappend="${activeMenu != 'profit'} ? ' hidden'">
                    <li><a th:href="@{/admin/payment}" class="block px-14 py-2 text-sm text-gray-600 hover:text-[#4a7c74]" th:classappend="${activeSubmenu == 'payment'} ? ' text-[#4a7c74] font-bold underline'">결제관리</a></li>
                    <li><a th:href="@{/admin/statistics}" class="block px-14 py-2 text-sm text-gray-600 hover:text-[#4a7c74]" th:classappend="${activeSubmenu == 'statistics'} ? ' text-[#4a7c74] font-bold underline'">통계관리</a></li>
                </ul>
            </li>

            <li>
                <button type="button"
                        class="w-full text-left px-10 py-4 text-gray-700 font-medium transition-all duration-300 
                               hover:bg-[#f0f9f7] hover:text-[#4a7c74] border-l-4 border-transparent hover:border-[#4a7c74]"
                        th:classappend="${activeMenu == 'monitoring'} ? ' bg-[#f0f9f7] text-[#4a7c74] border-[#4a7c74] font-semibold'"
                        onclick="toggleSubMenu('monitoringSubmenu')">
                    모니터링
                </button>
                <ul id="monitoringSubmenu" class="bg-gray-50 pb-2" th:classappend="${activeMenu != 'monitoring'} ? ' hidden'">
                    <li><a th:href="@{/admin/companyClassList}" class="block px-14 py-2 text-sm text-gray-600 hover:text-[#4a7c74]" th:classappend="${activeSubmenu == 'class'} ? ' text-[#4a7c74] font-bold underline'">클래스</a></li>
                    <li><a th:href="@{/admin/monitoring/content}" class="block px-14 py-2 text-sm text-gray-600 hover:text-[#4a7c74]" th:classappend="${activeSubmenu == 'content'} ? ' text-[#4a7c74] font-bold underline'">콘텐츠</a></li>
                </ul>
            </li>

            <li>
                <button type="button"
                        class="w-full text-left px-10 py-4 text-gray-700 font-medium transition-all duration-300 
                               hover:bg-[#f0f9f7] hover:text-[#4a7c74] border-l-4 border-transparent hover:border-[#4a7c74]"
                        th:classappend="${activeMenu == 'support'} ? ' bg-[#f0f9f7] text-[#4a7c74] border-[#4a7c74] font-semibold'"
                        onclick="toggleSubMenu('supportSubmenu')">
                    고객센터
                </button>
                <ul id="supportSubmenu" class="bg-gray-50 pb-2" th:classappend="${activeMenu != 'support'} ? ' hidden'">
                    <li><a th:href="@{/admin/support/notice}" class="block px-14 py-2 text-sm text-gray-600 hover:text-[#4a7c74]" th:classappend="${activeSubmenu == 'notice'} ? ' text-[#4a7c74] font-bold underline'">공지</a></li>
                    <li><a th:href="@{/admin/support/qna}" class="block px-14 py-2 text-sm text-gray-600 hover:text-[#4a7c74]" th:classappend="${activeSubmenu == 'qna'} ? ' text-[#4a7c74] font-bold underline'">Q&A</a></li>
                    <li><a th:href="@{/admin/support/policy}" class="block px-14 py-2 text-sm text-gray-600 hover:text-[#4a7c74]" th:classappend="${activeSubmenu == 'policy'} ? ' text-[#4a7c74] font-bold underline'">운영정책</a></li>
                </ul>
            </li>

            <li>
                <a th:href="@{/admin/adView}" 
                   class="block px-10 py-4 text-gray-700 font-medium transition-all duration-300 
                          hover:bg-[#f0f9f7] hover:text-[#4a7c74] border-l-4 border-transparent hover:border-[#4a7c74]"
                   th:classappend="${activeMenu == 'ads'} ? ' bg-[#f0f9f7] text-[#4a7c74] border-[#4a7c74] font-semibold'">
                    광고관리
                </a>
            </li>

            <li>
                <a th:href="@{/admin/keyword/keyword}" 
                   class="block px-10 py-4 text-gray-700 font-medium transition-all duration-300 
                          hover:bg-[#f0f9f7] hover:text-[#4a7c74] border-l-4 border-transparent hover:border-[#4a7c74]"
                   th:classappend="${activeMenu == 'keyword'} ? ' bg-[#f0f9f7] text-[#4a7c74] border-[#4a7c74] font-semibold'">
                    키워드관리
                </a>
            </li>

            <li>
                <button type="button"
                        class="w-full text-left px-10 py-4 text-gray-700 font-medium transition-all duration-300 
                               hover:bg-[#f0f9f7] hover:text-[#4a7c74] border-l-4 border-transparent hover:border-[#4a7c74]"
                        th:classappend="${activeMenu == 'filter'} ? ' bg-[#f0f9f7] text-[#4a7c74] border-[#4a7c74] font-semibold'"
                        onclick="toggleSubMenu('filterSubmenu')">
                    필터관리
                </button>
                <ul id="filterSubmenu" class="bg-gray-50 pb-2" th:classappend="${activeMenu != 'filter'} ? ' hidden'">
                    <li><a th:href="@{/admin/filter/field}" class="block px-14 py-2 text-sm text-gray-600 hover:text-[#4a7c74]" th:classappend="${activeSubmenu == 'category'} ? ' text-[#4a7c74] font-bold underline'">분야 필터</a></li>
                    <li><a th:href="@{/admin/filter/regions}" class="block px-14 py-2 text-sm text-gray-600 hover:text-[#4a7c74]" th:classappend="${activeSubmenu == 'region'} ? ' text-[#4a7c74] font-bold underline'">지역 필터</a></li>
                </ul>
            </li>
            <li>
                <a th:href="@{/admin/report}" 
                   class="block px-10 py-4 text-gray-700 font-medium transition-all duration-300 
                          hover:bg-[#f0f9f7] hover:text-[#4a7c74] border-l-4 border-transparent hover:border-[#4a7c74]"
                   th:classappend="${activeMenu == 'reports'} ? ' bg-[#f0f9f7] text-[#4a7c74] border-[#4a7c74] font-semibold'">
                    신고관리
                </a>
            </li>
        </ul>
    </nav>

    <script>
        function toggleSubMenu(id) {
            const submenu = document.getElementById(id);
            submenu.classList.toggle('hidden');
        }
    </script>
</aside>
</html>
