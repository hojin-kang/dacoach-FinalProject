<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="adminHeader" class="w-full flex justify-between items-center p-4 border-b">
    
    <a th:href="@{/admin/index}" class="text-2xl font-bold text-[#4a7c74] hover:opacity-80 transition-all">
        dacoach
    </a>

    <div class="relative w-1/2">
        <input type="text" class="w-full bg-gray-100 border-none rounded-full py-2 px-6 pr-10 focus:ring-2 focus:ring-[#4a7c74]" placeholder="검색어를 입력하세요">
        <i class="fa-solid fa-magnifying-glass absolute right-4 top-2.5 text-gray-500"></i>
    </div>

	<div class="text-gray-600 text-sm">
		관리자 <span class="font-bold text-gray-900"
			th:text="${session.loginAdmin != null ? session.loginAdmin.user_name : '관리자'}">
			홍길동 </span>님 | <a th:href="@{/admin/logout}" class="hover:underline ml-2">로그아웃</a>
	</div>
</div>
</html>
