<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="noticeForm">
    <style>
        .font-main { font-family: 'Pretendard', sans-serif; font-size: 14px; color: #374151; }
        
        /* 상세보기 박스 디자인 유지 */
        .write-container {
            background-color: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .form-row {
            display: flex;
            align-items: center;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            margin-bottom: 12px;
            overflow: hidden;
        }

        .form-label {
            width: 120px;
            background-color: #f9fafb; /* 살짝 배경색을 주어 구분 */
            padding: 12px 20px;
            font-weight: 600;
            color: #4b5563;
            border-right: 1px solid #d1d5db;
            text-align: center;
        }

        .form-input {
            flex: 1;
            padding: 12px 15px;
            border: none;
            outline: none;
            font-size: 14px;
        }

        .form-select {
            flex: 1;
            padding: 12px 15px;
            border: none;
            outline: none;
            background-color: transparent;
            cursor: pointer;
        }

        .form-textarea {
            width: 100%;
            height: 400px;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            padding: 20px;
            margin-top: 10px;
            resize: none;
            outline: none;
            font-size: 14px;
            line-height: 1.6;
        }
        
        .form-textarea:focus { border-color: #9dbbb5; }

        /* 하단 버튼 영역 */
        .action-bar {
            margin-top: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-cancel {
            background-color: #ffffff;
            color: #6b7280;
            padding: 10px 30px;
            border-radius: 8px;
            font-weight: 600;
            border: 1px solid #e5e7eb;
            cursor: pointer;
        }

        .btn-submit {
            background-color: #9dbbb5;
            color: white;
            padding: 10px 40px;
            border-radius: 8px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-submit:hover { background-color: #89a7a1; }
    </style>

    <div class="max-w-[1000px] mx-auto p-8 font-main">
        <h1 class="text-2xl font-bold text-gray-800 mb-8" 
            th:text="${content != null ? '공지사항 수정' : '공지사항 작성'}">공지사항 작성</h1>

        <form th:action="${content != null ? '/admin/support/notice/update' : '/admin/support/notice/insert'}" method="post">
            
            <input type="hidden" name="qna_idx" th:if="${content != null}" th:value="${content.qna_idx}">

            <div class="write-container">
                <div class="form-row">
                    <div class="form-label">작성자</div>
                    <input type="text" class="form-input"
                        th:value="${content != null ? content.user_name : (session.loginAdmin != null ? session.loginAdmin.user_name : '관리자')}"
                        readonly>
                    <input type="hidden" name="user_idx" th:if="${content == null}"
                        th:value="${session.loginAdmin != null ? session.loginAdmin.user_idx : ''}">
                </div>

                <div class="form-row">
                    <div class="form-label">제목</div>
                    <input type="text" name="title" class="form-input" 
                           th:value="${content != null ? content.title : ''}"
                           placeholder="제목을 입력해주세요." required>
                </div>

                <div class="form-row">
                    <div class="form-label">분류</div>
                    <select name="qna_type" class="form-select" required>
                        <option value="" disabled th:selected="${content == null}">분류를 선택해주세요</option>
                        <option value="서비스" th:selected="${content != null and content.qna_type == '서비스'}">서비스</option>
                        <option value="이벤트" th:selected="${content != null and content.qna_type == '이벤트'}">이벤트</option>
                        <option value="안내" th:selected="${content != null and content.qna_type == '안내'}">안내</option>
                        <option value="점검" th:selected="${content != null and content.qna_type == '점검'}">점검</option>
                    </select>
                </div>

                <textarea name="question" class="form-textarea" 
                          th:text="${content != null ? content.question : ''}"
                          placeholder="내용을 작성해주세요." required></textarea>
            </div>

            <div class="action-bar">
                <button type="button" class="btn-cancel" onclick="history.back()">취소</button>
                <button type="submit" class="btn-submit" 
                        th:text="${content != null ? '수정 완료' : '등록'}">등록</button>
            </div>
        </form>
    </div>
</div>
</html>
