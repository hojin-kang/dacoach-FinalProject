<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="noticeContent">
    <style>
        .font-main { font-family: 'Pretendard', -apple-system, sans-serif; font-size: 14px; color: #374151; }
        .text-mint-dark { color: #7a948f; }
        .bg-mint-main { background-color: #9dbbb5; }
        
        .detail-container {
            background-color: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 20px;
            padding: 0;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            overflow: hidden;
        }

        .detail-header {
            padding: 30px 40px;
            border-bottom: 1px solid #f3f4f6;
            background-color: #fcfdfd;
        }

        .category-badge {
            display: inline-block;
            color: #9dbbb5;
            font-weight: 700;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .detail-title {
            font-size: 24px;
            font-weight: 800;
            color: #1f2937;
            line-height: 1.4;
        }

        .detail-meta {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            color: #9ca3af;
            font-size: 13px;
        }

        .meta-item { display: flex; align-items: center; gap: 5px; }

        .detail-content {
            padding: 40px;
            min-height: 400px;
            line-height: 1.8;
            color: #4b5563;
            font-size: 15px;
            white-space: pre-wrap;
        }

        .action-bar {
            margin-top: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-list {
            background-color: #ffffff;
            color: #6b7280;
            padding: 10px 25px;
            border-radius: 10px;
            font-weight: 600;
            border: 1px solid #e5e7eb;
            transition: all 0.2s;
        }
        .btn-list:hover { background-color: #f9fafb; color: #374151; }

        .right-buttons { display: flex; gap: 10px; }

        .btn-edit {
            background-color: #9dbbb5;
            color: white;
            padding: 10px 25px;
            border-radius: 10px;
            font-weight: 600;
            border: none;
            cursor: pointer;
        }

        .btn-delete {
            background-color: #fef2f2;
            color: #ef4444;
            padding: 10px 25px;
            border-radius: 10px;
            font-weight: 600;
            border: 1px solid #fee2e2;
            cursor: pointer;
        }
    </style>

    <div class="max-w-[1000px] mx-auto p-8 font-main">
        <div class="flex items-center gap-2 mb-6 text-gray-400 text-sm">
            <span>공지관리</span>
            <i class="fa-solid fa-chevron-right text-[10px]"></i>
            <span class="text-gray-800 font-semibold">상세보기</span>
        </div>

        <div class="detail-container">
            <div class="detail-header">
                <span class="category-badge" th:text="'[' + ${content.qna_type} + ']'">[서비스]</span>
                
                <h1 class="detail-title" th:text="${content.title}">제목</h1>

                <div class="detail-meta">
                    <div class="meta-item">
                        <i class="fa-regular fa-user"></i>
                        <span th:text="${content.user_name}">관리자</span>
                    </div>
                    <div class="meta-item">
                        <i class="fa-regular fa-calendar"></i>
                        <span th:text="${content.created_at}">2026-02-09</span>
                    </div>
                </div>
            </div>

            <div class="detail-content" th:text="${content.question}">내용</div>
        </div>

        <div class="action-bar">
            <button type="button" class="btn-list"
                onclick="location.href='/admin/support/notice'">목록으로</button>

            <div class="right-buttons">
                <button type="button" class="btn-delete"
                    th:onclick="|if(confirm('정말 삭제하시겠습니까?')) location.href='/admin/support/notice/delete?idx=' + ${content.qna_idx}|">삭제</button>
                <button type="button" class="btn-edit"
                    th:onclick="|location.href='/admin/support/notice/edit?idx=' + ${content.qna_idx}|">수정하기</button>
            </div>
        </div>
    </div>
</div>
</html>
