<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="noticeList">
    <style>
        :root { --mint-bg: #f0f8f7; --mint-main: #9dbbb5; --mint-dark: #7a9a94; }
        .notice-admin-container { font-family: 'Pretendard', sans-serif; background-color: white; min-height: 800px; }
        .admin-top-bar { display: flex; align-items: flex-end; gap: 15px; padding-bottom: 20px; border-bottom: 3px solid var(--mint-bg); margin-bottom: 30px; }
        .admin-top-bar h1 { font-size: 24px; font-weight: 900; color: var(--mint-main); margin: 0; }
        .pagination-wrap { display: flex; justify-content: center; margin-top: 30px; gap: 8px; }
        .pagination-wrap a, .pagination-wrap b { display: inline-flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 10px; font-size: 14px; font-weight: 700; text-decoration: none; color: #9ca3af; border: 1px solid #f3f4f6; }
        .pagination-wrap b { background-color: var(--mint-main); color: white; }
    </style>

    <div class="max-w-[1100px] mx-auto p-10 notice-admin-container">
        <div class="admin-top-bar">
            <h1>Notice Management</h1>
        </div>

        <section class="control-panel">
            <div th:if="${not #lists.isEmpty(noticeList)}" th:each="notice : ${noticeList}" 
                 style="display: flex; border-bottom: 1px solid #eee; padding: 15px;">
                <div th:text="${notice['QNA_IDX']}" style="width: 50px;"></div>
                <div style="flex: 1;">
                    <a th:href="@{/admin/support/notice/content(qna_idx=${notice['QNA_IDX']})}"
                       th:text="|[${notice['QNA_TYPE']}] ${notice['TITLE']}|"></a>
                </div>
                <div th:text="${#dates.format(notice['CREATED_AT'], 'yyyy-MM-dd')}" style="width: 100px;"></div>
            </div>
        </section>

        <div class="pagination-wrap" th:utext="${pageStr}"></div>
        
        <div style="text-align: right; margin-top: 20px;">
            <button class="bg-[#9dbbb5] text-white px-8 py-2 rounded" 
                    onclick="location.href='/admin/support/notice/write'">글쓰기</button>
        </div>
    </div>
</div>
</html>
