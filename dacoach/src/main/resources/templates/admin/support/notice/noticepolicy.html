<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>공지사항 - 다코치</title>

<link rel="stylesheet" th:href="@{/css/main.css}" />
<link rel="stylesheet" th:href="@{/css/header.css}" />
<link rel="stylesheet" th:href="@{/css/footer.css}" />

<link rel="stylesheet"
	href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root {
	--mint-bg: #f0f8f7;
	--mint-main: #9dbbb5;
	--mint-dark: #7a9a94;
	--slate-text: #374151;
}

.notice-container {
	font-family: 'Pretendard', sans-serif;
	color: var(--slate-text);
	background-color: white;
	min-height: 800px;
}

.notice-top-bar {
	display: flex;
	align-items: flex-end;
	gap: 15px;
	padding-bottom: 20px;
	border-bottom: 3px solid var(--mint-bg);
	margin-bottom: 20px;
}

.notice-top-bar h1 {
	font-size: 24px;
	font-weight: 900;
	color: var(--mint-main);
	margin: 0;
}

.current-path {
	font-size: 14px;
	color: #9ca3af;
	font-weight: 500;
}

/* 카테고리 탭 */
.category-tabs {
	display: flex;
	gap: 10px;
	margin-bottom: 20px;
}

.category-tab {
	padding: 8px 22px;
	border-radius: 20px;
	border: 2px solid var(--mint-main);
	color: var(--mint-main);
	background-color: white;
	font-size: 14px;
	font-weight: 700;
	cursor: pointer;
	transition: 0.2s;
	text-decoration: none;
}

.category-tab:hover, .category-tab.active {
	background-color: var(--mint-main);
	color: white;
}

/* 리스트 스타일 */
.list-header {
	display: flex;
	padding: 0 20px 10px;
	border-bottom: 1px solid #eee;
	margin-bottom: 15px;
	font-size: 12px;
	font-weight: 800;
	color: #9ca3af;
	text-align: center;
}

.notice-item-card {
	display: flex;
	align-items: center;
	padding: 18px 25px;
	background-color: white;
	border-radius: 15px;
	border: 1px solid #f3f4f6;
	margin-bottom: 12px;
	transition: 0.2s;
	text-align: center;
	cursor: pointer;
}

.notice-item-card:hover {
	border-color: var(--mint-main);
	transform: translateY(-2px);
	box-shadow: 0 5px 15px rgba(0, 0, 0, 0.03);
}

/* 컬럼 너비 */
.col-idx {
	width: 80px;
	font-weight: 800;
	color: var(--mint-main);
}

.col-type {
	width: 100px;
}

.col-title {
	flex: 1;
	text-align: left;
	padding: 0 20px;
	font-weight: 700;
}

.col-date {
	width: 130px;
	color: #9ca3af;
}

/* 배지 스타일 */
.type-badge {
	padding: 4px 12px;
	border-radius: 12px;
	font-size: 11px;
	font-weight: 700;
}

.type-서비스 {
	background: #dbeafe;
	color: #1e40af;
}

.type-안내 {
	background: #e0e7ff;
	color: #5b21b6;
}

.type-이벤트 {
	background: #fef3c7;
	color: #92400e;
}

.type-점검 {
	background: #fee2e2;
	color: #991b1b;
}

/* 페이징 */
.pagination-wrap {
	text-align: center;
	margin-top: 40px;
	font-size: 15px;
}

.pagination-wrap a {
	color: var(--slate-text);
	text-decoration: none;
	padding: 5px 10px;
}

.pagination-wrap a:hover {
	color: var(--mint-main);
	font-weight: 800;
}

/* 읽기 모달 */
.modal {
	display: none;
	position: fixed;
	inset: 0;
	background: rgba(0, 0, 0, 0.4);
	z-index: 1000;
	align-items: center;
	justify-content: center;
	backdrop-filter: blur(4px);
}

.modal.show {
	display: flex;
}

.modal-box {
	width: 90%;
	max-width: 700px;
	background: #fff;
	border-radius: 30px;
	padding: 40px;
	box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
	max-height: 80vh;
	overflow-y: auto;
}

.modal-header {
	display: flex;
	justify-content: space-between;
	align-items: center;
	border-bottom: 2px solid var(--mint-bg);
	padding-bottom: 20px;
}

.modal-content {
	line-height: 1.8;
	padding: 20px 0;
	white-space: pre-wrap;
}

.btn-close {
	background: var(--mint-main);
	color: white;
	width: 100%;
	padding: 12px;
	border-radius: 12px;
	border: none;
	font-weight: 900;
	cursor: pointer;
}
</style>
</head>
<body>
	<div th:replace="~{layout/header :: siteHeader}"></div>

	<main class="notice-container">
		<div class="max-w-[1200px] mx-auto p-10"
			style="width: 1200px; margin: 0 auto; padding: 40px;">
			<div class="notice-top-bar">
				<h1>공지사항</h1>
				<span class="current-path">Notice Policy</span>
			</div>

			<div class="category-tabs">
				<a th:href="@{/admin/noticepolicy(type='서비스')}" class="category-tab"
					th:classappend="${type == '서비스' ? 'active' : ''}">서비스</a> <a
					th:href="@{/admin/noticepolicy(type='안내')}" class="category-tab"
					th:classappend="${type == '안내' ? 'active' : ''}">안내</a> <a
					th:href="@{/admin/noticepolicy(type='이벤트')}" class="category-tab"
					th:classappend="${type == '이벤트' ? 'active' : ''}">이벤트</a> <a
					th:href="@{/admin/noticepolicy(type='점검')}" class="category-tab"
					th:classappend="${type == '점검' ? 'active' : ''}">점검</a>
			</div>

			<div class="list-header">
				<div class="col-idx">번호</div>
				<div class="col-type">유형</div>
				<div class="col-title">제목</div>
				<div class="col-date">등록일</div>
			</div>

			<div class="notice-content">
				<div th:if="${#lists.isEmpty(noticeList)}"
					class="py-32 text-center text-gray-300 italic"
					style="padding: 100px 0; text-align: center; color: #ccc;">
					<i class="fa-regular fa-bell"
						style="font-size: 40px; display: block; margin-bottom: 10px; opacity: 0.3;"></i>
					등록된 공지사항이 없습니다
				</div>

				<div th:if="${not #lists.isEmpty(noticeList)}"
					th:each="n : ${noticeList}" class="notice-item-card"
					th:onclick="openNoticeModal([[${n['qna_type']}]], [[${n['title']}]], [[${n['question']}]], [[${n['created_at']}]])">
					<div class="col-idx" th:text="${n['RNUM']}"></div>
					<div class="col-type">
						<span class="type-badge"
							th:classappend="'type-' + ${n['qna_type']}"
							th:text="${n['qna_type']}"></span>
					</div>
					<div class="col-title" th:text="${n['title']}"></div>
					<div class="col-date"
						th:text="${#dates.format(n['created_at'], 'yyyy-MM-dd')}"></div>
				</div>
			</div>

			<div th:if="${not #lists.isEmpty(noticeList)}"
				class="pagination-wrap" th:utext="${pageStr}"></div>
		</div>

		<div class="modal" id="noticeModal"
			onclick="if(event.target == this) closeNoticeModal()">
			<div class="modal-box">
				<div class="modal-header">
					<div style="flex: 1;">
						<div class="modal-type">
							<span class="type-badge" id="modalType">서비스</span>
						</div>
						<div class="modal-title-text" id="modalTitle"
							style="font-size: 20px; font-weight: 900; margin: 10px 0;">제목</div>
						<div class="modal-date" id="modalDate"
							style="color: #9ca3af; font-size: 13px;">2026-02-21</div>
					</div>
					<button type="button" onclick="closeNoticeModal()"
						style="border: none; background: none; font-size: 30px; cursor: pointer; color: #ccc;">&times;</button>
				</div>
				<div class="modal-content" id="modalContent">내용</div>
				<button type="button" class="btn-close" onclick="closeNoticeModal()">확인</button>
			</div>
		</div>
	</main>

	<div th:replace="~{layout/footer :: siteFooter}"></div>

	<script th:inline="javascript">
        function openNoticeModal(qnaType, title, content, createdAt) {
            const modal = document.getElementById('noticeModal');
            document.getElementById('modalType').textContent = qnaType;
            document.getElementById('modalType').className = 'type-badge type-' + qnaType;
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalContent').textContent = content || '내용이 없습니다.';

            const date = new Date(createdAt);
            document.getElementById('modalDate').textContent = 
                date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0') + '-' + String(date.getDate()).padStart(2, '0');
            
            modal.classList.add('show');
        }

        function closeNoticeModal() {
            document.getElementById('noticeModal').classList.remove('show');
        }
    </script>
</body>
</html>
