<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="contentPage">
	<style>
/* [사용자용 공지사항 - 민트 테마] */
:root {
	--mint-bg: #f0f8f7;
	--mint-main: #9dbbb5;
	--mint-dark: #7a9a94;
	--slate-text: #374151;
}

.notice-container {
	font-family: 'Pretendard', sans-serif;
	color: var(--slate-text);
	background-color: white;
	min-height: 800px;
}

/* [상단 헤더] */
.notice-top-bar {
	display: flex;
	align-items: flex-end;
	gap: 15px;
	padding-bottom: 20px;
	border-bottom: 3px solid var(--mint-bg);
	margin-bottom: 30px;
}

.notice-top-bar h1 {
	font-size: 24px;
	font-weight: 900;
	color: var(--mint-main);
	margin: 0;
}

.current-path {
	font-size: 14px;
	color: #9ca3af;
	font-weight: 500;
}

/* [리스트 헤더] */
.list-header {
	display: flex;
	padding: 0 20px 10px;
	border-bottom: 1px solid #eee;
	margin-bottom: 15px;
	font-size: 12px;
	font-weight: 800;
	color: #9ca3af;
	text-align: center;
}

/* [공지사항 카드] */
.notice-item-card {
	display: flex;
	align-items: center;
	padding: 18px 25px;
	background-color: white;
	border-radius: 15px;
	border: 1px solid #f3f4f6;
	margin-bottom: 12px;
	transition: 0.2s;
	text-align: center;
	cursor: pointer;
}

.notice-item-card:hover {
	border-color: var(--mint-main);
	transform: translateY(-2px);
	box-shadow: 0 5px 15px rgba(0, 0, 0, 0.03);
}

/* 열 너비 */
.col-idx {
	width: 80px;
	font-weight: 800;
	color: var(--mint-main);
	font-size: 13px;
}

.col-type {
	width: 100px;
}

.col-title {
	flex: 1;
	text-align: left;
	padding: 0 20px;
	font-weight: 700;
	font-size: 15px;
}

.col-date {
	width: 130px;
	color: #9ca3af;
	font-size: 13px;
}

/* 타입 배지 */
.type-badge {
	padding: 4px 12px;
	border-radius: 12px;
	font-size: 11px;
	font-weight: 700;
}

.type-서비스 {
	background: #dbeafe;
	color: #1e40af;
}

.type-안내 {
	background: #e0e7ff;
	color: #5b21b6;
}

.type-이벤트 {
	background: #fef3c7;
	color: #92400e;
}

.type-점검 {
	background: #fee2e2;
	color: #991b1b;
}

/* [모달 - 읽기 전용] */
.modal {
	display: none;
	position: fixed;
	inset: 0;
	background: rgba(0, 0, 0, 0.4);
	z-index: 1000;
	align-items: center;
	justify-content: center;
	backdrop-filter: blur(4px);
}

.modal.show {
	display: flex;
}

.modal-box {
	width: 90%;
	max-width: 700px;
	background: #fff;
	border-radius: 30px;
	padding: 40px;
	box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
	max-height: 80vh;
	overflow-y: auto;
}

.modal-header {
	display: flex;
	justify-content: space-between;
	align-items: center;
	margin-bottom: 25px;
	padding-bottom: 20px;
	border-bottom: 2px solid var(--mint-bg);
}

.modal-type {
	display: inline-block;
	margin-bottom: 10px;
}

.modal-title-text {
	font-size: 22px;
	font-weight: 900;
	color: var(--slate-text);
	margin-bottom: 15px;
}

.modal-date {
	font-size: 13px;
	color: #9ca3af;
}

.modal-content {
	line-height: 1.8;
	color: var(--slate-text);
	white-space: pre-wrap;
	padding: 20px 0;
}

.btn-close {
	background-color: var(--mint-main);
	color: white;
	padding: 12px 30px;
	border-radius: 12px;
	font-weight: 900;
	border: none;
	cursor: pointer;
	transition: 0.2s;
	width: 100%;
	margin-top: 20px;
}

.btn-close:hover {
	background-color: var(--mint-dark);
}
</style>

	<div class="max-w-[1200px] mx-auto p-10 notice-container">
		<div class="notice-top-bar">
			<h1>공지사항</h1>
			<span class="current-path">Notice</span>
		</div>

		<div class="list-header">
			<div class="col-idx">번호</div>
			<div class="col-type">유형</div>
			<div class="col-title">제목</div>
			<div class="col-date">등록일</div>
		</div>

		<div class="notice-content">
			<div th:if="${#lists.isEmpty(noticeList)}"
				class="py-32 text-center text-gray-300 italic">
				<i class="fa-regular fa-bell mb-3 block text-5xl opacity-20"></i>
				등록된 공지사항이 없습니다.
			</div>

			<div th:if="${not #lists.isEmpty(noticeList)}"
				th:each="n : ${noticeList}" class="notice-item-card"
				th:onclick="openNoticeModal([[${n.qna_type}]], [[${n.title}]], [[${n.question}]], [[${n.created_at}]])">

				<div class="col-idx" th:text="${n.qna_idx}"></div>
				<div class="col-type">
					<span class="type-badge" th:classappend="'type-' + ${n.qna_type}"
						th:text="${n.qna_type}"></span>
				</div>
				<div class="col-title" th:text="${n.title}"></div>
				<div class="col-date"
					th:text="${#dates.format(n.created_at, 'yyyy-MM-dd')}"></div>
			</div>
		</div>

		<!-- 읽기 전용 모달 -->
		<div class="modal" id="noticeModal"
			onclick="if(event.target == this) closeNoticeModal()">
			<div class="modal-box">
				<div class="modal-header">
					<div style="flex: 1;">
						<div class="modal-type">
							<span class="type-badge" id="modalType">서비스</span>
						</div>
						<div class="modal-title-text" id="modalTitle">공지사항 제목</div>
						<div class="modal-date" id="modalDate">2024-02-18</div>
					</div>
					<button type="button" onclick="closeNoticeModal()"
						style="border: none; background: none; cursor: pointer; font-size: 28px; color: #ccc; margin-left: 20px;">&times;</button>
				</div>

				<div class="modal-content" id="modalContent">공지사항 내용이 여기에
					표시됩니다.</div>

				<button type="button" class="btn-close" onclick="closeNoticeModal()">닫기</button>
			</div>
		</div>
	</div>

	<script th:inline="javascript">
    function openNoticeModal(qnaType, title, content, createdAt) {
        const modal = document.getElementById('noticeModal');
        
        // 타입 배지 설정
        const typeBadge = document.getElementById('modalType');
        typeBadge.textContent = qnaType;
        typeBadge.className = 'type-badge type-' + qnaType;
        
        document.getElementById('modalTitle').textContent = title;
        document.getElementById('modalContent').textContent = content;
        
        // 날짜 포맷팅
        const date = new Date(createdAt);
        const formattedDate = date.getFullYear() + '-' + 
                              String(date.getMonth() + 1).padStart(2, '0') + '-' + 
                              String(date.getDate()).padStart(2, '0');
        document.getElementById('modalDate').textContent = formattedDate;
        
        modal.classList.add('show');
    }
    
    function closeNoticeModal() {
        document.getElementById('noticeModal').classList.remove('show');
    }
    </script>
</div>
</html>
