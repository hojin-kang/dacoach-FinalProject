<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
<meta charset="UTF-8">
<title>운영정책 - 다코치</title>

<link rel="stylesheet" th:href="@{/css/main.css}" />
<link rel="stylesheet" th:href="@{/css/header.css}" />
<link rel="stylesheet" th:href="@{/css/footer.css}" />

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root {
	--mint-bg: #f0f8f7;
	--mint-main: #9dbbb5;
	--mint-dark: #7a9a94;
	--slate-text: #374151;
}

.policy-container {
	font-family: 'Pretendard', sans-serif;
	color: var(--slate-text);
	background-color: white;
	min-height: 800px;
}

/* 상단 타이틀 바 (공지사항 페이지와 동일한 스타일 적용) */
.policy-top-bar {
	display: flex;
	align-items: flex-end;
	gap: 15px;
	padding-bottom: 20px;
	border-bottom: 3px solid var(--mint-bg);
	margin-bottom: 40px;
}

.policy-top-bar h1 {
	font-size: 24px;
	font-weight: 900;
	color: var(--mint-main);
	margin: 0;
}

.current-path {
	font-size: 14px;
	color: #9ca3af;
	font-weight: 500;
}

/* 정책 아이템 박스 */
.policy-item {
	margin-top: 20px;
}

.policy-item h3 {
	font-size: 20px;
	color: #0f172a;
	margin-bottom: 15px;
	padding-left: 12px;
	border-left: 4px solid var(--mint-main);
}

/* 본문 내용 */
.content {
	font-size: 15px;
	color: var(--slate-text);
	white-space: pre-wrap; /* 줄바꿈 유지 */
	word-break: break-all;
	background-color: #f8fafc;
	padding: 30px;
	border-radius: 15px;
	min-height: 400px;
	border: 1px solid #f3f4f6;
	line-height: 1.8;
}

.empty-state {
	padding: 100px 0;
	text-align: center;
	color: #ccc;
	font-style: italic;
}
</style>
</head>
<body>
	<div th:replace="~{layout/header :: siteHeader}"></div>

	<main class="policy-container">
		<div class="max-w-[1200px] mx-auto p-10" style="width: 1200px; margin: 0 auto; padding: 40px;">
			
			<div class="policy-top-bar">
				<h1>이용약관 및 정책</h1>
				<span class="current-path">Operations Policy</span>
			</div>
			
			<div th:if="${latestPolicy != null}" class="policy-item">
				<h3 th:text="${latestPolicy.title}">정책 제목</h3>
				<div class="content" th:text="${latestPolicy.question}">
					여기에 정책 상세 내용이 출력됩니다.
				</div>
			</div>
			
			<div th:if="${latestPolicy == null}" class="empty-state">
				<i class="fa-regular fa-file-lines" style="font-size: 40px; display: block; margin-bottom: 10px; opacity: 0.3;"></i>
				등록된 정책 데이터가 없습니다.
			</div>
			
		</div>
	</main>

	<div th:replace="~{layout/footer :: siteFooter}"></div>

</body>
</html>
