<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="contentPage">
    <style>
        /* [공지사항 관리와 동일한 아이덴티티 적용] */
        :root {
            --mint-bg: #f0f8f7;
            --mint-main: #9dbbb5;
            --mint-dark: #7a9a94;
            --slate-text: #374151;
            --red-point: #ef4444;
        }

        .policy-admin-container {
            font-family: 'Pretendard', sans-serif;
            color: var(--slate-text);
            background-color: white;
            min-height: 800px;
        }

        /* [상단 헤더 영역] */
        .admin-top-bar {
            display: flex;
            align-items: flex-end;
            gap: 15px;
            padding-bottom: 20px;
            border-bottom: 3px solid var(--mint-bg);
            margin-bottom: 30px;
        }

        .admin-top-bar h1 {
            font-size: 24px;
            font-weight: 900;
            color: var(--mint-main);
            margin: 0;
        }

        .current-path {
            font-size: 14px;
            color: #9ca3af;
            font-weight: 500;
        }

        /* [리스트 헤더] */
        .list-header {
            display: flex;
            padding: 0 20px 10px;
            border-bottom: 1px solid #eee;
            margin-bottom: 15px;
            font-size: 12px;
            font-weight: 800;
            color: #9ca3af;
            text-align: center;
        }

        /* [카드형 리스트 스타일] */
        .policy-item-card {
            display: flex;
            align-items: center;
            padding: 18px 25px;
            background-color: white;
            border-radius: 15px;
            border: 1px solid #f3f4f6;
            margin-bottom: 12px;
            transition: 0.2s;
            text-align: center;
        }

        .policy-item-card:hover {
            border-color: var(--mint-main);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.03);
        }

        /* 열 너비 설정 (공지사항 구조 준수) */
        .col-idx { width: 80px; font-weight: 800; color: var(--mint-main); font-size: 13px; }
        .col-title { flex: 1; text-align: left; padding: 0 20px; font-weight: 700; font-size: 15px; }
        .col-writer { width: 150px; font-weight: 600; }
        .col-manage { width: 200px; display: flex; gap: 8px; justify-content: center; }

        /* 작성자 태그 */
        .author-tag {
            background: var(--mint-bg);
            color: var(--mint-main);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
        }

        /* 버튼 스타일 */
        .btn-mint {
            background-color: var(--mint-main);
            color: white;
            padding: 10px 25px;
            border-radius: 12px;
            font-weight: 900;
            border: none;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 4px 10px rgba(157, 187, 181, 0.3);
        }

        .btn-mint:hover { background-color: var(--mint-dark); transform: translateY(-1px); }

        .btn-outline {
            background: white;
            border: 1px solid #e5e7eb;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
            color: #6b7280;
            transition: 0.2s;
        }

        .btn-outline:hover { background: #f9fafb; border-color: var(--mint-main); color: var(--mint-main); }

        /* [모달 스타일 - 민트 테마] */
        .modal {
            display: none; position: fixed; inset: 0; background: rgba(0, 0, 0, 0.4);
            z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(4px);
        }
        .modal.show { display: flex; }
        .modal-box {
            width: 90%; max-width: 650px; background: #fff; border-radius: 30px; padding: 40px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
        }
        .form-label { display: block; margin-bottom: 10px; font-weight: 800; font-size: 14px; color: var(--slate-text); }
        .form-input, .form-textarea {
            width: 100%; border: 2px solid #f3f4f6; border-radius: 15px; padding: 14px;
            outline: none; transition: 0.2s; background: #f9fafb; font-family: inherit;
        }
        .form-input:focus, .form-textarea:focus { border-color: var(--mint-main); background: white; }
        .form-textarea { min-height: 250px; resize: none; }
    </style>

    <div class="max-w-[1200px] mx-auto p-10 policy-admin-container">
        <div class="admin-top-bar">
            <h1>Policy Management</h1>
            <span class="current-path">Support / Policy & Terms</span>
        </div>

        <div class="flex justify-between items-center mb-6">
            <div class="text-gray-400 text-sm font-medium">
                총 <span class="text-[#9dbbb5] font-bold" th:text="${#lists.size(policyList)}">0</span>건의 정책이 등록되어 있습니다.
            </div>
            <button type="button" class="btn-mint" onclick="openPolicyModal()">+ 새 정책 등록</button>
        </div>

        <div class="list-header">
            <div class="col-idx">IDX</div>
            <div class="col-title">POLICY TITLE</div>
            <div class="col-writer">WRITER</div>
            <div class="col-manage">MANAGEMENT</div>
        </div>

        <div class="policy-content">
            <div th:if="${#lists.isEmpty(policyList)}" class="py-32 text-center text-gray-300 italic">
                <i class="fa-regular fa-file-lines mb-3 block text-5xl opacity-20"></i>
                등록된 정책 데이터가 없습니다.
            </div>

            <div th:if="${not #lists.isEmpty(policyList)}" th:each="p : ${policyList}" class="policy-item-card">
                <div class="col-idx" th:text="${p.qna_idx}">1</div>
                <div class="col-title" th:text="${p.title}">개인정보 처리방침</div>
                <div class="col-writer">
                    <span class="author-tag" th:text="${p.login_id}">admin</span>
                </div>
                <div class="col-manage">
                    <button type="button" class="btn-outline"
                        th:onclick="openPolicyModal([[${p.qna_idx}]], [[${p.title}]], [[${p.question}]], [[${p.login_id}]])">
                        상세보기
                    </button>
                    <button type="button" class="btn-outline" style="color: var(--red-point);"
                        th:onclick="|if(confirm('정말 삭제하시겠습니까?')) location.href='@{/admin/support/policy/delete(qna_idx=${p.qna_idx})}'|">
                        삭제
                    </button>
                </div>
            </div>
        </div>

        <div class="modal" id="policyModal" onclick="if(event.target == this) closePolicyModal()">
            <div class="modal-box">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
                    <h2 id="modalTitle" style="font-size: 22px; font-weight: 900; color: var(--mint-main);">Policy Editor</h2>
                    <button type="button" onclick="closePolicyModal()" style="border: none; background: none; cursor: pointer; font-size: 28px; color: #ccc;">&times;</button>
                </div>

                <form th:action="@{/admin/support/policy/save}" method="post">
                    <input type="hidden" id="modalIdx" name="qna_idx">

                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
                        <div>
                            <label class="form-label">작성자</label>
                            <input type="text" class="form-input" id="modalAuthor" readonly style="color: #999;">
                        </div>
                        <div>
                            <label class="form-label">정책 구분</label>
                            <input type="text" class="form-input" value="Terms & Policy" readonly style="color: #999;">
                        </div>
                    </div>

                    <div style="margin-bottom: 20px;">
                        <label class="form-label">정책 제목</label>
                        <input type="text" class="form-input" id="modalTitleInput" name="title" placeholder="제목을 입력해 주세요" required>
                    </div>

                    <div>
                        <label class="form-label">정책 상세 내용</label>
                        <textarea class="form-textarea" id="modalQuestionInput" name="question" placeholder="내용을 상세히 입력해 주세요" required></textarea>
                    </div>

                    <div style="display: flex; justify-content: flex-end; gap: 12px; margin-top: 35px;">
                        <button type="button" class="btn-outline" style="padding: 12px 30px;" onclick="closePolicyModal()">취소</button>
                        <button type="submit" class="btn-mint" style="padding: 12px 40px;">정책 저장하기</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
    function openPolicyModal(idx, title, question, loginId) {
        const modal = document.getElementById('policyModal');
        
        document.getElementById('modalIdx').value = idx || 0; 
        document.getElementById('modalTitleInput').value = title || '';
        document.getElementById('modalQuestionInput').value = question || '';
        
        if (loginId) {
            document.getElementById('modalAuthor').value = loginId;
        } else {
            // 세션에서 로그인 아이디 가져오기 (공지사항과 동일한 방식 적용 권장)
            const currentAdmin = /*[[${session.loginUser?.login_id}]]*/ 'Admin';
            document.getElementById('modalAuthor').value = currentAdmin;
        }
        
        document.getElementById('modalTitle').textContent = idx ? 'Update Policy' : 'Create New Policy';
        modal.classList.add('show');
    }
    
    function closePolicyModal() {
        document.getElementById('policyModal').classList.remove('show');
    }
    </script>
</div>
</html>
