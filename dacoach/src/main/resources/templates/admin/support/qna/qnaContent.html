<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="qnaContent">
    <style>
        .font-main {
            font-family: 'Pretendard', -apple-system, sans-serif;
            font-size: 14px;
            color: #374151;
        }

        .detail-container {
            background-color: #ffffff;
            border: 1px solid #e5e7eb;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        /* 질문 헤더 */
        .detail-header {
            padding: 30px 40px;
            border-bottom: 1px solid #f3f4f6;
            background-color: #fcfdfd;
        }

        .category-badge {
            color: #9dbbb5;
            font-weight: 700;
            font-size: 13px;
            margin-bottom: 8px;
            display: block;
        }

        .detail-title {
            font-size: 24px;
            font-weight: 800;
            color: #1f2937;
            line-height: 1.4;
        }

        .detail-meta {
            display: flex;
            gap: 20px;
            margin-top: 15px;
            color: #9ca3af;
            font-size: 13px;
        }

        /* 본문 영역 */
        .content-section {
            padding: 40px;
            line-height: 1.8;
            color: #4b5563;
            font-size: 15px;
            white-space: pre-wrap;
        }

        /* 답변 영역 스타일 */
        .answer-container {
            margin-top: 30px;
            background-color: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 20px;
            overflow: hidden;
        }

        .answer-header {
            padding: 20px 40px;
            border-bottom: 1px solid #eee;
            background-color: #f0f4f3;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .answer-title {
            font-weight: 800;
            color: #7a948f;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .answer-info-bar {
            padding: 15px 40px;
            background-color: #ffffff;
            border-bottom: 1px solid #f3f4f6;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .ans-subject {
            font-size: 16px;
            font-weight: 700;
            color: #1f2937;
        }

        .ans-meta {
            font-size: 12px;
            color: #9ca3af;
        }

        .answer-content {
            padding: 40px;
            font-size: 15px;
            line-height: 1.8;
            color: #374151;
        }

        /* 입력 폼 스타일 */
        .answer-form-wrapper {
            padding: 30px 40px;
            background-color: #ffffff;
        }

        .answer-input-title {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
            outline-color: #9dbbb5;
        }

        .answer-textarea {
            width: 100%;
            min-height: 200px;
            padding: 15px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            resize: vertical;
            outline-color: #9dbbb5;
        }

        .btn-submit-answer {
            margin-top: 15px;
            background-color: #7a948f;
            color: white;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            float: right;
            margin-left: 10px;
        }

        .btn-cancel {
            margin-top: 15px;
            background-color: #f3f4f6;
            color: #6b7280;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: 600;
            border: none;
            cursor: pointer;
            float: right;
        }

        /* 버튼 스타일 */
        .action-bar {
            margin-top: 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-list {
            background-color: white;
            color: #6b7280;
            padding: 10px 25px;
            border-radius: 10px;
            font-weight: 600;
            border: 1px solid #e5e7eb;
            cursor: pointer;
        }

        .btn-edit {
            background-color: #9dbbb5;
            color: white;
            padding: 10px 25px;
            border-radius: 10px;
            font-weight: 600;
            border: none;
            cursor: pointer;
        }

        .btn-delete {
            background-color: #fef2f2;
            color: #ef4444;
            padding: 10px 25px;
            border-radius: 10px;
            font-weight: 600;
            border: 1px solid #fee2e2;
            cursor: pointer;
        }

        /* 유틸리티 */
        .hidden {
            display: none !important;
        }
    </style>

    <div class="max-w-[1000px] mx-auto p-8 font-main" th:if="${content != null}">
        <div class="flex items-center gap-2 mb-6 text-gray-400 text-sm">
            <span>고객지원</span>
            <i class="fa-solid fa-chevron-right text-[10px]"></i>
            <span>1:1 문의관리</span>
            <i class="fa-solid fa-chevron-right text-[10px]"></i>
            <span class="text-gray-800 font-semibold">문의 상세</span>
        </div>

        <div class="detail-container">
            <div class="detail-header">
                <span class="category-badge" th:text="'[' + ${content['QNA_TYPE']} + ']'">[유형]</span>
                <h1 class="detail-title" th:text="${content['Q_TITLE']}">문의 제목</h1>
                <div class="detail-meta">
                    <div class="meta-item">👤 <span th:text="${content['USER_NAME']}">작성자</span></div>
                    <div class="meta-item">📅 <span th:text="${content['Q_CREATED_AT']}">2026-02-11</span></div>
                </div>
            </div>
            <div class="content-section" th:text="${content['QUESTION']}">질문 내용</div>
        </div>

        <div class="answer-container">
            <div class="answer-header">
                <div class="answer-title">
                    <span>💬</span> 관리자 답변
                </div>
                <div th:if="${content['QNA_A_IDX'] != null}" class="text-xs text-gray-400">
                    답변일: <span th:text="${content['A_CREATED_AT']}">2026-02-11</span>
                </div>
            </div>
            
            <th:block th:if="${content['QNA_A_IDX'] != null}">
                <div id="answerView">
                    <div class="answer-info-bar">
                        <div class="ans-subject" th:text="${content['A_TITLE']}">답변 제목</div>
                        <div class="ans-meta">
                            작성자: <span th:text="${session.loginAdmin != null ? session.loginAdmin.user_name : '관리자'}">관리자</span>
                        </div>
                    </div>
                    <div class="answer-content" th:text="${content['ANSWER']}">답변 내용</div>
                </div>

				<div id="editFormWrapper" class="answer-form-wrapper hidden">
					<form action="/admin/support/qna/update" method="post"
						id="updateForm">
						<input type="hidden" name="qna_idx"
							th:value="${content['QNA_IDX']}"> <input type="hidden"
							name="qna_a_idx" th:value="${content['QNA_A_IDX']}"> <input
							type="text" name="title" class="answer-input-title"
							th:value="${content['A_TITLE']}" required>
						<textarea name="answer" class="answer-textarea"
							th:text="${content['ANSWER']}" required></textarea>

						<div class="overflow-hidden">
							<button type="submit" class="btn-submit-answer">수정 완료</button>
							<button type="button" class="btn-cancel"
								onclick="toggleEdit(false)">취소</button>
						</div>
					</form>
				</div>
			</th:block>
            
            <div th:if="${content['QNA_A_IDX'] == null}" class="answer-form-wrapper">
                <form action="/admin/support/qna/insert" method="post" id="insertForm">
                    <input type="hidden" name="qna_idx" th:value="${content['QNA_IDX']}">
                    <input type="text" name="title" class="answer-input-title" th:value="'Re: ' + ${content['Q_TITLE']}" placeholder="답변 제목을 입력해주세요." required>
                    <textarea name="answer" class="answer-textarea" placeholder="답변 내용을 상세히 작성해주세요." required></textarea>
                    <div class="overflow-hidden">
                        <button type="submit" class="btn-submit-answer">답변 등록하기</button>
                    </div>
                </form>
            </div>
        </div>

		<div class="action-bar">
			<button type="button" class="btn-list"
				onclick="location.href='/admin/support/qna'">목록으로</button>
			<div class="flex gap-2">
				<button th:if="${content['QNA_A_IDX'] != null}" type="button"
					class="btn-delete"
					th:onclick="deleteQna([[${content['QNA_IDX']}]], [[${content['QNA_A_IDX']}]])">
					답변 삭제</button>

				<button th:if="${content['QNA_A_IDX'] != null}" type="button"
					id="btnEditTrigger" class="btn-edit" onclick="toggleEdit(true)">
					답변 수정</button>
			</div>
		</div>
	</div>

    <div th:if="${content == null}" class="text-center p-20 text-gray-400">
        해당 문의 내역을 찾을 수 없습니다.
    </div>

    <script th:inline="javascript">
        // 1. 답변 수정 모드 토글 함수
        function toggleEdit(isEditMode) {
            const viewArea = document.getElementById('answerView');
            const editArea = document.getElementById('editFormWrapper');
            const editBtn = document.getElementById('btnEditTrigger');

            if (isEditMode) {
                viewArea.classList.add('hidden');
                editArea.classList.remove('hidden');
                editBtn.classList.add('hidden');
            } else {
                viewArea.classList.remove('hidden');
                editArea.classList.add('hidden');
                editBtn.classList.remove('hidden');
            }
        }

        // 2. 삭제 확인 함수
        function deleteQna(qIdx, aIdx) {
		   	if (confirm('이 답변을 정말 삭제하시겠습니까?')) {
		        const form = document.createElement('form');
		        form.method = 'POST';
		        form.action = '/admin/support/qna/delete';
		
		        // 질문 번호 (다시 돌아오기 위해 필요)
		        const inputQ = document.createElement('input');
		        inputQ.type = 'hidden';
		        inputQ.name = 'qna_idx';
		        inputQ.value = qIdx;
		        form.appendChild(inputQ);
		
		        // 답변 번호 (삭제하기 위해 필요)
		        const inputA = document.createElement('input');
		        inputA.type = 'hidden';
		        inputA.name = 'qna_a_idx';
		        inputA.value = aIdx;
		        form.appendChild(inputA);
		
		        document.body.appendChild(form);
		        form.submit();
		    }
		}
        
        // 3. 등록/수정 전 확인 컨펌
        document.getElementById('insertForm')?.addEventListener('submit', function(e) {
            if(!confirm('답변을 등록하시겠습니까?')) e.preventDefault();
        });
        document.getElementById('updateForm')?.addEventListener('submit', function(e) {
            if(!confirm('답변을 수정하시겠습니까?')) e.preventDefault();
        });
    </script>
</div>
</html>
