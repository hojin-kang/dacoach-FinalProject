<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="qnaList">
    <style>
        /* [공지사항 관리와 동일한 아이덴티티 적용] */
        :root {
            --mint-bg: #f0f8f7;
            --mint-main: #9dbbb5;
            --mint-dark: #7a9a94;
            --slate-text: #374151;
        }

        .qna-admin-container {
            font-family: 'Pretendard', sans-serif;
            color: var(--slate-text);
            background-color: white;
            min-height: 800px;
        }

        /* [상단 헤더 영역] */
        .admin-top-bar {
            display: flex;
            align-items: flex-end;
            gap: 15px;
            padding-bottom: 20px;
            border-bottom: 3px solid var(--mint-bg);
            margin-bottom: 30px;
        }

        .admin-top-bar h1 {
            font-size: 24px;
            font-weight: 900;
            color: var(--mint-main);
            margin: 0;
        }

        .current-path {
            font-size: 14px;
            color: #9ca3af;
            font-weight: 500;
        }

        /* [검색 및 제어 영역] */
        .control-panel {
            margin-bottom: 25px;
            width: 100%;
        }

        .search-box {
            display: flex;
            gap: 10px;
            background-color: var(--mint-bg);
            padding: 15px 25px;
            border-radius: 20px;
            align-items: center;
            margin-bottom: 25px;
        }

        .search-input {
            flex: 1;
            border: 1px solid white;
            border-radius: 10px;
            padding: 8px 15px;
            font-size: 13px;
            outline: none;
            transition: 0.2s;
        }

        .search-input:focus {
            border-color: var(--mint-main);
        }

        .btn-search {
            background-color: var(--mint-main);
            color: white;
            padding: 8px 25px;
            border-radius: 10px;
            font-weight: 800;
            border: none;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-search:hover {
            background-color: var(--mint-dark);
        }

        /* 답변 상태 배지 스타일 */
        .status-badge {
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 800;
            display: inline-block;
        }
        .status-waiting {
            background-color: #fee4e2;
            color: #f04438;
        }
        .status-complete {
            background-color: var(--mint-main);
            color: white;
        }

        /* 테이블 헤더 스타일 - 유동적 레이아웃 적용 */
        .list-header {
            display: flex;
            padding: 0 20px 10px;
            border-bottom: 1px solid #eee;
            margin-bottom: 15px;
            font-size: 12px;
            font-weight: 800;
            color: #9ca3af;
            text-align: center;
            gap: 10px;
        }

        /* 리스트 카드형 스타일 - 유동적 레이아웃 적용 */
        .qna-item-card {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            background-color: white;
            border-radius: 15px;
            border: 1px solid #f3f4f6;
            margin-bottom: 10px;
            transition: 0.2s;
            text-align: center;
            cursor: pointer;
            gap: 10px;
        }

        .qna-item-card:hover {
            border-color: var(--mint-main);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.03);
        }

        /* 열 너비 설정 - 유동성 확보를 위한 Flex 설정 */
        .col-status { width: 90px; flex-shrink: 0; }
        .col-title { 
            flex: 1; 
            text-align: left; 
            padding: 0 20px; 
            font-weight: 700;
            min-width: 0; /* 말줄임 작동을 위한 설정 */
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .col-writer { 
            width: 15%; 
            min-width: 120px; 
            font-weight: 600; 
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .col-date { width: 110px; flex-shrink: 0; color: #9ca3af; }
        
        /* 문의 유형 텍스트 */
        .type-tag {
            color: var(--mint-main);
            font-weight: 800;
            margin-right: 5px;
        }
        
        /* [페이지네이션] */
        .pagination-wrap {
            display: flex;
            justify-content: center;
            margin-top: 30px;
        }

        .pagination-wrap a, .pagination-wrap span {
            display: inline-block;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
            color: #9ca3af;
            transition: 0.2s;
            border: 1px solid transparent;
            background-color: white;
            margin: 0 4px;
        }

        .pagination-wrap a:hover {
            background-color: var(--mint-bg);
            color: var(--mint-main);
        }

        .pagination-wrap .active, .pagination-wrap b {
            background-color: var(--mint-main);
            color: white;
            padding: 8px 14px;
            border-radius: 10px;
        }
    </style>

    <div class="w-full px-10 py-10 qna-admin-container">
        <div class="admin-top-bar">
            <h1>1:1 Q&A Management</h1>
            <span class="current-path">Support / Q&A List</span>
        </div>

        <section class="control-panel">
            <form action="/admin/support/qna" method="get">
                <div class="search-box">
                    <span style="font-size: 20px; margin-right: 5px;">🔍</span>
                    <input type="text" name="keyword" class="search-input" 
                           placeholder="검색어(상태, 제목, 작성자)를 입력하세요" th:value="${keyword}">
                    <button type="submit" class="btn-search">Search</button>
                </div>
            </form>

            <div class="list-header">
                <div class="col-status">STATUS</div>
                <div class="col-title">INQUIRY TITLE</div>
                <div class="col-writer">USER</div>
                <div class="col-date">DATE</div>
            </div>

            <div th:if="${not #lists.isEmpty(qnaList)}" th:each="qna : ${qnaList}" 
                 th:onclick="|location.href='/admin/support/qna/content?qna_idx=' + ${qna.QNA_IDX}|"
                 class="qna-item-card">

				<div class="col-status">
					<span th:text="${qna.STATUS}"
						th:classappend="${qna.STATUS == '대기' ? 'status-badge status-waiting' : 'status-badge status-complete'}">
					</span>
				</div>

				<div class="col-title" th:title="'[' + ${qna.QNA_TYPE} + '] ' + ${qna.TITLE}">
                    <span class="type-tag" th:text="'[' + ${qna.QNA_TYPE} + ']'"></span>
                    <span th:text="${qna.TITLE}" class="hover:text-[#9dbbb5] transition-colors"></span>
                </div>

                <div class="col-writer" th:text="${qna.USER_NAME}"></div>

                <div class="col-date" th:text="${#strings.substring(qna.CREATED_AT, 0, 10)}"></div>
            </div>

            <div th:if="${#lists.isEmpty(qnaList)}" class="text-center py-24 text-gray-300 italic border-2 border-dashed border-gray-100 rounded-3xl mt-4">
                등록된 문의 내역이 없습니다.
            </div>
        </section>

        <div class="pagination-wrap" th:if="${not #lists.isEmpty(qnaList)}">
            <div th:utext="${pageStr}"></div>
        </div>
    </div>
</div>
</html>
