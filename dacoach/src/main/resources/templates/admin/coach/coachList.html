<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="coachContent">
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-xl font-bold text-gray-800">개인고객관리</h2>
    </div>

    <div class="card !p-0 overflow-hidden"> 
        <table class="w-full text-center border-collapse">
            <thead class="table-thead">
                <tr>
                    <th class="py-3 px-4 border-b border-gray-200">번호</th>
                    <th class="py-3 px-4 border-b border-gray-200">이름</th>
                    <th class="py-3 px-4 border-b border-gray-200">생년월일</th>
                    <th class="py-3 px-4 border-b border-gray-200">상태</th>
                </tr>
            </thead>
            <tbody class="bg-white">
                <tr th:each="user : ${userList}" class="border-b border-gray-100 hover:bg-gray-50">
                    <td class="py-4" th:text="${user.id}">1234</td>
                    <td class="py-4 font-bold" th:text="${user.name}">홍길동</td>
                    <td class="py-4" th:text="${user.birth}">990101</td>
                    <td class="py-4 text-red-500 font-bold" th:text="${user.status}">정지</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
