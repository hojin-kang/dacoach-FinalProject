<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="coachContent">
    <div class="flex justify-between items-center mb-6">
        <div class="flex items-center gap-3">
            <h2 class="text-xl font-bold text-gray-800">개인고객관리</h2>
            <div class="flex items-center bg-pink-100 px-3 py-1 rounded-full border border-pink-200">
                <span class="text-xs font-semibold text-pink-600">자격증 승인 대기</span>
                <span class="ml-2 text-sm font-bold text-pink-700" th:text="${certCount}">0</span>
                <span class="ml-0.5 text-xs text-pink-600">건</span>
            </div>
        </div>
    </div>

    <div class="card !p-0 overflow-hidden">
        <table class="w-full text-center border-collapse">
            <thead class="table-thead">
                <tr>
                    <th class="py-3 px-4 border-b border-gray-200">코치고유번호</th>
                    <th class="py-3 px-4 border-b border-gray-200">이름</th>
                    <th class="py-3 px-4 border-b border-gray-200">닉네임</th>
                    <th class="py-3 px-4 border-b border-gray-200">연락처</th>
                    <th class="py-3 px-4 border-b border-gray-200">등록일자</th>
                    <th class="py-3 px-4 border-b border-gray-200">계정상태</th>
					<th
						class="py-3 px-4 border-b border-gray-200 text-pink-600 cursor-pointer hover:bg-pink-50 transition-colors"
						onclick="sortCertCount()">자격증 확인 <span id="sortIcon">↕️</span>
					</th>
				</tr>
            </thead>
            <tbody class="bg-white">
                <tr th:if="${#lists.isEmpty(coachList)}">
                    <td colspan="7" class="py-10 text-gray-500">등록된 코치가 없습니다.</td>
                </tr>

                <tr th:unless="${#lists.isEmpty(coachList)}"
                    th:each="coach : ${coachList}"
                    class="border-b border-gray-100 hover:bg-gray-50">

                    <td class="py-4" th:text="${coach.COACH_IDX}"></td>
                    <td class="py-4 font-bold">
                    	<a th:text="${coach.USER_NAME}" th:href="@{/admin/coach/coachDetail(coachIdx=${coach.COACH_IDX},userIdx=${coach.USER_IDX})}"></a>
                    </td>
                    <td class="py-4" th:text="${coach.NICKNAME}"></td>
                    <td class="py-4" th:text="${coach.PHONE}"></td>
                    <td class="py-4" th:text="${coach.CREATED_AT != null ? #dates.format(coach.CREATED_AT, 'yyyy-MM-dd') : '-'}"></td>
                    
                    <td class="py-4">
                        <span class="px-3 py-1 rounded-full text-xs font-bold"
                              th:classappend="${coach.STATUS == 'SUSPENDED' ? 'bg-red-100 text-red-600' : 
                                               (coach.STATUS == 'ACTIVE' ? 'bg-blue-100 text-blue-600' : 'bg-gray-100 text-gray-600')}"
                              th:text="${coach.STATUS == 'ACTIVE' ? '사용' : 
                                        (coach.STATUS == 'INACTIVE' ? '휴면' : '정지')}">
                        </span>
                    </td>
					<td class="py-4">
						<div th:if="${coach.CERT_WAIT_COUNT > 0}">
							<span
								class="px-2 py-1 rounded bg-orange-100 text-orange-600 text-xs font-bold border border-orange-200">
								확인필요 <span th:text="${coach.CERT_WAIT_COUNT}"></span>건
							</span>
						</div>
						<div th:unless="${coach.CERT_WAIT_COUNT > 0}">
							<span class="text-gray-300 text-xs italic text-center">확인완료</span>
						</div>
					</td>
				</tr>
            </tbody>
        </table>
    </div>
	<script th:inline="javascript">
    let isAsc = false; // 정렬 상태 추적 (내림차순/오름차순)

    function sortCertCount() {
        const tbody = document.querySelector('tbody.bg-white');
        const rows = Array.from(tbody.querySelectorAll('tr:not(.text-gray-500)')); // 데이터가 없는 행 제외
        const icon = document.getElementById('sortIcon');

        if (rows.length === 0) return;

        // 정렬 로직
        rows.sort((a, b) => {
            // "확인필요 3건" 문자열에서 숫자만 추출, 없으면 0
            const valA = parseInt(a.querySelector('td:nth-child(7) span span')?.innerText || 0);
            const valB = parseInt(b.querySelector('td:nth-child(7) span span')?.innerText || 0);

            return isAsc ? valA - valB : valB - valA;
        });

        // 정렬된 행을 다시 삽입
        rows.forEach(row => tbody.appendChild(row));

        // 상태 및 아이콘 변경
        isAsc = !isAsc;
        icon.innerText = isAsc ? '🔺' : '🔻';
    }
</script>
</div>
