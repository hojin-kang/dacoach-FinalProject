<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="coachInfoContent">
    <style>
        :root {
            --mint-bg: #f0f8f7;
            --mint-main: #9dbbb5;
            --mint-dark: #7a9a94;
            --slate-text: #374151;
            --gray-light: #9ca3af;
        }

        .coach-admin-container { font-family: 'Pretendard', sans-serif; color: var(--slate-text); background-color: white; padding: 40px; }

        /* 헤더 섹션 */
        .admin-top-bar { 
            display: flex; align-items: flex-end; gap: 15px; 
            padding-bottom: 20px; border-bottom: 3px solid var(--mint-bg); margin-bottom: 30px;
        }
        .admin-top-bar h1 { font-size: 24px; font-weight: 900; color: var(--mint-main); margin: 0; }
        
        /* 요약 카드 */
        .summary-row { display: flex; gap: 20px; margin-bottom: 30px; }
        .stat-card {
            flex: 1; background: var(--mint-bg); padding: 20px; border-radius: 15px;
            display: flex; flex-direction: column; gap: 5px;
        }
        .stat-label { font-size: 13px; font-weight: 700; color: var(--mint-dark); }
        .stat-value { font-size: 22px; font-weight: 900; color: var(--mint-main); }

        /* 테이블 헤더 */
        .list-header { 
            display: flex; padding: 15px 20px; background-color: #fcfdfd;
            border-bottom: 2px solid var(--mint-bg); margin-bottom: 10px;
            font-size: 13px; font-weight: 800; color: var(--gray-light); text-align: center;
        }

        /* 코치 아이템 카드 */
        .coach-item-card {
            display: flex; align-items: center; padding: 15px 20px;
            background-color: white; border-radius: 15px; border: 1px solid #f3f4f6;
            margin-bottom: 10px; transition: 0.2s; text-align: center;
        }
        .coach-item-card:hover { border-color: var(--mint-main); transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.03); }

        /* 컬럼 너비 설정 */
        .col-photo { width: 60px; }
        .col-idx { width: 70px; font-weight: 800; color: var(--mint-main); }
        .col-nick { width: 150px; font-weight: 700; text-align: left; padding-left: 10px; }
        .col-email { flex: 1; text-align: left; color: #6b7280; }
        .col-rating { width: 100px; color: #f59e0b; font-weight: 800; }
        .col-token { width: 100px; font-weight: 600; }
        .col-date { width: 120px; color: var(--gray-light); font-size: 13px; }

        /* 프로필 이미지 동그랗게 */
        .profile-img {
            width: 40px; height: 40px; border-radius: 50%; object-fit: cover;
            background-color: #eee; border: 1px solid #eee;
        }

        .star-icon { color: #f59e0b; margin-right: 3px; }
        
        /* [페이지네이션 - 공지사항과 동일한 스타일 적용] */
        .pagination-wrap {
            display: flex;
            justify-content: center;
            margin-top: 30px;
        }

        /* PageModule에서 생성된 HTML에 대응하는 스타일 */
        .pagination-wrap a, .pagination-wrap span {
            display: inline-block;
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
            color: #9ca3af;
            transition: 0.2s;
            border: 1px solid transparent;
            background-color: white;
            margin: 0 4px;
        }

        .pagination-wrap a:hover {
            background-color: var(--mint-bg);
            color: var(--mint-main);
        }

        .pagination-wrap .active, .pagination-wrap b {
            background-color: var(--mint-main);
            color: white;
            padding: 8px 14px;
            border-radius: 10px;
        }
    </style>

    <div class="coach-admin-container">
        <div class="admin-top-bar">
            <h1>Coach Information</h1>
            <span style="font-size: 14px; color: #9ca3af; font-weight: 500;">Management / Coach Info</span>
        </div>

        <div class="summary-row">
            <div class="stat-card">
                <span class="stat-label">Total Coaches</span>
                <span class="stat-value" th:text="${coachCount ?: 0}">0</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Avg. Rating</span>
                <span class="stat-value">⭐ <span th:text="${avgRating ?: '0.0'}">0.0</span></span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Total Tokens</span>
                <span class="stat-value">🪙 <span th:text="${totalTokens ?: 0}">0</span></span>
            </div>
        </div>

        <div class="list-header">
            <div class="col-photo">PHOTO</div>
            <div class="col-idx">IDX</div>
            <div class="col-nick">NICKNAME</div>
            <div class="col-email">EMAIL</div>
            <div class="col-rating">RATING</div>
            <div class="col-token">TOKENS</div>
            <div class="col-date">JOINED</div>
        </div>

        <div th:if="${#lists.isEmpty(coachInfo)}" class="py-20 text-center">
            <div style="font-size: 40px; margin-bottom: 10px;">👤</div>
            <p style="color: #9ca3af; font-style: italic;">조회된 코치 정보가 없습니다.</p>
        </div>

        <div th:each="coach : ${coachInfo}" class="coach-item-card" 
             th:onclick="|location.href='/admin/coach/infoDetail?coach_idx=' + ${coach.COACH_IDX}|" style="cursor:pointer;">
            
            <div class="col-photo">
				<img
					th:src="${coach['PHOTO'] != null and coach['PHOTO'] != ''} ? @{|/uploads/${coach['PHOTO']}|} : @{/img/profile/defaultProfile.jpg}"
					class="profile-img" alt="profile">
			</div>
            <div class="col-idx" th:text="${coach.COACH_IDX}">1</div>
            <div class="col-nick" th:text="${coach.NICKNAME}">현빈코치</div>
            <div class="col-email" th:text="${coach.MAIL}">coach@example.com</div>
            <div class="col-rating">
                <span class="star-icon">★</span>
                <span th:text="${coach.AVG_RATING ?: '0.0'}">4.5</span>
            </div>
            <div class="col-token">
                <span th:text="${coach.TOKEN_BALANCE ?: 0}">500</span>
            </div>
            <div class="col-date" th:text="${coach.CREATED_AT != null ? #dates.format(coach.CREATED_AT, 'yyyy-MM-dd') : '2026-02-18'}"></div>
        </div>
        
        <div class="pagination-wrap" th:if="${not #lists.isEmpty(coachInfo)}">
            <div th:utext="${pageStr}"></div>
        </div>
        
    </div>
</div>
</html>
