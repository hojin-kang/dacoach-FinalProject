<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="coachDetail">
    <style>
        .bg-mint-light { background-color: #f0f8f7; }
        .bg-mint-dark { background-color: #9dbbb5; }
        .font-main { font-family: 'Pretendard', sans-serif; font-size: 14px; color: #374151; }
        .info-card { background-color: white; border: 2px solid #e5e7eb; border-radius: 40px; padding: 2rem; box-shadow: 0 1px 2px rgba(0,0,0,0.05); margin-bottom: 1.5rem; position: relative; }
        .section-badge { display: inline-block; background-color: #9dbbb5; color: white; padding: 0.5rem 2rem; border-radius: 9999px; font-weight: bold; margin-bottom: 1.5rem; font-size: 1rem; }

        .row-container { display: flex; align-items: stretch; }
        .label-base { background-color: #9dbbb5; color: white; width: 6.5rem; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.875rem; flex-shrink: 0; border-radius: 6px 0 0 6px; }
        .content-base { background-color: #f0f8f7; flex: 1; display: flex; align-items: center; padding: 0 1rem; border-radius: 0 6px 6px 0; font-size: 0.875rem; }

        .status-box { flex: 1; background-color: #f0f8f7; padding: 0.5rem 1rem; border-radius: 0 6px 6px 0; display: flex; flex-direction: column; gap: 0.5rem; justify-content: center; }
        .radio-group { display: flex; align-items: center; gap: 0.5rem; font-weight: bold; font-size: 0.875rem; cursor: pointer; }
        .date-picker-wrap { display: flex; align-items: center; gap: 0.25rem; background-color: white; padding: 2px 8px; border-radius: 4px; border: 1px solid #e5e7eb; }
        .input-date { font-size: 11px; border: none; outline: none; cursor: pointer; background: transparent; }

        .cert-thead { background-color: #9dbbb5; color: white; height: 2rem; }
        .cert-tbody { background-color: #f0f8f7; }

        .btn-save-sm { background-color: #9dbbb5; color: white; padding: 0.5rem 1.5rem; border-radius: 12px; font-weight: bold; font-size: 0.8rem; transition: all; border: none; cursor: pointer; }
        .btn-save-sm:hover { filter: brightness(90%); }
        
        /* 목록 버튼용 추가 스타일 */
        .btn-list-sm { background-color: #9ca3af; color: white; padding: 0.5rem 1.5rem; border-radius: 12px; font-weight: bold; font-size: 0.8rem; transition: all; border: none; cursor: pointer; text-decoration: none; }
        .btn-list-sm:hover { filter: brightness(90%); }
    </style>

    <div class="max-w-[1100px] mx-auto p-8 font-main"
         th:with="hasData=${coachDetail != null and !coachDetail.isEmpty()}, info=${hasData ? coachDetail[0] : null}">
        
        <div class="info-card">
            <h2 class="section-badge">코치 정보</h2>
            <div class="flex gap-10">
                <div class="flex-1 grid grid-cols-2 gap-x-6 gap-y-2">
                    <div class="row-container h-10"><span class="label-base">이름</span><div class="content-base" th:text="${hasData ? info['USER_NAME'] : ''}"></div></div>
                    <div class="row-container h-10"><span class="label-base">닉네임</span><div class="content-base" th:text="${hasData ? info['NICKNAME'] : ''}"></div></div>
                    <div class="row-container h-10"><span class="label-base">아이디</span><div class="content-base" th:text="${hasData ? info['LOGIN_ID'] : ''}"></div></div>
                    <div class="row-container h-10"><span class="label-base">비밀번호</span><div class="content-base">********</div></div>
                    <div class="row-container h-10"><span class="label-base">카카오ID</span><div class="content-base" th:text="${hasData and info['KAKAO_KEY'] != null ? info['KAKAO_KEY'] : '-'}"></div></div>
                    <div class="row-container h-10"><span class="label-base">이메일</span><div class="content-base" th:text="${hasData ? info['MAIL'] : ''}"></div></div>
                    <div class="row-container h-10"><span class="label-base">생년월일</span><div class="content-base" th:text="${hasData and info['BIRTH_DATE'] != null ? #strings.substring(info['BIRTH_DATE'], 0, 10) : ''}"></div></div>
                    <div class="row-container h-10"><span class="label-base">전화번호</span><div class="content-base" th:text="${hasData ? info['PHONE'] : ''}"></div></div>
                </div>
                <div class="w-52 h-52 bg-mint-light rounded-3xl flex items-center justify-center border border-mint-dark/20 shrink-0 overflow-hidden">
                    <img th:if="${hasData and info['PHOTO'] != null}" th:src="@{|/uploads/${info['PHOTO']}|}" class="w-full h-full object-cover">
                    <svg th:unless="${hasData and info['PHOTO'] != null}" class="w-20 h-20 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-6">
            <div class="info-card flex flex-col min-h-[350px]">
            	<input type="hidden" id="serverMsg" th:value="${msg}">
				<input type="hidden" id="serverUIdx" th:value="${user_idx}">
				<input type="hidden" id="serverCIdx" th:value="${coach_idx}">
            
                <form th:action="@{/admin/coach/updateCoachStatus}" method="post" class="flex-1 flex flex-col">
                    <div>
                        <h2 class="section-badge">계정관리</h2>
                        <input type="hidden" name="user_idx" th:value="${param.user_idx}">
                        <input type="hidden" name="coach_idx" th:value="${param.coach_idx}">
                        
                        <div class="row-container min-h-[120px]">
                            <div class="label-base">계정상태</div>
                            <div class="status-box">
                                <label class="radio-group">
                                    <input type="radio" name="status" value="ACTIVE" onclick="toggleDateInput(false)" 
                                           th:checked="${coachStatus == 'ACTIVE'}" class="accent-mint-dark w-4 h-4"> 사용
                                </label>

                                <label class="radio-group">
                                    <input type="radio" name="status" value="WARNING" onclick="toggleDateInput(false)" 
                                           th:checked="${coachStatus == 'WARNING'}" class="accent-mint-dark w-4 h-4"> 주의
                                </label>

                                <label class="radio-group">
                                    <input type="radio" name="status" value="DANGER" onclick="toggleDateInput(false)" 
                                           th:checked="${coachStatus == 'DANGER'}" class="accent-mint-dark w-4 h-4"> 위험
                                </label>

                                <div class="flex flex-col gap-2">
                                    <label class="radio-group whitespace-nowrap">
                                        <input type="radio" name="status" value="SUSPENDED" onclick="toggleDateInput(true)" 
                                               th:checked="${coachStatus == 'SUSPENDED'}" class="accent-mint-dark w-4 h-4"> 정지
                                    </label>
                                    
                                    <div id="dateArea" class="flex flex-col gap-2 ml-6" th:style="${coachStatus == 'SUSPENDED' ? 'display:flex' : 'display:none'}">
                                        <div class="date-picker-wrap w-fit">
                                            <input type="date" id="startDate" name="start_date"
                                                th:value="${coachStatus == 'SUSPENDED' ? coachEmbedded?.start_date : #calendars.format(#calendars.createNow(), 'yyyy-MM-dd')}"
                                                class="input-date" readonly> 
                                            <span class="text-gray-300">~</span> 
                                            <input type="date" name="end_date"
                                                th:value="${coachEmbedded?.end_date}"
                                                th:readonly="${coachEmbedded?.end_date != null}"
                                                class="input-date">
                                        </div>
                                        
                                        <input type="text" id="reason" name="reason" placeholder="정지 사유 입력"
                                               class="w-full bg-white border border-gray-200 rounded px-2 py-1 text-xs outline-none focus:border-mint-dark"
                                               th:value="${coachEmbedded?.reason}">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="flex justify-end mt-auto">
                        <button type="submit" class="btn-save-sm">계정 상태 저장</button>
                    </div>
                </form>
            </div>

            <div class="info-card flex flex-col min-h-[350px]">
                <form th:action="@{/admin/coach/updateCertStatus}" method="post" class="flex-1 flex flex-col">
                    <div>
                        <h2 class="section-badge">자격증</h2>
						<input type="hidden" name="coach_idx" th:value="${param.coach_idx}">
						<input type="hidden" name="user_idx" th:value="${param.user_idx}">

						<div class="overflow-hidden rounded-lg border border-gray-200 min-h-[120px]">
                            <table class="w-full text-center text-xs border-collapse">
                                <thead class="cert-thead">
                                    <tr>
                                        <th class="border-r border-white/20">발급일자</th>
                                        <th class="border-r border-white/20">자격명</th>
                                        <th class="border-r border-white/20">발급기관</th>
                                        <th style="min-width: 40px;">파일</th>
                                    </tr>
                                </thead>
								<tbody class="cert-tbody">
									<tr th:if="${certList == null or certList.isEmpty()}"
										class="h-10 border-t border-white text-gray-400">
										<td colspan="4" class="py-10 text-center">대기 중인 자격증이
											없습니다.</td>
									</tr>

									<tr th:unless="${certList == null or certList.isEmpty()}"
										th:each="cert : ${certList}"
										class="h-10 border-t border-gray-100 text-gray-700">

										<input type="hidden" name="cert_idx" th:value="${cert.cert_idx}">

										<td class="border-r border-gray-100"><input type="date"
											name="get_date"
											class="w-full bg-transparent text-center focus:outline-none">
										</td>

										<td class="border-r border-gray-100 font-semibold"><input
											type="text" name="cert_name" th:value="${cert.cert_name}"
											class="w-full bg-transparent text-center focus:outline-none font-semibold">
										</td>

										<td class="border-r border-gray-100"><input type="text"
											name="cert_from"
											class="w-full bg-transparent text-center focus:outline-none"
											placeholder="기관 입력"></td>

										<td><th:block
												th:if="${cert.cert_file != null and cert.cert_file != ''}">
												<a href="javascript:void(0)"
													th:onclick="viewCert([[${cert.cert_file}]])"
													class="hover:opacity-70"> <i
													class="fa-solid fa-folder-open"
													style="color: #7a948f; font-size: 16px;"></i>
												</a>
											</th:block> <span
											th:unless="${cert.cert_file != null and cert.cert_file != ''}"
											class="text-gray-300">-</span></td>
									</tr>
								</tbody>
							</table>
                        </div>
                    </div>
                    <div class="flex justify-end mt-auto gap-2">
                        <button type="button" onclick="location.href='/admin/coach/certList'" class="btn-list-sm">자격증 목록</button>
                        <button type="submit" class="btn-save-sm">자격증 정보 저장</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="flex justify-end mt-8">
            <button type="button" onclick="location.href='/admin/coach/coachList'" class="bg-gray-400 text-white px-12 py-3 rounded-xl font-bold hover:bg-gray-500 transition-all shadow-sm">목록으로 돌아가기</button>
        </div>
    </div>

    <script>
    window.onload = function() {
        const msg = document.getElementById('serverMsg').value;
        const uIdx = document.getElementById('serverUIdx').value;
        const cIdx = document.getElementById('serverCIdx').value;

        if (msg && msg.trim() !== "") {
            alert(msg);
            
            if (uIdx && cIdx) {
                location.href = "/admin/coach/coachDetail?user_idx=" + uIdx + "&coach_idx=" + cIdx;
            }
        }
    };
    
    function toggleDateInput(show) {
        const dateArea = document.getElementById('dateArea');
        if (dateArea) {
            dateArea.style.display = show ? 'flex' : 'none';
        }
    }
    
    function viewCert(fileName) {
        if (!fileName || fileName === '') {
            alert("등록된 파일이 없습니다.");
            return;
        }

        // 서버의 가상 경로(/uploads/)와 DB의 파일명을 합칩니다.
        const fileUrl = '/uploads/' + fileName;

        // 새 창으로 이미지 열기
        window.open(fileUrl, '_blank', 'width=600, height=800, resizable=yes, scrollbars=yes');
    }
    </script>
</div>
</html>
