<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="contentPage">
    <style>
        :root {
            --mint-bg: #f0f8f7;
            --mint-main: #9dbbb5;
            --mint-dark: #7a9a94;
            --slate-text: #374151;
            --warning-peach: #fff4e5;
            --warning-text: #b7791f;
            --red-point: #ef4444;
            --red-bg: #fee2e2;
        }

        .refund-admin-container {
            font-family: 'Pretendard', sans-serif;
            color: var(--slate-text);
            background-color: white;
            min-height: 100vh;
        }

        /* [상단 헤더 영역] */
        .admin-top-bar {
            display: flex;
            align-items: flex-end;
            gap: 15px;
            padding-bottom: 20px;
            border-bottom: 3px solid var(--mint-bg);
            margin-bottom: 30px;
        }

        .admin-top-bar h1 {
            font-size: 24px;
            font-weight: 900;
            color: var(--mint-main);
            margin: 0;
        }

        .current-path {
            font-size: 14px;
            color: #9ca3af;
            font-weight: 500;
        }

        /* [유동적 리스트 레이아웃] */
        .list-header, .refund-item-card {
            display: flex;
            width: 100%;
            align-items: center;
            text-align: center;
            box-sizing: border-box;
            gap: 10px; /* 각 칸 사이 최소 간격 */
        }

        .list-header {
            padding: 0 25px 10px;
            border-bottom: 1px solid #eee;
            margin-bottom: 15px;
            font-size: 12px;
            font-weight: 800;
            color: #9ca3af;
        }

        .refund-item-card {
            padding: 18px 25px;
            background-color: white;
            border-radius: 15px;
            border: 1px solid #f3f4f6;
            margin-bottom: 12px;
            transition: 0.2s;
        }

        .refund-item-card:hover {
            border-color: var(--mint-main);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.03);
        }

        /* [컬럼 설정] 스크롤바 방지를 위해 고정 width 대신 비율(flex)과 % 사용 */
        .col-order { width: 15%; min-width: 0; font-weight: 800; color: var(--mint-main); font-size: 13px; overflow: hidden; text-overflow: ellipsis; }
        .col-user  { width: 10%; min-width: 0; font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
        .col-item  { flex: 1.5; min-width: 0; text-align: left; padding: 0 10px; font-weight: 700; overflow: hidden; }
        .col-item span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        
        .col-amount { width: 10%; min-width: 80px; font-weight: 800; flex-shrink: 0; }
        .col-reason { width: 15%; min-width: 0; flex-shrink: 1; }
        .col-date   { width: 15%; min-width: 0; color: #9ca3af; font-size: 13px; }
        .col-manage { width: 110px; flex-shrink: 0; } /* 버튼은 찌그러지면 안 되므로 고정 */

        /* 상태 배지 */
        .badge-refund {
            background-color: var(--warning-peach);
            color: var(--warning-text);
            padding: 5px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 800;
            display: inline-block;
            max-width: 100%; /* 부모 너비를 넘지 않도록 */
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* 버튼 스타일 */
        .btn-refund-approve {
            background-color: var(--red-bg);
            color: var(--red-point);
            padding: 8px 16px;
            border-radius: 10px;
            font-weight: 800;
            font-size: 12px;
            border: none;
            cursor: pointer;
            transition: 0.2s;
            white-space: nowrap;
        }

        .btn-refund-approve:hover {
            background-color: var(--red-point);
            color: white;
            transform: translateY(-1px);
        }

        .empty-state {
            padding: 100px 0;
            text-align: center;
            color: #d1d5db;
            font-style: italic;
        }

        .paging-container {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            gap: 5px;
        }

        .paging-container a, .paging-container b {
            padding: 8px 14px;
            border: 1px solid #eee;
            border-radius: 8px;
            text-decoration: none;
            color: #999;
            font-weight: bold;
        }

        .paging-container b {
            background: var(--mint-main);
            color: white;
        }
    </style>

    <div class="w-full px-10 py-8 refund-admin-container">
        <div class="admin-top-bar">
            <h1>Refund Management</h1>
            <span class="current-path">Revenue / Refund Request List</span>
        </div>

        <div class="flex justify-between items-center mb-6 px-2">
            <div class="text-gray-400 text-sm font-medium">
                대기 중인 환불 요청: <span class="text-[#9dbbb5] font-bold" th:text="${#lists.size(refund_list) ?: 0}">0</span>건
            </div>
        </div>

        <div class="list-header">
            <div class="col-order">ORDER ID</div>
            <div class="col-user">USER ID</div>
            <div class="col-item">PRODUCT NAME</div>
            <div class="col-amount">AMOUNT</div>
            <div class="col-reason">REASON(PAYLOAD)</div>
            <div class="col-date">PURCHASED</div>
            <div class="col-manage">ACTION</div>
        </div>

        <div class="refund-list-content">
            <div th:if="${not #lists.isEmpty(refund_list)}" th:each="list : ${refund_list}" class="refund-item-card">
                <div class="col-order" th:title="${list['partner_order_id']}" th:text="${list['partner_order_id']}">ORD-000</div>
                
                <div class="col-user" th:title="${list['partner_user_id']}" th:text="${list['partner_user_id']}">user01</div>
                
                <div class="col-item">
                    <span th:text="${list['item_name']}" th:title="${list['item_name']}">프리미엄 멤버십</span>
                </div>
                
                <div class="col-amount" th:text="${#numbers.formatInteger(list['total'], 0, 'COMMA')} + '원'">
                    10,000원
                </div>
                
                <div class="col-reason">
                    <span class="badge-refund" th:title="${list['payload']}" th:text="${list['payload']}">단순 변심</span>
                </div>
                
                <div class="col-date" th:text="${#dates.format(list['approved_at'], 'yyyy-MM-dd HH:mm')}">
                    2024-05-20 14:30
                </div>
                
                <div class="col-manage">
                    <button type="button" class="btn-refund-approve" 
                            th:onclick="approveRefund([[${list['pay_idx']}]])">
                        환불승인
                    </button>
                </div>
            </div>

            <div th:if="${#lists.isEmpty(refund_list)}" class="empty-state">
                <i class="fa-solid fa-receipt mb-4 block text-5xl opacity-20"></i>
                현재 승인 대기 중인 환불 요청이 없습니다.
            </div>
        </div>

        <div th:unless="${refund_list == null || #lists.isEmpty(refund_list)}" class="paging-container" th:utext="${pageStr}"></div>

    </div>

    <script th:inline="javascript">
        function approveRefund(payIdx) {
            if (!confirm("정말로 환불을 승인하시겠습니까? \n승인 시 즉시 카카오페이 결제가 취소됩니다.")) {
                return;
            }

            $.ajax({
                url: "/admin/refund/approve",
                type: "POST",
                data: { pay_idx: payIdx },
                success: function(response) {
                    alert(response);
                    location.reload();
                },
                error: function(xhr) {
                    alert("처리 중 오류가 발생했습니다: " + xhr.responseText);
                }
            });
        }
    </script>
</div>
</html>
