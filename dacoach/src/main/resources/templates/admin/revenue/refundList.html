<div th:fragment="contentPage">
    <style>
        /* 제공해주신 스타일 적용 */
        .admin-container { padding: 20px; font-family: 'Pretendard', sans-serif; color: #333; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border-bottom: 2px solid #f4f4f4; padding-bottom: 15px; }
        .admin-title { font-size: 24px; font-weight: 700; color: #2c3e50; }
        .table-card { background: #fff; border-radius: 12px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05); overflow: hidden; border: 1px solid #eee; }
        .admin-table { width: 100%; border-collapse: collapse; text-align: left; }
        .admin-table th { background: #f8f9fa; padding: 15px; font-size: 13px; text-transform: uppercase; color: #777; border-bottom: 1px solid #eee; }
        .admin-table td { padding: 15px; border-bottom: 1px solid #f4f4f4; font-size: 14px; vertical-align: middle; }
        .admin-table tr:hover { background-color: #fafafa; }
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .badge-warning { background: #fff4e5; color: #b7791f; } /* 환불요청 */
        .btn-action { padding: 6px 12px; border-radius: 4px; border: none; cursor: pointer; font-size: 13px; font-weight: 600; transition: 0.2s; }
        .btn-approve { background: #e74c3c; color: #fff; }
        .btn-approve:hover { background: #c0392b; }
        .empty-msg { padding: 50px; text-align: center; color: #999; }
    </style>

    <div class="admin-container">
        <div class="admin-header">
            <h1 class="admin-title">환불 요청 관리</h1>
        </div>

        <div class="table-card">
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>주문번호</th>
                        <th>사용자ID</th>
                        <th>상품명</th>
                        <th>결제금액</th>
                        <th>환불사유(Payload)</th>
                        <th>결제일시</th>
                        <th>관리</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="list : ${refund_list}">
                        <td th:text="${list['partner_order_id']}"></td>
						<td th:text="${list['partner_user_id']}"></td>
                        <td th:text="${list['item_name']}">멤버십 구독</td>
                        <td>
                            <strong th:text="${#numbers.formatInteger(list['total'], 0, 'COMMA')} + '원'">10,000원</strong>
                        </td>
                        <td>
                            <span class="badge badge-warning" th:text="${list['payload']}">단순 변심</span>
                        </td>
                        <td th:text="${#dates.format(list['approved_at'], 'yyyy-MM-dd HH:mm')}">2024-05-20 14:30</td>
                        <td>
                            <button type="button" class="btn-action btn-approve" 
                                    th:onclick="approveRefund([[${list['pay_idx']}]])">
                                환불승인
                            </button>
                        </td>
                    </tr>

                    <tr th:if="${#lists.isEmpty(refund_list)}">
                        <td colspan="7">
                            <div class="empty-msg">현재 승인 대기 중인 환불 요청이 없습니다.</div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script th:inline="javascript">
        function approveRefund(payIdx) {
            if (!confirm("정말로 환불을 승인하시겠습니까? \n승인 시 즉시 카카오페이 결제가 취소됩니다.")) {
                return;
            }

            $.ajax({
                url: "/admin/refund/approve",
                type: "POST",
                data: { pay_idx: payIdx },
                success: function(response) {
                    alert(response);
                    location.reload();
                },
                error: function(xhr) {
                    alert("처리 중 오류가 발생했습니다: " + xhr.responseText);
                }
            });
        }
    </script>
</div>
