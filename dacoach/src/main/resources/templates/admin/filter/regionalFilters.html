<div th:fragment="contentPage" class="page-wrap font-main">
  <style>
    /* 기존 스타일 유지 */
    .font-main { font-family: 'Pretendard', sans-serif; font-size: 14px; color: #374151; }
    .page-wrap { max-width: 1200px; margin: 0 auto; padding: 32px; }
    .info-card { background: #fff; border: 2px solid #e5e7eb; border-radius: 40px; padding: 2rem; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
    .section-badge { display: inline-block; background: #9dbbb5; color: #fff; padding: 0.5rem 2rem; border-radius: 9999px; font-weight: 700; font-size: 1rem; margin-bottom: 24px; }
    .filter-grid { display: grid; grid-template-columns: 1fr 1.5fr; gap: 24px; }
    .panel { border: 1px solid #e5e7eb; border-radius: 18px; overflow: hidden; background: #fff; height: fit-content; }
    .panel-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; background: #f0f8f7; border-bottom: 1px solid #e5e7eb; }
    .panel-title { font-weight: 700; color: #111827; }
    .btn-add { background: #9dbbb5; color: #fff; border: none; padding: 6px 14px; border-radius: 9999px; font-size: 13px; cursor: pointer; transition: 0.2s; }
    .btn-add:hover { background: #88a9a3; }
    .region-list { padding: 12px; display: flex; flex-direction: column; gap: 8px; min-height: 100px; }
    .region-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border: 1px solid #e5e7eb; border-radius: 14px; background: #fff; }
    .region-item.selectable:hover { background: #f0f8f7; cursor: pointer; border-color: #9dbbb5; }
    .region-item.active { border-color: #9dbbb5; background: #f0f8f7; font-weight: 700; }
    .actions { display: flex; gap: 6px; }
    .btn-icon { background: transparent; border: 1px solid #e5e7eb; padding: 6px 8px; border-radius: 10px; cursor: pointer; font-size: 12px; }
    .btn-icon:hover { background: #f3f4f6; }
    .empty { padding: 30px; color: #9ca3af; text-align: center; font-size: 13px; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center; }
    .modal.show { display: flex; }
    .modal-box { width: 92%; max-width: 450px; background: #fff; border-radius: 18px; padding: 20px; }
    .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .form-group { margin-bottom: 15px; }
    .form-label { display: block; margin-bottom: 6px; font-weight: 700; font-size: 12px; color: #6b7280; }
    .form-input { width: 100%; border: 1px solid #e5e7eb; border-radius: 10px; padding: 10px; outline: none; }
    .modal-foot { display: flex; justify-content: flex-end; gap: 8px; }
    @media (max-width: 768px) { .filter-grid { grid-template-columns: 1fr; } }
  </style>

  <div class="info-card">
    <h2 class="section-badge">지역 필터 관리</h2>

    <div class="filter-grid">
      <div class="panel">
        <div class="panel-head">
          <div class="panel-title">대분류 지역 목록</div>
        </div>
        <div class="region-list">
          <div th:if="${#lists.isEmpty(majorRegions)}" class="empty">등록된 대분류가 없습니다.</div>
          <div th:each="m : ${majorRegions}" 
               class="region-item selectable" 
               th:classappend="${selectedMajorIdx != null and selectedMajorIdx == m.major_region_idx} ? 'active' : ''"
               th:onclick="'location.href=\'/admin/filter/major?majorIdx=' + ${m.major_region_idx} + '\''">
            <span th:text="${m.region_nm}">서울특별시</span>
            <i class="fas fa-chevron-right" style="color:#d1d5db; font-size:12px;"></i>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <div class="panel-title">소분류 관리</div>
          <button th:if="${selectedMajorIdx != null}" type="button" class="btn-add" onclick="openSubModal()">+ 소분류 추가</button>
        </div>
        <div class="region-list">
          <div th:if="${subRegions == null or #lists.isEmpty(subRegions)}" class="empty">
            대분류를 선택하거나 소분류를 등록해주세요.
          </div>

          <div th:each="s : ${subRegions}" class="region-item">
            <span th:text="${s.district_nm}"></span>
            
            <div class="actions">
              <button type="button" class="btn-icon" 
                      th:onclick="openSubModal([[${s.minor_region_idx}]], [[${s.district_nm}]])">수정</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal" id="subModal" onclick="closeOnBackdrop(event, 'subModal')">
    <div class="modal-box">
      <div class="modal-head">
        <div class="modal-title" id="subModalTitle">소분류 추가</div>
        <button type="button" onclick="closeSubModal()" style="border:none; background:none; cursor:pointer; font-size:20px;">&times;</button>
      </div>

      <form th:action="@{/admin/regions/sub/save}" method="post">
        <input type="hidden" name="major_region_idx" th:value="${selectedMajorIdx}">
        <input type="hidden" id="subIdx" name="minor_region_idx">

        <div class="form-group">
          <label class="form-label">소분류 지역명</label>
          <input class="form-input" type="text" id="subName" name="district_nm" placeholder="예: 강남구" required>
        </div>

        <div class="modal-foot">
          <button type="button" class="btn-icon" style="padding:10px 20px;" onclick="closeSubModal()">취소</button>
          <button type="submit" class="btn-add" style="padding:10px 20px;">저장</button>
        </div>
      </form>
    </div>
  </div>

  <script th:inline="javascript">
    function openSubModal(idx, name) {
      const modal = document.getElementById('subModal');
      const title = document.getElementById('subModalTitle');
      const subIdxInput = document.getElementById('subIdx');
      const subNameInput = document.getElementById('subName');

      if (idx) {
        title.textContent = '소분류 수정';
        subIdxInput.value = idx;
        subNameInput.value = name;
      } else {
        title.textContent = '소분류 추가';
        subIdxInput.value = '';
        subNameInput.value = '';
      }
      modal.classList.add('show');
    }

    function closeSubModal() {
      document.getElementById('subModal').classList.remove('show');
    }

    function closeOnBackdrop(e, id) {
      if (e.target && e.target.id === id) closeSubModal();
    }
  </script>
</div>
