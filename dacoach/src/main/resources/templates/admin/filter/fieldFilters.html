<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="fieldContent">
    <style>
        /* [코치 관리 레이아웃과 동일한 아이덴티티 적용] */
        :root {
            --mint-bg: #f0f8f7;
            --mint-main: #9dbbb5;
            --mint-dark: #7a9a94;
            --slate-text: #374151;
        }

        .field-admin-container { font-family: 'Pretendard', sans-serif; color: var(--slate-text); background-color: white; min-height: 800px; }

        /* [상단 헤더 영역 - 크기 통일] */
        .admin-top-bar { 
            display: flex; align-items: flex-end; gap: 15px; 
            padding-bottom: 20px; border-bottom: 3px solid var(--mint-bg); margin-bottom: 30px;
        }
        .admin-top-bar h1 { font-size: 24px; font-weight: 900; color: var(--mint-main); margin: 0; }
        .current-path { font-size: 14px; color: #9ca3af; font-weight: 500; }

        /* [메인 레이아웃: 사이드바 너비 통일] */
        .content-layout { display: flex; gap: 30px; }

        /* [왼쪽: 사이드 메뉴 스타일 통일] */
        .sidebar-menu-wrapper { width: 180px; shrink: 0; }
        .sidebar-menu { 
            display: flex; flex-direction: column; gap: 8px; 
            padding: 15px; background-color: var(--mint-bg); border-radius: 20px;
            position: sticky; top: 20px;
        }
        .menu-label { font-size: 11px; font-weight: 800; color: var(--mint-main); padding-left: 10px; margin-bottom: 5px; opacity: 0.8; }
        .major-link {
            width: 100%; padding: 12px 15px; border-radius: 12px; font-weight: 700; font-size: 13px;
            background-color: white; border: 1px solid transparent; color: #6b7280; 
            transition: all 0.2s; text-align: left; display: block; text-decoration: none;
        }
        .major-link:hover:not(.active) { border-color: var(--mint-main); color: var(--mint-main); }
        .major-link.active { background-color: var(--mint-main); color: white; box-shadow: 0 4px 10px rgba(157, 187, 181, 0.3); }

        /* [오른쪽: 메인 컨트롤러 공간] */
        .control-panel { flex: 1; }

        /* 등록 폼: 코치 관리 요약 박스 스타일 응용 */
        .registration-box {
            display: flex; gap: 10px; padding: 15px 25px; background-color: var(--mint-bg); 
            border-radius: 20px; margin-bottom: 25px; align-items: center;
        }
        .reg-input { 
            flex: 1; border: 1px solid white; background: white; padding: 10px 18px; 
            border-radius: 12px; font-size: 13px; outline-color: var(--mint-main);
        }
        .reg-btn { 
            background-color: var(--mint-main); color: white; border: none; 
            padding: 10px 25px; border-radius: 12px; font-weight: 800; cursor: pointer; transition: 0.2s;
        }
        .reg-btn:hover { background-color: var(--mint-dark); }

        /* 리스트 헤더 스타일 통일 */
        .minor-list-header { 
            display: flex; padding: 0 15px 10px; border-bottom: 1px solid #eee; 
            margin-bottom: 15px; font-size: 12px; font-weight: 800; color: #9ca3af; text-align: center;
        }
        
        /* 아이템 카드 스타일 통일 */
        .minor-item-card {
            display: flex; align-items: center; padding: 15px 20px;
            background-color: white; border-radius: 15px; border: 1px solid #f3f4f6;
            margin-bottom: 10px; transition: 0.2s;
        }
        .minor-item-card:hover { border-color: var(--mint-main); transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.03); }
        
        .idx-tag { width: 60px; font-weight: 800; color: var(--mint-main); font-size: 13px; text-align: center; }
        .name-area { flex: 1; font-weight: 700; font-size: 14px; padding-left: 10px; }
        .btn-group { display: flex; gap: 8px; width: 120px; justify-content: flex-end; }

        /* 버튼 커스텀 스타일 통일 */
        .pill-btn {
            border: 1px solid #eee; padding: 6px 12px; border-radius: 8px; 
            font-size: 11px; font-weight: 700; cursor: pointer; transition: 0.2s; background: white; color: #6b7280;
        }
        .btn-m-edit:hover { background-color: var(--mint-bg); color: var(--mint-main); border-color: var(--mint-main); }
        .btn-m-save { background-color: var(--mint-main); color: white; display: none; border: none; }
        
        .inline-edit-input { 
            width: 90%; padding: 6px 12px; border: 2px solid var(--mint-main); 
            border-radius: 8px; font-weight: 700; display: none; font-size: 14px; outline: none;
        }
    </style>

    <div class="max-w-[1100px] mx-auto p-10 field-admin-container">
        <div class="admin-top-bar">
            <h1>Field Management</h1>
            <span class="current-path" th:text="'Category / ' + ${selectedMajorName}">Category / IT/전자</span>
        </div>

        <div class="content-layout">
            <aside class="sidebar-menu-wrapper">
                <nav class="sidebar-menu">
                    <div class="menu-label">MAJOR CATEGORIES</div>
                    <a th:each="major : ${majorField}"
                        th:href="@{/admin/filter/field(major_field_idx=${major.MAJOR_FIELD_IDX})}"
                        th:classappend="${selectedMajorIdx == major.MAJOR_FIELD_IDX} ? 'active' : ''"
                        class="major-link"> 
                        <span th:text="${major.MAJOR_FIELD_CD}">IT/전자</span>
                    </a>
                </nav>
            </aside>

            <section class="control-panel">
                <div class="registration-box">
                    <span style="font-size: 20px;">✨</span>
                    <form th:action="@{/admin/category/insertMinor}" method="post" class="flex flex-1 gap-2" style="display: flex; width: 100%; gap: 10px;">
                        <input type="hidden" name="major_field_idx" th:value="${selectedMajorIdx}">
                        <input type="text" name="minor_field_nm" placeholder="새로운 소분류 명칭을 입력하세요" class="reg-input" required>
                        <button type="submit" class="reg-btn">ADD</button>
                    </form>
                </div>

                <div class="minor-list-header">
                    <div style="width: 60px;">IDX</div>
                    <div style="flex: 1; text-align: left; padding-left: 10px;">SUB-CATEGORY NAME</div>
                    <div style="width: 120px;">ACTIONS</div>
                </div>

                <div th:if="${#lists.isEmpty(minorField)}" class="text-center py-20 text-gray-300 italic">
                    등록된 데이터가 없습니다.
                </div>

                <div th:each="minor : ${minorField}" class="minor-item-card" th:id="'minor-' + ${minor.MINOR_FIELD_IDX}">
                    <div class="idx-tag" th:text="${minor.MINOR_FIELD_IDX}">01</div>
                    <div class="name-area">
                        <span class="m-name-text" th:text="${minor.MINOR_FIELD_NM}">자바</span>
                        <input type="text" class="inline-edit-input" th:value="${minor.MINOR_FIELD_NM}">
                    </div>
                    <div class="btn-group">
                        <button class="pill-btn btn-m-edit" th:onclick="toggleFieldEdit([[${minor.MINOR_FIELD_IDX}]])">수정</button>
                        <button class="pill-btn btn-m-save" th:onclick="saveFieldEdit([[${minor.MINOR_FIELD_IDX}]])">저장</button>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <script th:inline="javascript">
        function toggleFieldEdit(idx) {
            const row = document.getElementById('minor-' + idx);
            const text = row.querySelector('.m-name-text');
            const input = row.querySelector('.inline-edit-input');
            const btnEdit = row.querySelector('.btn-m-edit');
            const btnSave = row.querySelector('.btn-m-save');

            if(input.style.display === 'none' || input.style.display === '') {
                text.style.display = 'none';
                input.style.display = 'inline-block';
                btnEdit.innerText = '취소';
                btnSave.style.display = 'inline-block';
                input.focus();
            } else {
                text.style.display = 'inline-block';
                input.style.display = 'none';
                btnEdit.innerText = '수정';
                btnSave.style.display = 'none';
            }
        }

        function saveFieldEdit(idx) {
            const row = document.getElementById('minor-' + idx);
            const val = row.querySelector('.inline-edit-input').value;
            if(!val.trim()) return;

            fetch('/admin/category/updateMinor', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ minor_field_idx: idx, minor_field_nm: val })
            }).then(res => res.text()).then(data => {
                if(data === "success") location.reload();
            });
        }
    </script>
</div>
</html>
