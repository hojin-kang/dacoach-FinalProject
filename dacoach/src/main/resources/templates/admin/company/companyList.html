<div th:fragment="contentPage">
  <h2>기업고객관리</h2>

  <table>
    <thead>
      <tr>
        <th>No</th>
        <th>이름</th>
        <th>사업자번호</th>
        <th>계정상태</th>
        <th>관리</th>
      </tr>
    </thead>

    <tbody>
      <tr th:each="row, stat : ${list}">
        <td th:text="${stat.count}">1</td>
        
        <td th:text="${row.users != null ? row.users.user_name : '-'}">-</td>
        
        <td th:text="${row.company != null ? row.company.company_num : '-'}">-</td>

        <td>
          <span th:if="${row.users != null and row.users.status == 'ACTIVE'}">사용</span>
          <span th:if="${row.users != null and row.users.status == 'SUSPENDED'}">정지</span>
          <span th:if="${row.users == null or (row.users.status != 'ACTIVE' and row.users.status != 'SUSPENDED')}">비활성화</span>
        </td>

        <td>
          <a th:href="@{/admin/companyDetail/{usersIdx}(usersIdx=${row.users_idx})}">상세</a>
        </td>
      </tr>

      <tr th:if="${#lists.isEmpty(list)}">
        <td colspan="5">조회된 데이터가 없습니다.</td>
      </tr>
    </tbody>
  </table>
</div>
