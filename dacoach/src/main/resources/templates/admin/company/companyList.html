<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="contentPage">
    <style>
        /* [기업 관리 페이지 디자인 시스템] */
        :root {
            --mint-bg: #f0f8f7;
            --mint-main: #9dbbb5;
            --mint-dark: #7a9a94;
            --slate-text: #374151;
        }

        .company-admin-container {
            font-family: 'Pretendard', sans-serif;
            color: var(--slate-text);
            background-color: white;
            min-height: 100vh; /* 화면 전체 높이 대응 */
        }

        /* [상단 헤더 영역] */
        .admin-top-bar {
            display: flex;
            align-items: flex-end;
            gap: 15px;
            padding-bottom: 20px;
            border-bottom: 3px solid var(--mint-bg);
            margin-bottom: 30px;
        }

        .admin-top-bar h1 {
            font-size: 24px;
            font-weight: 900;
            color: var(--mint-main);
            margin: 0;
        }

        .current-path {
            font-size: 14px;
            color: #9ca3af;
            font-weight: 500;
        }

        /* [추가된 검색창 관련 스타일] */
        .search-area { display: flex; justify-content: flex-end; margin-bottom: 20px; }
        .search-form { display: flex; gap: 8px; width: 300px; }
        .search-input { 
            width: 100%; padding: 10px 15px; border-radius: 12px; border: 1px solid #e5e7eb; 
            font-size: 13px; outline: none; transition: border-color 0.2s; 
        }
        .search-input:focus { border-color: var(--mint-main); box-shadow: 0 0 0 3px var(--mint-bg); }
        .search-btn { 
            background-color: var(--mint-main); color: white; border: none; padding: 0 15px; 
            border-radius: 10px; cursor: pointer; font-weight: 800; font-size: 13px; white-space: nowrap; transition: 0.2s;
        }
        .search-btn:hover { background-color: var(--mint-dark); }

        /* [메인 레이아웃] */
        .control-panel {
            background-color: white;
        }

        /* 유동적 리스트 레이아웃 설정 */
        .list-header, .item-card {
            display: flex;
            width: 100%;
            align-items: center;
            text-align: center;
            box-sizing: border-box;
        }

        .list-header {
            padding: 0 20px 10px;
            border-bottom: 1px solid #eee;
            margin-bottom: 15px;
            font-size: 12px;
            font-weight: 800;
            color: #9ca3af;
        }

        .item-card {
            padding: 15px 20px;
            background-color: white;
            border-radius: 15px;
            border: 1px solid #f3f4f6;
            margin-bottom: 10px;
            transition: 0.2s;
        }

        .item-card:hover {
            border-color: var(--mint-main);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.03);
        }

        /* 컬럼 설정: 유동적 너비(flex) 적용 */
        .col-idx {
            width: 70px;
            flex-shrink: 0;
            font-weight: 800;
            color: var(--mint-main);
            font-size: 13px;
        }

        .col-name {
            flex: 3; /* 기업 이름이 가장 많은 공간을 차지하며 유동적으로 늘어남 */
            min-width: 200px;
            font-weight: 700;
            text-align: left;
            padding-left: 15px;
        }

        .col-biz-num {
            flex: 1.5; /* 사업자 번호도 화면에 따라 적절히 늘어남 */
            min-width: 180px;
        }

        .col-status {
            width: 120px;
            flex-shrink: 0;
        }

        .col-action {
            width: 120px;
            flex-shrink: 0;
        }

        /* 상태 배지 */
        .pill-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 700;
        }
        
        /* 페이지네이션 */
        .pagination-wrap { display: flex; justify-content: center; margin-top: 30px; }
        .pagination-wrap a, .pagination-wrap span {
            display: inline-block; padding: 8px 14px; border-radius: 10px; font-size: 13px; font-weight: 700;
            text-decoration: none; color: #9ca3af; transition: 0.2s; border: 1px solid transparent; background-color: white; margin: 0 4px;
        }
        .pagination-wrap a:hover { background-color: var(--mint-bg); color: var(--mint-main); }
        .pagination-wrap .active, .pagination-wrap b { background-color: var(--mint-main); color: white; padding: 8px 14px; border-radius: 10px; }
    </style>

    <div class="w-full px-10 py-8 company-admin-container">
        <div class="admin-top-bar">
            <h1>Company Management</h1>
            <span class="current-path">Customer / Company List</span>
        </div>

        <div class="search-area">
            <form action="" method="get" class="search-form">
                <input type="text" name="keyword" th:value="${keyword}" 
                       class="search-input" placeholder="기업명 또는 사업자번호 검색">
                <button type="submit" class="search-btn">검색</button>
            </form>
        </div>

        <section class="control-panel">
            <div class="list-header">
                <div class="col-idx">NO</div>
                <div class="col-name">COMPANY NAME</div>
                <div class="col-biz-num">BUSINESS NUMBER</div>
                <div class="col-status">STATUS</div>
                <div class="col-action">ACTION</div>
            </div>

            <div th:if="${#lists.isEmpty(list)}"
                class="text-center py-20 text-gray-300 italic">등록된 데이터가 없습니다.
            </div>

            <div th:each="row, stat : ${list}" class="item-card">
                <div class="col-idx" th:text="${stat.count}"></div>

                <div class="col-name">
                    <span th:text="${row['USER_NAME'] != null ? row['USER_NAME'] : '-'}"></span>
                </div>

                <div class="col-biz-num"
                    th:text="${row['COMPANY_NUM'] != null ? row['COMPANY_NUM'] : '-'}"></div>

                <div class="col-status">
                    <span class="pill-badge"
                        th:classappend="${row['STATUS'] == 'ACTIVE' ? 'bg-green-100 text-green-600' : 
                                      (row['STATUS'] == 'WARNING' ? 'bg-yellow-100 text-yellow-600' : 
                                      (row['STATUS'] == 'DANGER' ? 'bg-orange-100 text-orange-600' : 
                                      (row['STATUS'] == 'SUSPENDED' ? 'bg-red-100 text-red-600' : 'bg-gray-100 text-gray-600')))}"
                        th:text="${row['STATUS'] == 'ACTIVE' ? '사용' : 
                               (row['STATUS'] == 'WARNING' ? '주의' : 
                               (row['STATUS'] == 'DANGER' ? '위험' : 
                               (row['STATUS'] == 'SUSPENDED' ? '정지' : '대기')))}">
                    </span>
                </div>

                <div class="col-action">
                    <a class="text-xs font-bold text-white bg-[#9dbbb5] px-4 py-2 rounded-lg hover:bg-[#7a9a94] transition-colors"
                       th:href="@{/admin/companyDetail/{usersIdx}(usersIdx=${row['USER_IDX']})}">
                        상세보기 </a>
                </div>
            </div>
        </section>
        
        <div th:unless="${list==null || #lists.isEmpty(list)}" class="pagination-wrap" th:utext="${pageStr}"></div>
    </div>
</div>
</html>
