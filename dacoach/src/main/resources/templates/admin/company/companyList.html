<!-- admin/company/companyList.html -->
<div th:fragment="contentPage">

  <h2>기업고객관리</h2>

  <div>
    <table>
      <thead>
        <tr>
          <th>번호</th>
          <th>기업명</th>
          <th>사업자번호</th>
          <th>승인여부</th>
          <th>상세</th>
        </tr>
      </thead>

      <tbody>
        <tr th:each="row : ${list}">
          <td th:text="${row.company.company_idx}"></td>
          <td th:text="${row.users.user_name}"></td>
          <td th:text="${row.company.company_num}"></td>
          <td th:text="${row.cert_status}"></td>
          <td>
            <a th:href="@{/admin/companyDetail/{usersIdx}(usersIdx=${row.users_idx})}">상세</a>
          </td>
        </tr>

        <!-- list 기준으로 체크해야 함 -->
        <tr th:if="${#lists.isEmpty(list)}">
          <td colspan="5">데이터가 없습니다.</td>
        </tr>
      </tbody>
    </table>
  </div>

</div>
