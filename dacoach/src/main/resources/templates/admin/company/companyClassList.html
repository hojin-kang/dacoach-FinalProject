<div th:fragment="contentPage" class="page-wrap font-main">
<style>

.font-main{
  font-family:'Pretendard', sans-serif;
  font-size:14px;
  color:#374151;
}

.page-wrap{
  max-width:1100px;
  margin:0 auto;
  padding:32px;
}

.info-card{
  background:#fff;
  border:2px solid #e5e7eb;
  border-radius:40px;
  padding:2rem;
  box-shadow:0 1px 2px rgba(0,0,0,0.05);
}

.section-badge{
  display:inline-block;
  background:#9dbbb5;
  color:#fff;
  padding:0.5rem 2rem;
  border-radius:9999px;
  font-weight:700;
  font-size:1rem;
}

.table-wrap{
  margin-top:18px;
  border:1px solid #e5e7eb;
  border-radius:18px;
  overflow:hidden;
}

.table{
  width:100%;
  border-collapse:collapse;
}

.table thead th{
  background:#9dbbb5;
  color:#fff;
  font-weight:700;
  font-size:13px;
  padding:12px 10px;
  text-align:center;
}

.table tbody td{
  background:#f0f8f7;
  padding:12px 10px;
  font-size:13px;
  text-align:center;
  border-top:1px solid #e5e7eb;
}

.table tbody tr:hover td{
  background:#e9f3f2;
}

.thumb{
  width:56px;
  height:40px;
  border-radius:10px;
  object-fit:cover;
  border:1px solid #d1d5db;
  background:#fff;
}

.empty{
  padding:18px;
  color:#9ca3af;
  background:#f0f8f7;
  text-align:center;
  border-top:1px solid #e5e7eb;
}

.paging{
  margin-top:18px;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:8px;
}

.paging a{
  display:inline-block;
  padding:8px 12px;
  border:1px solid #e5e7eb;
  background:#fff;
  border-radius:9999px;
  text-decoration:none;
  color:#374151;
  font-size:13px;
}

.paging a:hover{
  background:#f0f8f7;
}

.paging .current{
  background:#9dbbb5;
  color:#fff;
  border-color:#9dbbb5;
}

@media (max-width: 900px){
  .page-wrap{ padding:18px; }
  .info-card{ border-radius:26px; padding:1.25rem; }
  .table thead{ display:none; }
  .table, .table tbody, .table tr, .table td{ display:block; width:100%; }
  .table tr{ border-top:1px solid #e5e7eb; }
  .table tbody td{
    text-align:left;
    display:flex;
    justify-content:space-between;
    gap:10px;
  }
  .table tbody td::before{
    content:attr(data-label);
    font-weight:700;
    color:#6b7280;
    flex-shrink:0;
    width:110px;
  }
}
</style>


  <div class="info-card">
    <h2 class="section-badge">클래스 관리</h2>

    <div class="table-wrap">
      <table class="table">
        <thead>
          <tr>
            <th>클래스관리ID</th>
            <th>클래스명</th>
            <th>작성일자</th>
            <th>회사명</th>
            <th>별점</th>
            <th>사진</th>
            <th>상태</th>
          </tr>
        </thead>

        <tbody>
          <tr th:if="${list == null or #lists.isEmpty(list)}">
            <td class="empty" colspan="7">데이터가 없습니다.</td>
          </tr>

          <tr th:each="row : ${list}">
            <td data-label="클래스관리ID"
                th:text="${row != null and row.classes != null ? row.classes.class_idx : '-'}">-</td>

            <td data-label="클래스명"
                th:text="${row != null and row.classes != null ? row.classes.title : '-'}">-</td>

            <td data-label="작성일자"
   		 		th:text="${row != null and row.classes != null and row.classes.created_at != null
              ? #dates.format(row.classes.created_at, 'yyyy-MM-dd')
              : '-'}">-</td>


            <td data-label="회사명"
                th:text="${row != null and row.classes != null ? row.classes.user_name : '-'}">-</td>

           <td data-label="별점"
    			th:text="${row != null and row.classes != null ? row.classes.avg_rating : '0'}">0</td>


            <td data-label="사진">
              <img class="thumb"
                   th:if="${row != null and row.classes != null and row.classes.photo != null and row.classes.photo != ''}"
                   th:src="@{/uploads/classes/{f}(f=${row.classes.photo})}"
                   alt="class photo"/>

              <span th:if="${row == null or row.classes == null or row.classes.photo == null or row.classes.photo == ''}">-</span>
            </td>
            
            <td data-label="상태"
    			th:text="${row != null and row.progressStatus != null ? row.progressStatus : '-'}">-</td>
            	
          </tr>
        </tbody>
      </table>
    </div>

    <div class="paging" th:utext="${pageStr}"></div>
  </div>
</div>
