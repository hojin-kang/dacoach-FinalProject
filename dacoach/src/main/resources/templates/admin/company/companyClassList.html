<style>
/* classDetail.css - 민트톤(코치/기업 페이지 톤 맞춤) */

.font-main{
  font-family:'Pretendard', sans-serif;
  font-size:14px;
  color:#374151;
}

.page-wrap{
  max-width:1100px;
  margin:0 auto;
  padding:32px;
}

.info-card{
  background:#fff;
  border:2px solid #e5e7eb;
  border-radius:40px;
  padding:2rem;
  box-shadow:0 1px 2px rgba(0,0,0,0.05);
}

.section-badge{
  display:inline-block;
  background:#9dbbb5;
  color:#fff;
  padding:0.5rem 2rem;
  border-radius:9999px;
  font-weight:700;
  font-size:1rem;
}

.field-grid{
  margin-top:1.5rem;
  display:grid;
  grid-template-columns:repeat(2, minmax(0, 1fr));
  gap:14px 18px;
}

.row{
  display:flex;
  align-items:stretch;
  border-radius:12px;
  overflow:hidden;
  border:1px solid #e5e7eb;
}

.row .label{
  width:120px;
  flex-shrink:0;
  background:#9dbbb5;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:700;
  font-size:13px;
  padding:12px 10px;
}

.row .value{
  flex:1;
  background:#f0f8f7;
  display:flex;
  align-items:center;
  padding:12px 14px;
  font-size:13px;
  color:#374151;
}

.value.is-empty{
  color:#9ca3af;
}

/* 작은 화면에서는 1열 */
@media (max-width: 900px){
  .field-grid{ grid-template-columns:1fr; }
  .row .label{ width:110px; }
}
</style>

<div th:fragment="contentPage" class="page-wrap font-main">
  <div class="info-card">
    <h2 class="section-badge">클래스 관리</h2>

    <section class="field-grid">
      <div class="row">
        <div class="label">ID</div>
        <div class="value" th:text="${row != null ? row.class_id : '-'}">-</div>
      </div>

      <div class="row">
        <div class="label">클래스명</div>
        <div class="value" th:text="${row != null ? row.class_name : '-'}">-</div>
      </div>

      <div class="row">
        <div class="label">작성일자</div>
        <div class="value"
             th:text="${row != null and row.created_at != null ? #strings.substring(row.created_at.toString(),0,10) : '-'}">-</div>
      </div>

      <div class="row">
        <div class="label">별점</div>
        <div class="value" th:text="${row != null ? row.rating : '-'}">-</div>
      </div>

      <div class="row">
        <div class="label">강의 진행상황</div>
        <div class="value" th:text="${row != null ? row.progress_status : '-'}">-</div>
      </div>
    </section>
  </div>
</div>
