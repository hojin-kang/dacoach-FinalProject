<div th:fragment="contentPage" class="class-detail-page">
  <style>

    .class-detail-page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 32px;
      font-family: 'Pretendard', sans-serif;
      font-size: 14px;
      color: #374151;
    }

    .class-detail-page .info-card {
      background-color: #ffffff;
      border: 2px solid #e5e7eb;
      border-radius: 40px;
      padding: 2rem;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      position: relative;
      margin-bottom: 20px;
    }

    .class-detail-page .section-badge {
      display: inline-block;
      background-color: #9dbbb5;
      color: #ffffff;
      padding: 0.5rem 2rem;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 1rem;
      margin-bottom: 1rem;
    }

    .class-detail-page .sub-title {
      font-size: 16px;
      font-weight: 700;
      margin: 10px 0 14px;
      color: #111827;
    }

    .class-detail-page .divider {
      border: none;
      border-top: 1px solid #e5e7eb;
      margin: 18px 0;
    }

    .class-detail-page .kv-grid {
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 10px 14px;
      align-items: stretch;
    }

    .class-detail-page .kv-label {
      background-color: #9dbbb5;
      color: #ffffff;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      padding: 10px 12px;
      min-height: 40px;
    }

    .class-detail-page .kv-value {
      background-color: #f0f8f7;
      border-radius: 10px;
      display: flex;
      align-items: center;
      padding: 10px 14px;
      min-height: 40px;
      border: 1px solid #e5e7eb;
    }

    .class-detail-page .status-badge {
      display: inline-block;
      padding: 6px 14px;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 13px;
    }

    .class-detail-page .status-progress {
      background-color: rgba(16,185,129,0.15);
      color: #047857;
    }

    .class-detail-page .status-scheduled {
      background-color: rgba(59,130,246,0.15);
      color: #1e40af;
    }

    .class-detail-page .status-finished {
      background-color: rgba(107,114,128,0.15);
      color: #4b5563;
    }

    .class-detail-page .class-photo {
      width: 100%;
      max-width: 400px;
      border-radius: 16px;
      border: 1px solid #e5e7eb;
    }

    .class-detail-page .intro-box {
      background-color: #f0f8f7;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .class-detail-page .review-item {
      background-color: #f0f8f7;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 10px;
    }

    .class-detail-page .review-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .class-detail-page .review-rating {
      color: #f59e0b;
      font-weight: 700;
    }

    .class-detail-page .review-tag {
      display: inline-block;
      background-color: #9dbbb5;
      color: white;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 12px;
      margin-right: 8px;
    }

    .class-detail-page .btn {
      border: none;
      border-radius: 12px;
      padding: 8px 16px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
    }

    .class-detail-page .btn-delete {
      background-color: #dc2626;
      color: #ffffff;
    }

    .class-detail-page .btn-list {
      background-color: #6b7280;
      color: #ffffff;
      padding: 10px 18px;
      font-size: 14px;
    }

    .class-detail-page .btn:hover {
      filter: brightness(90%);
    }

    .class-detail-page .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 18px;
      justify-content: flex-end;
    }

    .class-detail-page .company-link {
      color: #2563eb;
      text-decoration: underline;
      cursor: pointer;
    }

    .class-detail-page .empty-review {
      padding: 20px;
      text-align: center;
      color: #9ca3af;
    }
  </style>

  <!-- 클래스 기본 정보 -->
  <div class="info-card">
    <div class="section-badge">클래스 상세</div>

    <div class="sub-title">기본 정보</div>

    <div class="kv-grid">
      <div class="kv-label">클래스명</div>
      <div class="kv-value" th:text="${classInfo['TITLE'] != null ? classInfo['TITLE'] : '-'}">-</div>

      <div class="kv-label">제공 회사</div>
      <div class="kv-value">
        <a th:href="@{/admin/companyDetail/{idx}(idx=${classInfo['PROVIDER_IDX']})}" 
           class="company-link"
           th:text="${classInfo['PROVIDER_NAME'] != null ? classInfo['PROVIDER_NAME'] : '-'}">-</a>
      </div>

      <div class="kv-label">분야</div>
      <div class="kv-value">
        <span th:text="${classInfo['MAJOR_FIELD_CD'] != null ? classInfo['MAJOR_FIELD_CD'] : '-'}">-</span>
        <span th:if="${classInfo['MINOR_FIELD_NM'] != null}">
          > <span th:text="${classInfo['MINOR_FIELD_NM']}"></span>
        </span>
      </div>

      <div class="kv-label">지역</div>
      <div class="kv-value">
        <span th:text="${classInfo['REGION_NM'] != null ? classInfo['REGION_NM'] : '-'}">-</span>
        <span th:if="${classInfo['DISTRICT_NM'] != null}">
          > <span th:text="${classInfo['DISTRICT_NM']}"></span>
        </span>
      </div>

      <div class="kv-label">가격</div>
      <div class="kv-value">
        <span th:text="${classInfo['PRICE'] != null ? #numbers.formatInteger(classInfo['PRICE'], 0, 'COMMA') + '원' : '-'}">-</span>
      </div>

      <div class="kv-label">수강 인원</div>
      <div class="kv-value">
        <span th:text="${classInfo['ENROLL_COUNT'] != null ? classInfo['ENROLL_COUNT'] : 0}">0</span>명 
        / 
        <span th:text="${classInfo['MAX_USER_CNT'] != null ? classInfo['MAX_USER_CNT'] : '-'}">-</span>명
      </div>

      <div class="kv-label">진행 기간</div>
      <div class="kv-value">
        <span th:text="${classInfo['START_DATE'] != null ? #dates.format(classInfo['START_DATE'], 'yyyy-MM-dd') : '-'}">-</span>
        ~
        <span th:text="${classInfo['END_DATE'] != null ? #dates.format(classInfo['END_DATE'], 'yyyy-MM-dd') : '무제한'}">-</span>
      </div>

      <div class="kv-label">등록일</div>
      <div class="kv-value" th:text="${classInfo['CREATED_AT'] != null ? #dates.format(classInfo['CREATED_AT'], 'yyyy-MM-dd HH:mm') : '-'}">-</div>

      <div class="kv-label">상태</div>
      <div class="kv-value">
        <span class="status-badge"
              th:classappend="${classInfo['PROGRESS_STATUS'] == '진행중' ? 'status-progress' : 
                               (classInfo['PROGRESS_STATUS'] == '예정' ? 'status-scheduled' : 'status-finished')}"
              th:text="${classInfo['PROGRESS_STATUS'] != null ? classInfo['PROGRESS_STATUS'] : '-'}">-</span>
      </div>

      <div class="kv-label">평점</div>
      <div class="kv-value">
        ⭐ <span th:text="${classInfo['AVG_RATING'] != null ? classInfo['AVG_RATING'] : '0'}">0</span>점
        (<span th:text="${classInfo['REVIEW_COUNT'] != null ? classInfo['REVIEW_COUNT'] : '0'}">0</span>개 리뷰)
      </div>
    </div>

    <hr class="divider">

    <div class="sub-title">클래스 소개</div>
    <div class="intro-box" th:text="${classInfo['INTRO'] != null ? classInfo['INTRO'] : '소개 내용이 없습니다.'}">-</div>

    <hr class="divider" th:if="${classInfo['PHOTO'] != null and classInfo['PHOTO'] != ''}">

    <div class="sub-title" th:if="${classInfo['PHOTO'] != null and classInfo['PHOTO'] != ''}">클래스 사진</div>
    <div th:if="${classInfo['PHOTO'] != null and classInfo['PHOTO'] != ''}">
      <img th:src="@{/uploads/classes/{f}(f=${classInfo['PHOTO']})}" 
           class="class-photo" 
           alt="클래스 사진">
    </div>
  </div>

  <!-- 리뷰 목록 -->
  <div class="info-card">
    <div class="section-badge">
      리뷰 관리 
      (<span th:text="${classInfo['REVIEW_COUNT'] != null ? classInfo['REVIEW_COUNT'] : '0'}">0</span>개)
    </div>

    <div th:if="${reviews == null or #lists.isEmpty(reviews)}" class="empty-review">
      등록된 리뷰가 없습니다.
    </div>

    <div th:each="review : ${reviews}" class="review-item">
      <div class="review-header">
        <div>
          <span class="review-rating">
            ⭐ <span th:text="${review['RATING']}">5.0</span>
          </span>
          <span class="review-tag" th:if="${review['TAG'] != null and review['TAG'] != ''}" 
                th:text="${review['TAG']}">태그</span>
          <span style="color:#6b7280; margin-left:8px;">
            <span th:text="${review['REVIEWER_NAME']}">작성자</span>
            (<span th:text="${review['REVIEWER_TYPE']}">COACH</span>)
          </span>
          <span style="color:#9ca3af; margin-left:8px; font-size:12px;" 
                th:text="${review['CREATED_AT'] != null ? #dates.format(review['CREATED_AT'], 'yyyy-MM-dd') : ''}"></span>
        </div>
        <button class="btn btn-delete" 
                th:onclick="|deleteReview(${classInfo['CLASS_IDX']}, ${review['REVIEW_CLASS_IDX']})|">
          삭제
        </button>
      </div>
      <div style="margin-top:8px; line-height:1.6;" 
           th:text="${review['CONTENT'] != null ? review['CONTENT'] : ''}">리뷰 내용</div>
    </div>
  </div>

  <!-- 버튼 -->
  <div class="btn-row">
    <a th:href="@{/admin/companyClassList}" class="btn btn-list">목록으로</a>
  </div>

  <script>
    function deleteReview(classIdx, reviewIdx) {
      if (!confirm('정말 이 리뷰를 삭제하시겠습니까?')) {
        return;
      }

      fetch(`/admin/classDetail/${classIdx}/deleteReview/${reviewIdx}`, { 
        method: 'POST' 
      })
        .then(resp => {
          if (!resp.ok) throw new Error('delete fail');
          return resp.text();
        })
        .then(() => {
          alert('리뷰가 삭제되었습니다.');
          location.reload();
        })
        .catch(() => alert('리뷰 삭제 실패'));
    }
  </script>
</div>
