<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="contentPage" class="company-detail-page">
	<style>
/* [기본 레이아웃 및 폰트] */
.company-detail-page {
	max-width: 1100px;
	margin: 0 auto;
	padding: 32px;
	font-family: 'Pretendard', sans-serif;
	font-size: 14px;
	color: #374151;
}

/* [카드 스타일] */
.company-detail-page .info-card {
	background-color: #ffffff;
	border: 2px solid #e5e7eb;
	border-radius: 40px;
	padding: 2.5rem;
	box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
	margin-bottom: 24px;
	position: relative;
}

/* [배지 및 타이틀] */
.company-detail-page .section-badge {
	display: inline-block;
	background-color: #9dbbb5;
	color: #ffffff;
	padding: 0.5rem 2rem;
	border-radius: 9999px;
	font-weight: 700;
	font-size: 1rem;
	margin-bottom: 1.5rem;
}

.company-detail-page .sub-title {
	font-size: 18px;
	font-weight: 700;
	margin: 10px 0 20px;
	color: #111827;
	display: flex;
	align-items: center;
	gap: 8px;
}

/* [상단 섹션: 텍스트+사진 레이아웃] */
.company-detail-page .header-flex {
	display: flex;
	gap: 40px;
	align-items: center; 
}

.company-detail-page .info-text-side {
	flex: 1;
}

.company-detail-page .info-photo-side {
	width: 220px;
	flex-shrink: 0;
}

/* [그리드 시스템] */
.company-detail-page .kv-grid {
	display: grid;
	grid-template-columns: 140px 1fr;
	gap: 12px 16px;
	align-items: stretch;
}

.company-detail-page .kv-label {
	background-color: #9dbbb5;
	color: #ffffff;
	border-radius: 12px;
	display: flex;
	align-items: center;
	justify-content: center;
	font-weight: 700;
	padding: 10px 12px;
	min-height: 44px;
}

.company-detail-page .kv-value {
	background-color: #f0f8f7;
	border-radius: 12px;
	display: flex;
	align-items: center;
	padding: 10px 18px;
	min-height: 44px;
	border: 1px solid #e5e7eb;
	color: #4b5563;
}

/* [수정됨: 프로필 사진 박스] */
.company-detail-page .photo-box {
	width: 220px;
	height: 220px;
	background-color: #f0f8f7;
	border-radius: 24px; /* 코치 페이지처럼 모서리를 부드럽게 조정 */
	border: 1px solid rgba(157, 187, 181, 0.5); /* 테두리를 조금 더 은은하게 변경 */
	overflow: hidden;
	display: flex;
	align-items: center;
	justify-content: center;
}

/* 이미지가 부모 박스를 100% 꽉 채우도록 설정 */
.company-detail-page .photo-box img {
	width: 100%;
	height: 100%;
	object-fit: cover; 
}

/* [상태 관리 및 라디오] */
.company-detail-page .status-group {
	display: flex;
	gap: 24px;
	padding: 10px;
	flex-wrap: wrap;
}

.company-detail-page .radio-item {
	display: flex;
	align-items: center;
	gap: 8px;
	cursor: pointer;
	font-weight: 600;
}

.company-detail-page .radio-item input[type="radio"] {
	width: 18px;
	height: 18px;
	accent-color: #9dbbb5;
	cursor: pointer;
}

/* [상태 배지] */
.status-badge-inline {
	padding: 4px 12px;
	border-radius: 9999px;
	font-weight: 700;
	font-size: 12px;
}

/* [정지 영역] */
#suspension_area {
	background: #fff5f5;
	padding: 24px;
	border: 1px solid #fee2e2;
	border-radius: 20px;
	margin-top: 15px;
}

.company-detail-page .form-input {
	width: 100%;
	background-color: #ffffff;
	border: 1px solid #d1d5db;
	border-radius: 8px;
	padding: 10px 14px;
	font-size: 14px;
}

/* [하단 버튼] */
.company-detail-page .btn-row {
	display: flex;
	gap: 12px;
	margin-top: 32px;
	justify-content: center;
}

.company-detail-page .btn {
	border: none;
	border-radius: 12px;
	padding: 12px 28px;
	font-weight: 700;
	cursor: pointer;
	text-decoration: none;
	display: inline-flex;
	align-items: center;
	justify-content: center;
	font-size: 15px;
	transition: all 0.2s;
}

.company-detail-page .btn-primary {
	background-color: #9dbbb5;
	color: white;
}

.company-detail-page .btn-outline {
	background-color: white;
	color: #6b7280;
	border: 1px solid #e5e7eb;
}

.file-link {
	color: #2563eb;
	text-decoration: underline;
	font-weight: 600;
}
</style>

	<div class="info-card">
		<div class="section-badge">기업 상세 정보</div>
		<div class="header-flex" th:if="${companyInfo != null}">
			<div class="info-text-side">
				<div class="sub-title">기본 정보</div>
				<div class="kv-grid">
					<div class="kv-label">회사명</div>
					<div class="kv-value" th:text="${companyInfo['USER_NAME']}">-</div>
					<div class="kv-label">아이디</div>
					<div class="kv-value" th:text="${companyInfo['LOGIN_ID']}">-</div>
					<div class="kv-label">이메일</div>
					<div class="kv-value" th:text="${companyInfo['EMAIL']}">-</div>
					<div class="kv-label">전화번호</div>
					<div class="kv-value" th:text="${companyInfo['PHONE']}">-</div>
					<div class="kv-label">현재 상태</div>
					<div class="kv-value">
						<span class="status-badge-inline"
							th:style="${companyInfo['STATUS'] == 'INACTIVE' ? 'background:#fef3c7; color:#92400e;' : 'background:#d1fae5; color:#065f46;'}"
							th:text="${companyInfo['STATUS'] == 'INACTIVE' ? '대기' : '승인'}">
						</span>
					</div>
				</div>
			</div>
			<div class="info-photo-side">
				<div class="photo-box">
					<img
						th:src="${companyInfo['PHOTO'] != null and companyInfo['PHOTO'] != ''} ? @{|/uploads/${companyInfo['PHOTO']}|} : @{/img/profile/defaultProfile.jpg}" 
						alt="기업 로고">
				</div>
			</div>
		</div>
	</div>

	<form th:action="@{/admin/company/updateStatus}" method="post" onsubmit="return validateForm()">
		<input type="hidden" name="user_idx"
			th:value="${companyInfo['USER_IDX'] != null ? companyInfo['USER_IDX'] : companyInfo['IDX']}">
		<input type="hidden" name="company_idx"
			th:value="${companyInfo['COMPANY_IDX'] != null ? companyInfo['COMPANY_IDX'] : companyInfo['IDX']}">

		<div class="info-card" th:if="${companyInfo['STATUS'] != 'INACTIVE'}">
			<div class="section-badge" style="background-color: #6b7280;">계정
				상태 관리</div>
			<div class="sub-title">상태 변경 설정</div>
			<div class="status-group">
				<label class="radio-item"> <input type="radio" name="status"
					value="ACTIVE" th:checked="${companyInfo['STATUS'] == 'ACTIVE'}"
					onclick="toggleSuspension(false)"> 사용
				</label> <label class="radio-item"> <input type="radio"
					name="status" value="WARNING"
					th:checked="${companyInfo['STATUS'] == 'WARNING'}"
					onclick="toggleSuspension(false)"> 주의
				</label> <label class="radio-item"> <input type="radio"
					name="status" value="DANGER"
					th:checked="${companyInfo['STATUS'] == 'DANGER'}"
					onclick="toggleSuspension(false)"> 위험
				</label> <label class="radio-item"> <input type="radio"
					name="status" id="status_suspended" value="SUSPENDED"
					th:checked="${companyInfo['STATUS'] == 'SUSPENDED'}"
					onclick="toggleSuspension(true)"> 정지
				</label>
			</div>

			<div id="suspension_area"
				th:style="${companyInfo['STATUS'] == 'SUSPENDED' ? 'display:block' : 'display:none'}">
				<div style="margin-bottom: 15px;">
					<label class="sub-title" style="color: #dc2626; font-size: 15px;">정지
						사유</label> <input type="text" name="reason" id="reason" class="form-input"
						th:value="${companyInfo['REASON']}" placeholder="사유를 상세히 입력하세요">
				</div>
				<div style="display: flex; gap: 20px;">
					<div style="flex: 1;">
						<label
							style="display: block; margin-bottom: 5px; font-weight: 700;">정지
							시작일</label> 
                        <input type="date" name="start_date" id="start_date" class="form-input"
							th:value="${companyInfo['START_DATE'] != null ? #dates.format(companyInfo['START_DATE'], 'yyyy-MM-dd') : #calendars.format(#calendars.createNow(), 'yyyy-MM-dd')}"
							readonly>
					</div>
					<div style="flex: 1;">
						<label
							style="display: block; margin-bottom: 5px; font-weight: 700;">정지
							종료일</label> <input type="date" name="end_date" id="end_date"
							class="form-input"
							th:value="${companyInfo['END_DATE'] != null ? #dates.format(companyInfo['END_DATE'], 'yyyy-MM-dd') : ''}">
					</div>
				</div>
			</div>
		</div>

		<div class="info-card">
			<div class="sub-title">사업자 등록 상세 증빙</div>
			<div class="kv-grid">
				<div class="kv-label">발급일자</div>
				<div class="kv-value">
					<input type="date" name="get_date" id="get_date" class="form-input"
						style="border: none; background: transparent;"
						th:value="${companyInfo['GET_DATE'] != null ? #dates.format(companyInfo['GET_DATE'], 'yyyy-MM-dd') : ''}">
				</div>
				<div class="kv-label">등록증명</div>
				<div class="kv-value">
					<input type="text" name="cert_name" class="form-input"
						style="border: none; background: transparent;"
						th:value="${companyInfo['CERT_NAME']}" readonly="readonly">
				</div>
				<div class="kv-label">발급기관</div>
				<div class="kv-value">
					<input type="text" name="cert_from" id="cert_from" class="form-input"
						style="border: none; background: transparent;"
						th:value="${companyInfo['CERT_FROM']}">
				</div>
				<div class="kv-label">첨부파일</div>
				<div class="kv-value">
					<th:block
						th:if="${companyInfo['CERT_FILE'] != null and companyInfo['CERT_FILE'] != ''}">
						<a th:href="@{|/uploads/${companyInfo['CERT_FILE']}|}"
							target="_blank" class="file-link">📁 원본 파일 보기</a>
					</th:block>

					<span
						th:unless="${companyInfo['CERT_FILE'] != null and companyInfo['CERT_FILE'] != ''}"
						style="color: #9ca3af;">등록된 파일이 없습니다.</span>
				</div>
			</div>
		</div>

		<div class="btn-row">
			<button type="submit" name="status" value="ACTIVE"
				class="btn btn-primary"
				th:if="${companyInfo['STATUS'] == 'INACTIVE'}">승인 완료</button>
			<button type="submit" class="btn btn-primary"
				th:if="${companyInfo['STATUS'] != 'INACTIVE'}">설정 저장</button>
			<a th:href="@{/admin/companyList}" class="btn btn-outline">목록으로
				돌아가기</a>
		</div>
	</form>

	<script th:inline="javascript">
        // 정지 영역 토글 함수
        function toggleSuspension(show) {
            const area = document.getElementById('suspension_area');
            const reason = document.getElementById('reason');
            const endDate = document.getElementById('end_date');
            
            area.style.display = show ? 'block' : 'none';
            if (show) {
                reason.setAttribute('required', 'required');
                endDate.setAttribute('required', 'required');
            } else {
                reason.removeAttribute('required');
                endDate.removeAttribute('required');
            }	
        }

        // 페이지 로드 시 정지 상태면 영역 표시
        window.onload = function() {
            const isSuspended = document.getElementById('status_suspended')?.checked;
            if (isSuspended) {
                toggleSuspension(true);
            }
        }
        
        // 폼 전송 시 유효성 검사
        function validateForm() {
            const getDateInput = document.getElementById('get_date');
            const certFromInput = document.getElementById('cert_from');

            if (getDateInput.value === '') {
                alert('발급일자를 입력해주세요.');
                getDateInput.focus();
                return false;
            }

            if (certFromInput.value === '') {
                alert('발급기관을 입력해주세요.');
                certFromInput.focus();
                return false;
            }

            //날짜 유효성 검사
            const suspendedRadio = document.getElementById('status_suspended');
            
            if (suspendedRadio && suspendedRadio.checked) {
                const startDateInput = document.getElementById('start_date');
                const endDateInput = document.getElementById('end_date');

                if (startDateInput && endDateInput && endDateInput.value !== '') {
                    const startDate = new Date(startDateInput.value);
                    const endDate = new Date(endDateInput.value);
                    
                    if (endDate < startDate) {
                        alert('정지 종료일은 정지 시작일보다 빠를 수 없습니다.');
                        endDateInput.focus();
                        return false;
                    }
                }
            }
            
            const certStartDateInput = document.getElementById('get_date');
            if(certStartDateInput && certStartDateInput.value !== '') {
                const certStartDate = new Date(certStartDateInput.value);
                certStartDate.setHours(0, 0, 0, 0);
                const today = new Date();
                today.setHours(0, 0, 0, 0)

                if (certStartDate > today) {
                    alert('발급일자는 오늘 날짜를 초과할 수 없습니다.');
                    certStartDateInput.focus();
                    return false;
                }
            }

            return true;
        }
    </script>
</div>
</html>
