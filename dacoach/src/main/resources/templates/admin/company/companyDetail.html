<!-- templates/admin/company/companyDetail.html -->
<div th:fragment="contentPage" class="w-full">

  <form th:action="@{/admin/companyDetail/save}" method="post" class="space-y-6">

    <!-- 필수 hidden -->
    <input type="hidden" name="usersIdx" th:value="${row.users_idx}">
    <input type="hidden" id="certStatus" name="certStatus" value="">

    <!-- 전체 카드 -->
    <div class="space-y-6">

      <!-- 1) 컴퍼니 정보 -->
      <section class="rounded-2xl border border-gray-200 p-6">
        <div class="flex items-start justify-between gap-6">

          <!-- 좌측: 라벨 + 값 -->
          <div class="flex-1">
            <div class="inline-flex items-center px-4 py-2 rounded-full bg-gray-100 text-gray-700 mb-4">
              컴퍼니 정보
            </div>

            <div class="grid grid-cols-1 gap-2 max-w-xl">

              <div class="flex">
                <div class="w-40 bg-emerald-100 text-gray-700 px-3 py-2 rounded-l-md">컴퍼니 이름</div>
                <div class="flex-1 bg-emerald-50 px-3 py-2 rounded-r-md"
                     th:text="${row.users != null ? row.users.user_name : '-'}">-</div>
              </div>

              <div class="flex">
                <div class="w-40 bg-emerald-100 text-gray-700 px-3 py-2 rounded-l-md">사업자번호</div>
                <div class="flex-1 bg-emerald-50 px-3 py-2 rounded-r-md"
                     th:text="${row.company != null ? row.company.company_num : '-'}">-</div>
              </div>

              <div class="flex">
                <div class="w-40 bg-emerald-100 text-gray-700 px-3 py-2 rounded-l-md">전화번호</div>
                <div class="flex-1 bg-emerald-50 px-3 py-2 rounded-r-md"
                     th:text="${(row.company != null and row.company.phone != null and row.company.phone != '') ? row.company.phone : '-'}">-</div>
              </div>

              <div class="flex">
                <div class="w-40 bg-emerald-100 text-gray-700 px-3 py-2 rounded-l-md">주소</div>
                <div class="flex-1 bg-emerald-50 px-3 py-2 rounded-r-md"
                     th:text="${(row.company != null and row.company.address != null and row.company.address != '') ? row.company.address : '-'}">-</div>
              </div>

              <div class="flex">
                <div class="w-40 bg-emerald-100 text-gray-700 px-3 py-2 rounded-l-md">아이디</div>
                <div class="flex-1 bg-emerald-50 px-3 py-2 rounded-r-md"
                     th:text="${(row.users != null and row.users.login_id != null and row.users.login_id != '') ? row.users.login_id : '-'}">-</div>
              </div>

              <div class="flex">
                <div class="w-40 bg-emerald-100 text-gray-700 px-3 py-2 rounded-l-md">이메일</div>
                <div class="flex-1 bg-emerald-50 px-3 py-2 rounded-r-md"
                     th:text="${(row.company != null and row.company.email != null and row.company.email != '') ? row.company.email : '-'}">-</div>
              </div>

              <div class="flex">
                <div class="w-40 bg-emerald-100 text-gray-700 px-3 py-2 rounded-l-md">승인여부</div>
                <div class="flex-1 bg-emerald-50 px-3 py-2 rounded-r-md"
                     th:text="${row.cert_status != null ? row.cert_status : '-'}">-</div>
              </div>

            </div>
          </div>

          <!-- 우측: 로고 영역 -->
          <div class="w-72 h-52 rounded-2xl bg-emerald-50 flex items-center justify-center border border-emerald-100">
            <span class="text-2xl text-gray-500">dacoach</span>
          </div>

        </div>
      </section>

      <!-- 2) 계정관리 -->
      <section class="rounded-2xl border border-gray-200 p-6">
        <div class="inline-flex items-center px-4 py-2 rounded-full bg-gray-100 text-gray-700 mb-4">
          계정관리
        </div>

        <div class="flex flex-col gap-4">

          <div class="flex items-center gap-6">
            <div class="px-3 py-2 rounded-md bg-emerald-100 text-gray-700 w-32 text-center">
              계정상태
            </div>

           <label>
			  <input type="radio" name="status" value="ACTIVE"
			         th:checked="${row.users.status} == 'ACTIVE'"> 사용
		   </label>
			
			<label>
			  <input type="radio" name="status" value="SUSPENDED"
			         th:checked="${row.users.status} == 'SUSPENDED'"> 정지
			</label>

          </div>

          <!-- 정지기간/사유 -->
          <div class="flex items-center gap-3 flex-wrap">
            <div class="px-3 py-2 rounded-md bg-emerald-100 text-gray-700 w-32 text-center">
              정지기간
            </div>

            <input type="date" name="suspendFrom" class="border rounded-md px-2 py-1">
            <span class="text-gray-400">~</span>
            <input type="date" name="suspendUntil" class="border rounded-md px-2 py-1">

            <input type="text" name="reason" placeholder="정지 사유(선택)"
                   class="border rounded-md px-3 py-1 w-80">
          </div>

          <div class="text-sm text-gray-500">
            정지로 저장하면 지정 기간 동안 로그인 제한 처리(백엔드 로직 연결 필요)
          </div>

        </div>
      </section>

      <!-- 3) 사업자등록증 -->
      <section class="rounded-2xl border border-gray-200 p-6">
        <div class="inline-flex items-center px-4 py-2 rounded-full bg-gray-100 text-gray-700 mb-4">
          사업자등록증
        </div>

        <div class="overflow-hidden rounded-xl border border-gray-200">
          <table class="w-full text-center border-collapse">
            <thead class="bg-emerald-100 text-gray-700">
              <tr>
                <th class="py-2">발급일자</th>
                <th class="py-2">업종/업태</th>
                <th class="py-2">발급기관</th>
                <th class="py-2">첨부파일</th>
              </tr>
            </thead>
            <tbody class="bg-emerald-50">
              <tr>
                <td class="py-3">-</td>
                <td class="py-3">-</td>
                <td class="py-3">-</td>
                <td class="py-3">
                  <a href="#" class="text-gray-600 underline">파일보기</a>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="mt-4 text-sm text-gray-500">
          승인 버튼을 누르면 알림이 뜨고, 저장 시 승인여부가 확인으로 저장되도록 동작
        </div>
      </section>

      <!-- 하단 버튼 -->
      <div class="flex justify-end gap-3 pt-2">

        <!-- 승인: alert + hidden certStatus = '확인' -->
        <button type="button"
                onclick="approveNow()"
                class="px-6 py-2 rounded-lg bg-rose-200 text-gray-700 hover:bg-rose-300">
          승인
        </button>

        <!-- 저장: form submit -->
        <button type="submit"
                class="px-6 py-2 rounded-lg bg-emerald-200 text-gray-700 hover:bg-emerald-300">
          저장
        </button>

        <!-- 목록으로 -->
        <a th:href="@{/admin/companyList}"
           class="px-6 py-2 rounded-lg bg-gray-300 text-gray-700 hover:bg-gray-400 inline-flex items-center justify-center">
          목록
        </a>
      </div>

    </div>
  </form>

  <script>
    function approveNow() {
      document.getElementById('certStatus').value = '확인';
      alert('승인되었습니다.');
    }
  </script>

</div>
