<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="contentPage" class="company-detail-page">
	<style>
/* 클래스 상세 페이지와 통일된 스타일 */
.company-detail-page {
	max-width: 1100px;
	margin: 0 auto;
	padding: 32px;
	font-family: 'Pretendard', sans-serif;
	font-size: 14px;
	color: #374151;
}

.company-detail-page .info-card {
	background-color: #ffffff;
	border: 2px solid #e5e7eb;
	border-radius: 40px;
	padding: 2.5rem;
	box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
	margin-bottom: 24px;
	position: relative;
}

.company-detail-page .section-badge {
	display: inline-block;
	background-color: #9dbbb5;
	color: #ffffff;
	padding: 0.5rem 2rem;
	border-radius: 9999px;
	font-weight: 700;
	font-size: 1rem;
	margin-bottom: 1.5rem;
}

.company-detail-page .sub-title {
	font-size: 18px;
	font-weight: 700;
	margin: 10px 0 20px;
	color: #111827;
	display: flex;
	align-items: center;
	gap: 8px;
}

/* KV 그리드 레이아웃 */
.company-detail-page .kv-grid {
	display: grid;
	grid-template-columns: 160px 1fr;
	gap: 12px 16px;
	align-items: stretch;
}

.company-detail-page .kv-label {
	background-color: #9dbbb5;
	color: #ffffff;
	border-radius: 12px;
	display: flex;
	align-items: center;
	justify-content: center;
	font-weight: 700;
	padding: 10px 12px;
	min-height: 44px;
}

.company-detail-page .kv-value {
	background-color: #f0f8f7;
	border-radius: 12px;
	display: flex;
	align-items: center;
	padding: 10px 18px;
	min-height: 44px;
	border: 1px solid #e5e7eb;
	color: #4b5563;
}

/* 입력 폼 스타일 커스텀 */
.company-detail-page .form-input {
	width: 100%;
	background-color: #ffffff;
	border: 1px solid #d1d5db;
	border-radius: 8px;
	padding: 10px 14px;
	font-size: 14px;
	transition: border-color 0.2s;
}

.company-detail-page .form-input:focus {
	outline: none;
	border-color: #9dbbb5;
	ring: 2px solid #9dbbb5;
}

.company-detail-page .form-input[readonly] {
	background-color: #f3f4f6;
	cursor: not-allowed;
}

/* 상태 라디오 버튼 그룹 */
.company-detail-page .status-group {
	display: flex;
	gap: 24px;
	flex-wrap: wrap;
	padding: 10px;
}

.company-detail-page .radio-item {
	display: flex;
	align-items: center;
	gap: 8px;
	cursor: pointer;
}

.company-detail-page .radio-item input[type="radio"] {
	width: 18px;
	height: 18px;
	accent-color: #9dbbb5;
	cursor: pointer;
}

/* 배지 스타일 */
.status-badge-inline {
	padding: 4px 12px;
	border-radius: 9999px;
	font-weight: 700;
	font-size: 12px;
}

/* 정지 사유 영역 */
#suspension_area {
	background: #fff5f5;
	padding: 24px;
	border: 1px solid #fee2e2;
	border-radius: 20px;
	margin-top: 15px;
}

/* 버튼 스타일 */
.company-detail-page .btn-row {
	display: flex;
	gap: 12px;
	margin-top: 32px;
	justify-content: center;
}

.company-detail-page .btn {
	border: none;
	border-radius: 12px;
	padding: 12px 28px;
	font-weight: 700;
	cursor: pointer;
	text-decoration: none;
	display: inline-flex;
	align-items: center;
	justify-content: center;
	font-size: 15px;
	transition: all 0.2s;
}

.company-detail-page .btn-primary {
	background-color: #9dbbb5;
	color: white;
}

.company-detail-page .btn-secondary {
	background-color: #6b7280;
	color: white;
}

.company-detail-page .btn-outline {
	background-color: white;
	color: #6b7280;
	border: 1px solid #e5e7eb;
}

.company-detail-page .btn:hover {
	filter: brightness(90%);
	transform: translateY(-1px);
}

.file-link {
	color: #2563eb;
	text-decoration: underline;
	font-weight: 600;
}
</style>

	<div class="info-card">
		<div class="section-badge">기업 상세 정보</div>
		<div class="sub-title">기본 정보</div>

		<div class="kv-grid" th:if="${companyInfo != null}">
			<div class="kv-label">사용자명/회사명</div>
			<div class="kv-value" th:text="${companyInfo['USER_NAME']}">-</div>

			<div class="kv-label">아이디</div>
			<div class="kv-value" th:text="${companyInfo['LOGIN_ID']}">-</div>

			<div class="kv-label">이메일</div>
			<div class="kv-value" th:text="${companyInfo['EMAIL']}">-</div>

			<div class="kv-label">전화번호</div>
			<div class="kv-value" th:text="${companyInfo['PHONE']}">-</div>

			<div class="kv-label">사업자번호</div>
			<div class="kv-value" th:text="${companyInfo['COMPANY_NUM']}">-</div>

			<div class="kv-label">주소</div>
			<div class="kv-value" th:text="${companyInfo['ADDRESS']}">-</div>

			<div class="kv-label">현재 상태</div>
			<div class="kv-value">
				<span class="status-badge-inline"
					th:style="${companyInfo['STATUS'] == 'INACTIVE' ? 'background:#fef3c7; color:#92400e;' : 'background:#d1fae5; color:#065f46;'}"
					th:text="${companyInfo['STATUS'] == 'INACTIVE' ? '대기' : '승인'}">
				</span>
			</div>
		</div>
	</div>

	<form th:action="@{/admin/company/updateStatus}" method="post">
		<input type="hidden" name="user_idx"
			th:value="${companyInfo['USER_IDX'] != null ? companyInfo['USER_IDX'] : companyInfo['IDX']}">
		<input type="hidden" name="company_idx"
			th:value="${companyInfo['COMPANY_IDX'] != null ? companyInfo['COMPANY_IDX'] : companyInfo['IDX']}">

		<div class="info-card" th:if="${companyInfo['STATUS'] != 'INACTIVE'}">
			<div class="section-badge" style="background-color: #6b7280;">계정
				상태 관리</div>

			<div class="sub-title">상태 변경 설정</div>
			<div class="status-group">
				<label class="radio-item"> <input type="radio" name="status"
					value="ACTIVE" th:checked="${companyInfo['STATUS'] == 'ACTIVE'}"
					onclick="toggleSuspension(false)"> <span>사용 (ACTIVE)</span>
				</label> <label class="radio-item"> <input type="radio"
					name="status" value="WARNING"
					th:checked="${companyInfo['STATUS'] == 'WARNING'}"
					onclick="toggleSuspension(false)"> <span>주의
						(WARNING)</span>
				</label> <label class="radio-item"> <input type="radio"
					name="status" value="DANGER"
					th:checked="${companyInfo['STATUS'] == 'DANGER'}"
					onclick="toggleSuspension(false)"> <span>위험 (DANGER)</span>
				</label> <label class="radio-item"> <input type="radio"
					name="status" id="status_suspended" value="SUSPENDED"
					th:checked="${companyInfo['STATUS'] == 'SUSPENDED'}"
					onclick="toggleSuspension(true)"> <span>정지
						(SUSPENDED)</span>
				</label>
			</div>

			<div id="suspension_area"
				th:style="${companyInfo['STATUS'] == 'SUSPENDED' ? 'display:block' : 'display:none'}">
				<div style="margin-bottom: 15px;">
					<label class="sub-title" style="color: #dc2626; font-size: 15px;">정지
						사유 입력</label> <input type="text" name="reason" id="reason"
						class="form-input" th:value="${companyInfo['REASON']}"
						placeholder="정지 사유를 상세히 입력하세요">
				</div>
				<div style="display: flex; gap: 20px;">
					<div style="flex: 1;">
						<label
							style="display: block; margin-bottom: 5px; font-weight: 700;">정지
							시작일</label> <input type="text" class="form-input"
							th:value="${#calendars.format(#calendars.createNow(), 'yyyy-MM-dd')}"
							readonly>
					</div>
					<div style="flex: 1;">
						<label
							style="display: block; margin-bottom: 5px; font-weight: 700;">정지
							종료일</label> <input type="date" name="end_date" id="end_date"
							class="form-input" th:value="${companyInfo['END_DATE']}">
					</div>
				</div>
			</div>
		</div>

		<div class="info-card">
			<div class="sub-title">사업자 등록 상세 증빙</div>
			<div class="kv-grid">
				<div class="kv-label">발급일자</div>
				<div class="kv-value">
					<input type="text" name="get_date" class="form-input"
						style="border: none; background: transparent;"
						th:value="${companyInfo['GET_DATE'] != null ? #dates.format(companyInfo['GET_DATE'], 'yyyy-MM-dd') : ''}"
						placeholder="YYYY-MM-DD">
				</div>

				<div class="kv-label">발급업종</div>
				<div class="kv-value">
					<input type="text" name="cert_type" class="form-input"
						style="border: none; background: transparent;"
						th:value="${companyInfo['CERT_TYPE']}">
				</div>

				<div class="kv-label">발급기관</div>
				<div class="kv-value">
					<input type="text" name="cert_from" class="form-input"
						style="border: none; background: transparent;"
						th:value="${companyInfo['CERT_FROM']}">
				</div>

				<div class="kv-label">첨부파일</div>
				<div class="kv-value">
					<span th:if="${companyInfo['CERT_FILE'] != null}"> <a
						th:href="@{|/uploads/${companyInfo['CERT_FILE']}|}"
						target="_blank" class="file-link">📁 원본 파일 보기</a>
					</span> <span th:unless="${companyInfo['CERT_FILE'] != null}"
						style="color: #9ca3af;">등록된 파일이 없습니다.</span>
				</div>
			</div>
		</div>

		<div class="btn-row">
			<button type="submit" name="status" value="ACTIVE"
				class="btn btn-primary"
				th:if="${companyInfo['STATUS'] == 'INACTIVE'}">승인 완료</button>
			<button type="submit" class="btn btn-primary"
				th:if="${companyInfo['STATUS'] != 'INACTIVE'}">설정 저장</button>
			<a th:href="@{/admin/companyList}" class="btn btn-outline">목록으로
				돌아가기</a>
		</div>
	</form>

	<script th:inline="javascript">
        function toggleSuspension(show) {
            const area = document.getElementById('suspension_area');
            const reasonInput = document.getElementById('reason');
            const endDateInput = document.getElementById('end_date');
            
            if (show) {
                area.style.display = 'block';
                reasonInput.setAttribute('required', 'required');
                endDateInput.setAttribute('required', 'required');
            } else {
                area.style.display = 'none';
                reasonInput.removeAttribute('required');
                endDateInput.removeAttribute('required');
            }
        }

        window.onload = function() {
            const isSuspended = document.getElementById('status_suspended')?.checked;
            if (isSuspended) toggleSuspension(true);
        }
    </script>
</div>
</html>
