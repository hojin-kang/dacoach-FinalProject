<!-- templates/admin/company/companyDetail.html -->
<div th:fragment="contentPage" class="w-full">

  <form th:action="@{/admin/companyDetail/save}" method="post" class="space-y-6">

    <input type="hidden" name="usersIdx" th:value="${row.users_idx}">
    <input type="hidden" id="certStatus" name="certStatus" value="">
    <input type="hidden" id="certType" name="certType" value="사업증">

    <div class="space-y-6">

      <section>
        <h3>컴퍼니 정보</h3>

        <div>
          <div>컴퍼니 이름</div>
          <div th:text="${row.users != null ? row.users.user_name : '-'}">-</div>
        </div>

        <div>
          <div>사업자번호</div>
          <div th:text="${row.company != null ? row.company.company_num : '-'}">-</div>
        </div>

        <div>
          <div>전화번호</div>
          <div th:text="${(row.company != null and row.company.phone != null and row.company.phone != '') ? row.company.phone : '-'}">-</div>
        </div>

        <div>
          <div>주소</div>
          <div th:text="${(row.company != null and row.company.address != null and row.company.address != '') ? row.company.address : '-'}">-</div>
        </div>

        <div>
          <div>아이디</div>
          <div th:text="${(row.users != null and row.users.login_id != null and row.users.login_id != '') ? row.users.login_id : '-'}">-</div>
        </div>

        <div>
          <div>이메일</div>
          <div th:text="${(row.company != null and row.company.email != null and row.company.email != '') ? row.company.email : '-'}">-</div>
        </div>

        <div>
          <div>승인여부</div>
          <div id="certStatusText" th:text="${row.cert_status != null ? row.cert_status : '-'}">-</div>
        </div>
      </section>

      <section>
        <h3>계정관리</h3>

        <div>
          <div>계정상태</div>

          <label>
            <input type="radio" name="status" value="ACTIVE"
                   th:checked="${row.users != null && row.users.status == 'ACTIVE'}">
            사용
          </label>

          <label>
            <input type="radio" name="status" value="SUSPENDED"
                   th:checked="${row.users != null && row.users.status == 'SUSPENDED'}">
            정지
          </label>
        </div>

        <div>
          <div>정지기간</div>

          <input type="date" name="suspendFrom"
                 th:value="${row.embedded != null and row.embedded.start_date != null
                          ? #temporals.format(row.embedded.start_date, 'yyyy-MM-dd')
                          : ''}">

          <span>~</span>

          <input type="date" name="suspendUntil"
                 th:value="${row.embedded != null and row.embedded.end_date != null
                          ? #temporals.format(row.embedded.end_date, 'yyyy-MM-dd')
                          : ''}">

          <input type="text" name="reason" placeholder="정지 사유(선택)"
                 th:value="${row.embedded != null and row.embedded.reason != null ? row.embedded.reason : ''}">
        </div>

        <div>정지로 저장하면 EMBEDDED_USER에 기간/사유가 저장된다.</div>
      </section>

      <section>
        <h3>사업자등록증</h3>

        <table>
          <thead>
            <tr>
              <th>발급일자</th>
              <th>업종/업태</th>
              <th>발급기관</th>
              <th>첨부파일</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>-</td>
              <td>-</td>
              <td>-</td>
              <td><a href="#">파일보기</a></td>
            </tr>
          </tbody>
        </table>

        <div>승인 버튼은 알림만 띄우고, 실제 반영은 저장 버튼에서 된다.</div>
      </section>

      <div>
        <button type="button" onclick="approveNow()">승인</button>
        <button type="submit">저장</button>
        <a th:href="@{/admin/companyList}">목록</a>
      </div>

    </div>
  </form>

  <script>
    function approveNow() {
      document.getElementById('certStatus').value = '확인';
      document.getElementById('certType').value = '사업증';
      document.getElementById('certStatusText').innerText = '확인';
      alert('승인되었습니다.');
    }

    document.querySelector('form').addEventListener('submit', function(e) {
      const status = document.querySelector('input[name="status"]:checked')?.value;

      if (status === 'SUSPENDED') {
        const from = document.querySelector('input[name="suspendFrom"]').value;
        const until = document.querySelector('input[name="suspendUntil"]').value;

        if (!from || !until) {
          alert('정지 상태는 정지기간(시작~종료)을 반드시 선택해야 한다.');
          e.preventDefault();
          return;
        }
      }
    });
  </script>

</div>
