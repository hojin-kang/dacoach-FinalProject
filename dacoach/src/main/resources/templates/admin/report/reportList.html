<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="reportList">
    <style>
        :root {
            --mint-bg: #f0f8f7;
            --mint-main: #9dbbb5;
            --mint-dark: #7a9a94;
            --slate-text: #374151;
            --border-color: #edf2f7;
            --red-warn: #f04438;
            --gray-light: #9ca3af;
        }

        .report-list-container {
            font-family: 'Pretendard', sans-serif;
            color: var(--slate-text);
            background-color: white;
            padding: 40px;
        }

        /* 헤더 섹션 */
        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 30px;
            border-bottom: 3px solid var(--mint-bg);
            padding-bottom: 20px;
        }

        .list-header h1 {
            font-size: 24px;
            font-weight: 900;
            color: var(--mint-main);
            margin: 0;
        }

        .list-sub-text {
            font-size: 13px;
            color: var(--gray-light);
            margin-top: 5px;
        }

        /* 필터 영역 */
        .filter-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .filter-select {
            padding: 8px 15px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            font-size: 14px;
            outline: none;
        }

        /* 테이블 스타일 */
        .report-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }

        .report-table th {
            background-color: var(--mint-bg);
            color: var(--mint-dark);
            font-weight: 800;
            padding: 15px;
            font-size: 14px;
            text-align: center;
        }

        /* 테이블 헤더 둥글게 */
        .report-table th:first-child { border-radius: 15px 0 0 0; }
        .report-table th:last-child { border-radius: 0 15px 0 0; }

        .report-table td {
            padding: 18px 15px;
            border-bottom: 1px solid var(--border-color);
            text-align: center;
            font-size: 14px;
            font-weight: 500;
        }

        .report-table tr:hover {
            background-color: #fcfdfd;
            cursor: pointer;
        }

        /* 텍스트 스타일 */
        .type-text { font-weight: 800; color: var(--mint-dark); }
        .target-text { color: var(--red-warn); }
        
        /* 빈 목록 스타일 */
        .empty-row { padding: 100px 0; color: var(--gray-light); }
        .empty-icon { font-size: 40px; margin-bottom: 10px; }

        /* 상태 배지 */
        .status-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }

        .status-pending { background: #fff4e5; color: #d97706; }
        .status-resolved { background: #ecfdf5; color: #059669; }
        .status-rejected { background: #fef2f2; color: #dc2626; }

        /* 페이지네이션 */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin-top: 30px;
        }

        .page-btn {
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: 0.2s;
        }

        .page-btn.active {
            background-color: var(--mint-main);
            color: white;
            border-color: var(--mint-main);
        }

        .page-btn:hover:not(.active) {
            background-color: var(--mint-bg);
        }
    </style>

    <div class="report-list-container">
        <div class="list-header">
            <div>
                <h1>Report Management</h1>
                <p class="list-sub-text">사용자 신고 내역을 검토하고 조치합니다.</p>
            </div>
            <div class="filter-bar">
                <select class="filter-select">
                    <option>전체 상태</option>
                    <option>접수</option>
                    <option>완료</option>
                    <option>반려</option>
                </select>
            </div>
        </div>

        <table class="report-table">
            <thead>
                <tr>
                    <th style="width: 80px;">번호</th>
                    <th style="width: 150px;">신고유형</th>
                    <th>신고자</th>
                    <th>피신고자</th>
                    <th style="width: 120px;">상태</th>
                    <th style="width: 180px;">신고일시</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="item : ${reportList}" th:onclick="|location.href='/admin/report/content?report_idx=' + ${item.REPORT_IDX}|">
                    <td th:text="${item.REPORT_IDX}">1</td>
                    <td>
                        <span class="type-text" th:text="${item.CONTENT}">부적절한 언어</span>
                    </td>
                    <td th:text="${item.REPORTER_NAME}">홍길동</td>
                    <td>
                        <span class="target-text" th:text="${item.REPORTED_NAME}">김철수</span>
                    </td>
                    <td><span class="status-badge"
						th:classappend="${item.STATUS == 'WAIT' ? 'status-pending' : (item.STATUS == 'REJECT' ? 'status-rejected' : 'status-resolved')}"
						th:text="${item.STATUS == 'WAIT' ? '대기' : (item.STATUS == 'REJECT' ? '반려' : '완료')}">
							대기 </span></td>
                    <td th:text="${#strings.substring(item.CREATED_AT, 0, 10)}">2026-02-13</td>
                </tr>

                <tr th:if="${#lists.isEmpty(reportList)}">
                    <td colspan="6" class="empty-row">
                        <div class="empty-icon">📄</div>
                        신고 내역이 존재하지 않습니다.
                    </td>
                </tr>
            </tbody>
        </table>

        <div class="pagination">
            <div class="page-btn"> < </div>
            <div class="page-btn active">1</div>
            <div class="page-btn">2</div>
            <div class="page-btn">3</div>
            <div class="page-btn"> > </div>
        </div>
    </div>
</div>
</html>
