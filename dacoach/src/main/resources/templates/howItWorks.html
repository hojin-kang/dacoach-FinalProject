<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

	<meta charset="UTF-8" />
	<title>dacoach</title>

	<link rel="stylesheet" th:href="@{/css/main.css}" />
	<style>
		.banner {
		position: relative;
		width: 100%;
		height: 500px;
		}
		.howItWorksBanner {
			width: 100%;
			height: 500px;
			object-fit: cover;
		}
		
		.banner::before {
			content: "";
			position: absolute;
			inset: 0;
			background: rgba(0,0,0,0.65); /* 숫자 ↑ = 더 어두움 */
			z-index: 1;
		}

		.bannerText {
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			position: absolute;
			z-index: 2;
			color: white;
			font-size: 36px;
			font-weight: 700;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
		}
		
		.goToMain {
			background: #328889;
			color: white;
			font-size: 18px;
			font-weight: 600;
			padding: 10px 20px;
			border: none;
			border-radius: 12px;
			text-decoration: none;
			margin-top: 40px;
		}
	</style>
</head>
<body>
	<div th:replace="~{layout/header :: siteHeader}"></div>
	<div class="banner">
		<img src="/img/howItWorks/howItWorksBanner.png" class="howItWorksBanner">
		<div class="bannerText">
			<span>새로운 도전을 하고 싶다면?</span>
			<span>다코치에서 나만의 코치를 찾으세요</span>
			<a th:href="@{/}" class="goToMain">바로가기</a>
		</div>
	</div>
	
	<main class="main">
	<div class="container">
		<!--여기에 내용-->
	</div>
	</main>
  
	<div th:replace="~{layout/footer :: siteFooter}"></div>

</body>
</html>
