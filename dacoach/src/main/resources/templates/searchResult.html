<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

<meta charset="UTF-8" />
<title>dacoach</title>

<link rel="stylesheet" th:href="@{/css/main.css}" />
<link rel="stylesheet" th:href="@{/css/search.css}" />

</head>
<body>
	<div th:replace="~{layout/header :: siteHeader}"></div>

	<main class="main">
		<div class="container">
			<h2 th:text="'&quot;' + ${keyword} + '&quot; 검색 결과'"></h2>
			<hr>

			<div>
				<section class="srSection">
					<div class="srHeader">
						<div class="srTitle">
						  <span class="keyword-coach">코치</span>
						  검색결과(<span th:text="${coachCnt}">0</span>)
						</div>

						<a class="srMore" th:if="${coachCnt > 4}"
							th:href="@{/coach/search(keyword=${keyword}, sort='latest', majorField=0, minorField=0, majorRegion=0, minorRegion=0)}">
							더보기 → </a>
					</div>

					<div class="empty-msg" th:if="${coachCnt == 0}">검색 결과가 없습니다.</div>

					<div class="cardGrid" th:if="${coachCnt > 0}">
						<article class="classCard coachCard" th:each="dto : ${coachList}"
							th:attr="data-href=@{/coach/detail(user_idx=${dto.user_idx})}">
							<div class="card-body">
								<div class="profile-section">
									<div class="coach-thumb">
										<img
											th:src="${dto.photo != null} ? @{/uploads/{path}(path=${dto.photo})} : @{/img/profile/defaultProfile.jpg}"
											alt="coach">
									</div>

									<div class="name-rating">
										<div class="badge" th:text="${dto.rank_name}">등급</div>
										<div class="coach-name" th:text="${dto.nickname}">닉네임</div>
										<div class="coach-rating">★[[${dto.rating}]]([[${dto.review_count}]])</div>
									</div>
								</div>

								<div class="right">
									<div class="row">
										<div class="label">제공분야</div>
										<div class="tags">
											<span class="tag" th:each="t : ${dto.hashtags}"
												th:text="${t}">태그</span>
										</div>
									</div>
									<div class="row">
										<div class="label">관심분야</div>
										<div class="tags">
											<span class="tag" th:each="t : ${dto.interhashtags}"
												th:text="${t}">태그</span>
										</div>
									</div>
								</div>
							</div>
						</article>
					</div>
				</section>
				<!-- 클래스 검색결과 -->
				<section class="srSection">
  <div class="srHeader">
    <div class="srTitle">
  <span class="keyword-class">클래스</span>
  검색결과(<span th:text="${classCnt}">0</span>)
</div>

    <a class="srMore"
       th:if="${classCnt > 4}"
       th:href="@{/coach/classList(q=${keyword}, sort='latest')}">
      더보기 →
    </a>
  </div>

  <div class="empty-msg" th:if="${classCnt == 0}">검색 결과가 없습니다.</div>

  <div class="cardGrid" th:if="${classCnt > 0}">
    <a class="classCard classResultCard"
       th:each="c : ${classList}"
       th:href="@{/coach/classDetail(id=${c.class_idx})}">
      <div class="thumb">
        <span th:if="${c.photo == null or c.photo == ''}" class="no-media-message">📷 이미지가 없습니다</span>
        <img th:if="${c.photo != null and c.photo != ''}" th:src="'/uploads/' + ${c.photo}" th:alt="${c.title}">
      </div>

      <div class="meta">
        <div class="top">
          <div class="rating"
               th:text="|★ ${#numbers.formatDecimal(c.avg_rating, 1, 1)}(${c.review_cnt})|">★ 0.0(0)</div>
          <div class="provider" th:text="|[${c.user_name}]|">[제공자]</div>
        </div>

        <div class="bottom">
          <div class="title" th:text="${c.title}">클래스 제목</div>
          <div class="price" th:text="|${#numbers.formatInteger(c.price, 3, 'COMMA')}₩|">0₩</div>
        </div>
      </div>
    </a>
  </div>
</section>
			</div>
		</div>
	</main>

	<div th:replace="~{layout/footer :: siteFooter}"></div>
<script>
document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('.coachCard').forEach(card => {
    card.addEventListener('click', (e) => {
      const href = card.getAttribute('data-href');
      if (href) window.location.href = href;
    });
  });
});
</script>
</body>
</html>
