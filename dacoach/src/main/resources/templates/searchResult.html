<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

	<meta charset="UTF-8" />
	<title>dacoach</title>

	<link rel="stylesheet" th:href="@{/css/main.css}" />

</head>
<body>
	<div th:replace="~{layout/header :: siteHeader}"></div>

	<main class="main">
		<div class="container">
			<h2 th:text="'&quot;' + ${keyword} + '&quot; 검색 결과'"></h2>
			<hr>

			<div>
				<div>
  <span th:text="|코치 검색결과(${coachCnt})|">코치 검색결과(0)</span>

  <div th:if="${coachCnt == 0}" style="padding:16px 0;">
    검색 결과가 없습니다.
  </div>

  <div th:if="${coachCnt > 0}">
    <div th:each="c : ${coachList}" style="display:flex; gap:16px; padding:12px 0; border-bottom:1px solid #eee;">
      
      <!-- 썸네일 -->
      <a th:href="@{/coach/detail(user_idx=${c.user_idx})}" style="display:block; width:72px; height:72px; overflow:hidden; border-radius:12px;">
        <img th:src="${c.photo != null} ? @{/uploads/{p}(p=${c.photo})} : @{/img/profile/defaultProfile.jpg}"
             alt="프로필"
             style="width:100%; height:100%; object-fit:cover;">
      </a>

      <!-- 내용 -->
      <div style="flex:1;">
        <div style="display:flex; align-items:center; gap:10px;">
          <a th:href="@{/coach/detail(user_idx=${c.user_idx})}"
             th:text="${c.nickname}"
             style="font-weight:700; font-size:16px; color:#111; text-decoration:none;">
            닉네임
          </a>
          <span th:text="${c.rank_name}" style="font-size:12px; padding:2px 8px; border:1px solid #ddd; border-radius:999px;">
            랭크
          </span>
        </div>

        <div style="margin-top:6px; font-size:13px; color:#555;">
          <span th:text="|⭐ ${c.rating} (${c.review_count})|">⭐ 0.0 (0)</span>
        </div>

        <!-- 해시태그 (서비스에서 2개로 잘라줌) -->
        <div style="margin-top:8px; display:flex; gap:6px; flex-wrap:wrap;">
          <span th:each="t : ${c.hashtags}"
                th:text="|${t}|"
                style="font-size:12px; padding:4px 8px; background:#f5f5f5; border-radius:999px;">
            #태그
          </span>

          <span th:each="t : ${c.interhashtags}"
                th:text="|${t}|"
                style="font-size:12px; padding:4px 8px; background:#eef6ff; border-radius:999px;">
            #관심태그
          </span>
        </div>
      </div>

    </div>

    <!-- 더보기: 코치찾기 페이지로 keyword 들고 이동 -->
    <div style="padding:14px 0;">
      <a th:href="@{/coach/search(keyword=${keyword}, sort='latest', majorField=0, minorField=0, majorRegion=0, minorRegion=0)}"
         style="display:inline-block; padding:10px 14px; border:1px solid #ddd; border-radius:10px; text-decoration:none; color:#111;">
        코치 검색결과 더보기
      </a>
    </div>
  </div>
</div>
				<div>
					<span>클래스 검색결과(n)</span>
					<div>
						결과
					</div>
				</div>
			</div>
		</div>
	</main>

	<div th:replace="~{layout/footer :: siteFooter}"></div>

</body>
</html>
