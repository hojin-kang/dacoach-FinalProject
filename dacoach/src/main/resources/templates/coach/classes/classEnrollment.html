<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
<title>클래스 수강신청 - dacoach</title>
<link rel="stylesheet" th:href="@{/css/main.css}" />
<link rel="stylesheet" th:href="@{/css/coach_class.css}" />
</head>
<body>
	<div th:replace="~{layout/header :: siteHeader}"></div>

	<main class="main">
		<div class="enrollment-container">
			<h1 style="text-align: center; margin-bottom: 30px;">클래스 수강신청</h1>

			<!-- 알림 메시지 표시 -->
			<div class="alert alert-info" th:if="${message}"
				th:classappend="${messageType == 'error' ? 'alert-warning' : ''}"
				th:text="${message}"></div>

			<!-- 클래스 정보 카드 -->
			<div class="class-info-card">
				<h2 th:text="${classDTO.title}">클래스 제목</h2>

				<div class="info-row">
					<span class="info-label">제공자</span> <span class="info-value"
						th:text="${classDTO.provider_name}">제공자명</span>
				</div>

				<div class="info-row">
					<span class="info-label">수강 가능 기간</span> <span class="info-value"
						th:text="|${#dates.format(classDTO.start_date, 'yyyy년 MM월 dd일')} ~ ${#dates.format(classDTO.end_date, 'yyyy년 MM월 dd일')}|">
					</span>
				</div>

				<div class="info-row">
					<span class="info-label">수강료 (1일)</span> <span class="info-value"
						th:text="|${#numbers.formatInteger(classDTO.price, 3, 'COMMA')}원|">
					</span>
				</div>

				<div class="info-row">
					<span class="info-label">일일 정원</span> <span class="info-value"
						th:text="|${classDTO.max_user_cnt}명|"></span>
				</div>
			</div>

			<!-- 달력 카드 -->
			<div class="calendar-card">
				<div class="calendar-header">
					<h3>수강 날짜를 선택하세요</h3>
					<div class="month-nav">
						<button type="button" id="prevMonth">◀ 이전</button>
						<span class="current-month" id="currentMonth">2024년 1월</span>
						<button type="button" id="nextMonth">다음 ▶</button>
					</div>
				</div>

				<!-- 달력 그리드 -->
				<div class="calendar-grid">
					<!-- 요일 헤더 -->
					<div class="calendar-day-header">일</div>
					<div class="calendar-day-header">월</div>
					<div class="calendar-day-header">화</div>
					<div class="calendar-day-header">수</div>
					<div class="calendar-day-header">목</div>
					<div class="calendar-day-header">금</div>
					<div class="calendar-day-header">토</div>

					<!-- 날짜들은 JavaScript로 동적 생성 -->
				</div>

				<!-- 범례 -->
				<div class="legend">
					<div class="legend-item">
						<div class="legend-color available"></div>
						<span>수강 가능</span>
					</div>
					<div class="legend-item">
						<div class="legend-color today"></div>
						<span>오늘</span>
					</div>
					<div class="legend-item">
						<div class="legend-color selected"></div>
						<span>선택됨</span>
					</div>
					<div class="legend-item">
						<div class="legend-color enrolled"></div>
						<span>신청완료</span>
					</div>
					<div class="legend-item">
						<div class="legend-color full"></div>
						<span>정원 마감</span>
					</div>
				</div>

				<!-- 선택된 날짜 정보 -->
				<div class="selected-date-info" id="selectedDateInfo"
					style="display: none;">
					선택한 날짜: <strong id="selectedDateText">-</strong>
				</div>

				<!-- 버튼 -->
				<div class="enrollment-actions">
					<button type="button" class="btn btn-secondary"
						th:onclick="|location.href='@{/coach/classDetail(id=${classDTO.class_idx})}'|">
						취소</button>
					<button type="button" class="btn btn-primary" id="submitBtn"
						disabled onclick="startKakaoPay()">카카오페이로 결제하기</button>
				</div>
			</div>
		</div>
	</main>

	<div th:replace="~{layout/footer :: siteFooter}"></div>

	<script th:inline="javascript">
	// Thymeleaf 변수를 JavaScript로 전달
	const classId = /*[[${classDTO.class_idx}]]*/ 0;
	const classTitle = /*[[${classDTO.title}]]*/ '';
	const classPrice = /*[[${classDTO.price}]]*/ 0;
	const startDate = new Date(/*[[${classDTO.start_date}]]*/ '2024-01-01');
	const endDate = new Date(/*[[${classDTO.end_date}]]*/ '2024-12-31');
	const maxUserCnt = /*[[${classDTO.max_user_cnt}]]*/ 10;
	const enrolledDates = /*[[${enrolledDates}]]*/ []; // 이미 신청한 날짜 목록

	let currentDate = new Date();
	let selectedDate = null;

	// 현재 월을 클래스 시작월로 초기화
	if (currentDate < startDate) {
		currentDate = new Date(startDate);
	}

	// 달력 렌더링
	function renderCalendar() {
		const year = currentDate.getFullYear();
		const month = currentDate.getMonth();

		// 월 표시 업데이트
		document.getElementById('currentMonth').textContent = 
			`${year}년 ${month + 1}월`;

		// 이전/다음 버튼 활성화 상태
		const prevBtn = document.getElementById('prevMonth');
		const nextBtn = document.getElementById('nextMonth');

		const firstDayOfStartMonth = new Date(startDate.getFullYear(), startDate.getMonth(), 1);
		const lastDayOfEndMonth = new Date(endDate.getFullYear(), endDate.getMonth() + 1, 0);
		
		prevBtn.disabled = currentDate <= firstDayOfStartMonth;
		nextBtn.disabled = currentDate >= lastDayOfEndMonth;

		// 달력 그리드 가져오기 (요일 헤더 제외)
		const calendarGrid = document.querySelector('.calendar-grid');
		const dayHeaders = calendarGrid.querySelectorAll('.calendar-day-header');
		
		// 기존 날짜 셀 제거
		calendarGrid.querySelectorAll('.calendar-day').forEach(el => el.remove());

		// 이번 달의 첫날과 마지막날
		const firstDay = new Date(year, month, 1);
		const lastDay = new Date(year, month + 1, 0);
		
		// 이번 달 1일의 요일 (0: 일요일)
		const firstDayOfWeek = firstDay.getDay();
		
		// 이전 달 날짜 채우기
		const prevMonthLastDay = new Date(year, month, 0).getDate();
		for (let i = firstDayOfWeek - 1; i >= 0; i--) {
			const day = prevMonthLastDay - i;
			const dayEl = createDayElement(day, true);
			calendarGrid.appendChild(dayEl);
		}

		// 이번 달 날짜 채우기
		for (let day = 1; day <= lastDay.getDate(); day++) {
			const date = new Date(year, month, day);
			const dayEl = createDayElement(day, false, date);
			calendarGrid.appendChild(dayEl);
		}

		// 다음 달 날짜 채우기 (6주 그리드 완성)
		const totalCells = calendarGrid.children.length - 7; // 요일 헤더 제외
		const remainingCells = 42 - totalCells; // 6주 * 7일 = 42
		for (let day = 1; day <= remainingCells; day++) {
			const dayEl = createDayElement(day, true);
			calendarGrid.appendChild(dayEl);
		}
	}

	// 날짜 셀 생성
	function createDayElement(day, isOtherMonth, date = null) {
		const dayEl = document.createElement('div');
		dayEl.className = 'calendar-day';
		
		const dayNumber = document.createElement('div');
		dayNumber.className = 'day-number';
		dayNumber.textContent = day;
		
		const dayStatus = document.createElement('div');
		dayStatus.className = 'day-status';
		
		dayEl.appendChild(dayNumber);
		dayEl.appendChild(dayStatus);

		if (isOtherMonth) {
			dayEl.classList.add('other-month');
			return dayEl;
		}

		// 오늘 날짜 체크
		const today = new Date();
		today.setHours(0, 0, 0, 0);
		const isToday = date && 
			date.getFullYear() === today.getFullYear() &&
			date.getMonth() === today.getMonth() &&
			date.getDate() === today.getDate();
		
		if (isToday) {
			dayEl.classList.add('today');
		}

		// 수강 가능 기간 체크
		const classStart = new Date(startDate);
		classStart.setHours(0, 0, 0, 0);
		const classEnd = new Date(endDate);
		classEnd.setHours(23, 59, 59, 999);

		if (date < classStart || date > classEnd || date < today) {
			dayEl.classList.add('disabled');
			dayStatus.textContent = '불가';
			return dayEl;
		}

		// 날짜 문자열로 변환
		const dateStr = formatDate(date);

		// 이미 신청한 날짜인지 확인
		if (enrolledDates.includes(dateStr)) {
			dayEl.classList.add('enrolled');
			dayStatus.textContent = '신청완료';
			return dayEl;
		}

		// 정원 확인을 위한 Ajax 호출
		fetchEnrollmentCount(dateStr, dayEl, dayStatus);

		// 클릭 이벤트
		dayEl.addEventListener('click', function() {
			if (this.classList.contains('disabled') || 
				this.classList.contains('full') || 
				this.classList.contains('enrolled') || 
				this.classList.contains('other-month')) {
				return;
			}

			// 기존 선택 해제
			document.querySelectorAll('.calendar-day.selected').forEach(el => {
				el.classList.remove('selected');
			});

			// 새로운 선택
			this.classList.add('selected');
			selectedDate = dateStr;

			// 선택된 날짜 정보 표시
			const info = document.getElementById('selectedDateInfo');
			const text = document.getElementById('selectedDateText');
			text.textContent = `${date.getFullYear()}년 ${date.getMonth() + 1}월 ${date.getDate()}일`;
			info.style.display = 'block';

			// 제출 버튼 활성화
			document.getElementById('submitBtn').disabled = false;
		});

		return dayEl;
	}

	// 정원 확인 Ajax
	async function fetchEnrollmentCount(dateStr, dayEl, dayStatus) {
		try {
			const response = await fetch(`/coach/enrollmentCount?classId=${classId}&date=${dateStr}`);
			const data = await response.json();

			if (data.success) {
				const available = data.available;
				dayStatus.textContent = `${available}/${maxUserCnt}`;

				if (available <= 0) {
					dayEl.classList.add('full');
					dayStatus.textContent = '마감';
				}
			}
		} catch (error) {
			console.error('정원 조회 실패:', error);
		}
	}

	// 날짜 포맷 (YYYY-MM-DD)
	function formatDate(date) {
		const year = date.getFullYear();
		const month = String(date.getMonth() + 1).padStart(2, '0');
		const day = String(date.getDate()).padStart(2, '0');
		return `${year}-${month}-${day}`;
	}

	// 이전 월
	document.getElementById('prevMonth').addEventListener('click', function() {
		currentDate.setMonth(currentDate.getMonth() - 1);
		renderCalendar();
	});

	// 다음 월
	document.getElementById('nextMonth').addEventListener('click', function() {
		currentDate.setMonth(currentDate.getMonth() + 1);
		renderCalendar();
	});

	// 폼 제출 시 확인
	document.getElementById('enrollForm') && document.getElementById('enrollForm').addEventListener('submit', function(e) {
		if (!selectedDate) {
			e.preventDefault();
			alert('수강 날짜를 선택해주세요.');
			return false;
		}
	});

	// 카카오페이 결제 시작
	function startKakaoPay() {
		if (!selectedDate) {
			alert('수강 날짜를 선택해주세요.');
			return;
		}

		const parameters = {
			cid: "TC0ONETIME",
			partner_order_id: "class_" + Date.now(),
			partner_user_id: "sessionUser",
			item_name: classTitle + " (" + selectedDate + ")",
			quantity: 1,
			total_amount: classPrice,
			vat_amount: 0,
			tax_free_amount: 0,
			approval_url: "http://localhost:9090/kakaopay/class/success",
			fail_url: "http://localhost:9090/kakaopay/class/fail",
			cancel_url: "http://localhost:9090/kakaopay/class/cancel",
			// 수강신청에 필요한 추가 정보
			class_id: classId,
			enrollment_date: selectedDate
		};

		fetch('/kakaopay/class/ready', {
			method: 'POST',
			headers: { 'Content-Type': 'application/json' },
			body: JSON.stringify(parameters)
		})
		.then(function(resp) {
			if (resp.ok) return resp.text();
			throw new Error('결제 요청 중 오류가 발생했습니다. 고객센터에 문의해주세요.');
		})
		.then(function(data) {
			var val = JSON.parse(data);
			window.location.href = val.next_redirect_pc_url;
		})
		.catch(function(error) {
			alert(error.message);
		});
	}

	// 초기 렌더링
	renderCalendar();
	</script>
</body>
</html>
