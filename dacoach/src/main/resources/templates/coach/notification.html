<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

	<meta charset="UTF-8" />
	<title>dacoach</title>

	<link rel="stylesheet" th:href="@{/css/main.css}" />
	<link rel="stylesheet" th:href="@{/css/coach/notification.css}" />
</head>
<body>
	<div th:replace="layout/header :: siteHeader"></div>

	<main class="main">
	<div class="container">
		<h2>알림</h2>
		<hr>
		<div class="notificationDiv">
			<div class="empty" th:if="${#lists.isEmpty(ndtos)}">새로운 알림이 없습니다.</div>
			<form action="">
				<div class="notiUnit" th:each="n : ${ndtos}">
				<img alt="noti" src="img/icon/notification_color.png">
				<span th:text="${n.content}"></span>
				<button type="submit" name="noti_idx" th:value="${n.noti_idx}">×</button>
				</div>
			</form>
			
		</div>
	</div>
	</main>
  
	<div th:replace="layout/footer :: siteFooter"></div>

</body>
</html>
