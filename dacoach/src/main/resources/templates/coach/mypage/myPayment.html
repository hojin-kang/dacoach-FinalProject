<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link rel="stylesheet" th:href="@{/css/main.css}" />
<link rel="stylesheet" th:href="@{/css/mypage.css}" />
</head>
<body>
	<div th:replace="~{layout/header :: siteHeader}"></div>

	<main class="main">
		<div class="container">
			<div class="breadcrumb">
				<a th:href="@{/mypage}">마이페이지</a>
				<span class="sep">&gt;</span>
				<span>나의 결제 내역</span>
			</div>

			<h2 class="pageTitle">나의 결제 내역</h2>
			<hr class="line" />

			<div>
			<table class="paymentTable">
          <thead>
            <tr>
              <th>사용 일시</th>
              <th>내용</th>
              <th>사용 개수</th>
              <th>남은 개수</th>
            </tr>
          </thead>

          <tbody>
            <!-- 예시: th:each로 반복 -->
            <tr th:each="h : ${thdto}">
              <td th:text="${#dates.format(h.created_at,'yyyy-MM-dd HH:mm:ss')}">시간</td>
              <td th:text="${h.hist_type}">타입</td>
              <td th:text="${h.amount}">사용 개수</td>
              <td th:text="${h.balance_after}">남은 개수</td>
            </tr>

            <!-- 데이터 없을 때 -->
            <tr th:if="${thdto == null or #lists.isEmpty(thdto)}">
              <td class="emptyRow" colspan="4">사용 내역이 없습니다.</td>
            </tr>
          </tbody>
        </table>
			</div>
			

		</div>
	</main>

	<div th:replace="~{layout/footer :: siteFooter}"></div>
</body>
</html>
