<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>마이페이지</title>
<link rel="stylesheet" th:href="@{/css/main.css}" />
<link rel="stylesheet" th:href="@{/css/mypage.css}" />
</head>
<body>
	<div th:replace="~{layout/header :: siteHeader}"></div>
	
	<main class="main">
    	<div class="container">
    		<h2>마이페이지</h2>
    		<div class="profileArea">
    			<img th:src="${session.photo!=null}?@{'/uploads/'+${session.photo}}:@{/img/profile/defaultProfile.jpg}">
    			<div class="coachInfo">
    				<span th:text="${user_rank}">베테랑 코치</span>
					<span th:text="${user_nickname}">김코치</span>
    			</div>
    			<div class="profileBtnArea">
    				<a href="/myInfo"><button>개인정보 수정</button></a>
    				<a href="/logout"><button>로그아웃</button></a>
    				<a href="/auth/kakao" th:if="${#strings.isEmpty(session.kakao)}"><button>카카오계정 연결</button></a>
    			</div>
    		</div>
    		<hr>
    		<div class="mypageMenu">
    			<div class="menuUnit">
    				<span class="titleSpan">찜</span>
    				<a href="/myHeart">나의 찜</a>
    			</div>
    			
    			<div class="menuUnit">
    				<span class="titleSpan">수강 관리</span>
    				<a href="/coach/myEnrollment">나의 수강 내역</a>
    			</div>
    			
    			<div class="menuUnit">
    				<span class="titleSpan">리뷰 관리</span>
    				<a href="/myReview">나의 리뷰</a>
    			</div>
    			
    			<div class="menuUnit">
    				<span class="titleSpan">결제 관리</span>
    				<a href="/myPayment">나의 결제 내역</a>
    			</div>
    			
    			<div class="menuUnit">
    				<span class="titleSpan">고객센터</span>
    				<a href="/notice">공지사항</a>
    				<a href="/myQnaList">1:1 문의</a>
    			</div>
    			<div class="menuUnit">
    				<span class="titleSpan">자격증</span>
    				<a href="/myCert">나의 자격증</a>
    				<a href="/cert">자격증 등록</a>
    			</div>  
    			<div class="menuUnit">
    				<span class="titleSpan">도전과제</span>
    				<a href="/myChallenge">도전과제 현황</a>
    			</div>

				<!-- 변경: 모달 열기 -->
				<a href="javascript:void(0)" id="openWithdraw"
					style="color: #6A6A6A;">회원 탈퇴</a>

				<!-- 탈퇴 모달 -->
				<div id="withdrawModal" class="modal" style="display: none;">
					<div class="modalBackdrop"></div>

					<div class="modalBox">
						<h3 class="modalTitle">회원 탈퇴</h3>
						<p class="modalDesc">탈퇴 시 계정은 비활성화되며, 일부 기록은 법령/운영 정책에 따라 보관될
							수 있습니다.</p>

						<form method="post" action="/withdraw" id="withdrawForm">
							<div class="reasonList">
								<label th:each="r, iter : ${withdrawReasons}" class="reasonItem">
									<input type="radio" name="reason_type_idx"
									th:value="${r['REASON_TYPE_IDX']}"
									th:checked="${iter.index == 0}" required> <span
									th:text="${r['CONTENT']}">사유</span>
								</label>
							</div>

							<div class="modalBtns">
								<button type="button" id="closeWithdraw" class="btnCancel">취소</button>
								<button type="submit" class="btnDanger">탈퇴하기</button>
							</div>
						</form>
					</div>
				</div>
			</div>
    	</div>
    </main>
	<div th:replace="~{layout/footer :: siteFooter}"></div>
	
<script>
  const openBtn = document.getElementById('openWithdraw');
  const closeBtn = document.getElementById('closeWithdraw');
  const modal = document.getElementById('withdrawModal');

  openBtn.addEventListener('click', () => modal.style.display = 'block');
  closeBtn.addEventListener('click', () => modal.style.display = 'none');

  // 바깥 클릭 시 닫기
  modal.querySelector('.modalBackdrop').addEventListener('click', () => modal.style.display = 'none');
</script>
</body>
</html>
