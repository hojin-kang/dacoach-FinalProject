<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link rel="stylesheet" th:href="@{/css/main.css}" />
<link rel="stylesheet" th:href="@{/css/mypage.css}" />
</head>
<body>
	<div th:replace="layout/header :: siteHeader"></div>

	<main class="main">
		<div class="container">
			<div class="breadcrumb">
				<a th:href="@{/mypage}">마이페이지</a>
				<span class="sep">&gt;</span>
				<span>1:1 문의</span>
			</div>

			<h2 class="pageTitle">1:1 문의</h2>
			<hr class="line" />

			<!-- 리스트 -->
			<div class="qnaWrap">

			  <div class="empty" th:if="${#lists.isEmpty(qnaList)}">
			    등록된 문의가 없습니다.
			  </div>
			
			  <form th:each="q : ${qnaList}"
			        th:action="@{/myQnaDetail}"
			        method="post"
			        class="qnaForm">
			
			    <input type="hidden" name="qna_idx" th:value="${q.qna_idx}"/>
			
			    <button type="submit" class="qnaItemBtn">
			      <div class="qnaTop">
			        <div class="qnaTitleRow">
			          <span class="qMark">Q.</span>
			          <span class="qTitle" th:text="${q.title}"></span>
			        </div>
			
			        <span th:text="${q.answerStatus}"
			              th:classappend="${q.answerStatus == '답변완료'} ? 'status done' : 'status wait'">
			        </span>
			      </div>
			
			      <div class="qnaPreview" th:text="${q.question}">
			        미리보기...
			      </div>
			    </button>
			  </form>
				<a th:href="@{/myQnaForm}"><button class="myQnaNewBtn">문의 등록</button></a>
			</div>
			

		</div>
	</main>

	<div th:replace="layout/footer :: siteFooter"></div>
</body>
</html>
