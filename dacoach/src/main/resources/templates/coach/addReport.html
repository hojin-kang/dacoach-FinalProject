<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

	<meta charset="UTF-8" />
	<title>dacoach</title>

	<link rel="stylesheet" th:href="@{/css/main.css}" />
	<link rel="stylesheet" th:href="@{/css/coach/report.css}" />
</head>
<body>
	<div th:replace="layout/header :: siteHeader"></div>

	<main class="main">
	<div class="container">
		<h2>신고</h2>
		<hr>
		
		<form th:action="@{/report}" method="post">

		  <input type="hidden" name="reported_idx" th:value="${reported_idx}">
		  <input type="hidden" name="returnUrl" th:value="${returnUrl}">
		
		  <select name="reason_type_idx" required>
		    <option th:each="r : ${reasons}"
		            th:value="${r.REASON_TYPE_IDX}"
		            th:text="${r.CONTENT}">
		    </option>
		  </select>
		
		  <textarea name="content" required placeholder="신고 내용을 자세하게 적어주세요."></textarea>
		
		  <button type="submit">신고 제출</button>
		</form>
	</div>
	</main>
  
	<div th:replace="layout/footer :: siteFooter"></div>

</body>
</html>
