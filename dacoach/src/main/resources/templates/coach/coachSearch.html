<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>dacoach - 코치 찾기</title>
    <link rel="stylesheet" th:href="@{/css/main.css}" />
    <link rel="stylesheet" th:href="@{/css/coach/coach_search.css}" />
    <script th:inline="javascript">
	  const IS_LOGGED_IN = [[${session.user_idx != null}]];
	</script>
</head>
<body>
    <div th:replace="~{layout/header :: siteHeader}"></div>

    <main class="main">
        <div class="container">
            <h2 class="page-header">코치 찾기</h2>
            <hr>

            <div class="classPage">
                <form id="filterForm" class="filterForm" th:action="@{/coach/search}" method="get">
                    <aside class="searchArea">
                        <div class="searchHead">검색 조건</div>
                        <div class="filterRow">
                            <div class="filter">
                                <label class="filterLabel">분야</label>
                                <div>
                                    <select class="filterSelect" name="majorField" id="majorField">
                                        <option value="">대분류</option>
                                        <option th:each="m : ${majorFields}" 
                                                th:value="${m.MAJOR_FIELD_IDX}" 
                                                th:text="${m.MAJOR_FIELD_CD}"
                                                th:selected="${param.majorField != null and #strings.equals(param.majorField[0], m.MAJOR_FIELD_IDX)}"></option>
                                    </select> 
                                    <select class="filterSelect" name="minorField" id="minorField" disabled>
                                        <option value="">소분류</option>
                                    </select>
                                </div>
                            </div>
                            
                            <div class="filter">
                                <label class="filterLabel">지역</label>
                                <div>
                                    <select class="filterSelect" name="majorRegion" id="majorRegion">
                                        <option value="">대분류</option>
                                        <option th:each="m : ${majorRegions}" 
                                                th:value="${m.MAJOR_REGION_IDX}" 
                                                th:text="${m.REGION_NM}"
                                                th:selected="${param.majorRegion != null and #strings.equals(param.majorRegion[0], m.MAJOR_REGION_IDX)}"></option>
                                    </select> 
                                    <select class="filterSelect" name="minorRegion" id="minorRegion" disabled>
                                        <option value="">소분류</option>
                                    </select>
                                </div>
                            </div>
                            
                            <div class="keywordBox">
                                <input class="keywordInput" type="text" name="keyword" placeholder="코치명 또는 태그 검색" th:value="${param.keyword}"/>
                            </div>
                            <button class="keywordBtn" type="submit">검색</button>
                        </div>
                    </aside>

                    <section class="contentArea">
                        <div class="contentTop">
                            <div class="sortBox">
                                <select class="sortSelect" name="sort" id="sortSelect">
                                    <option value="latest" th:selected="${param.sort != null and #strings.equals(param.sort[0], 'latest')}">최신순</option>
                                    <option value="rating" th:selected="${param.sort != null and #strings.equals(param.sort[0], 'rating')}">평점순</option>
                                    <option value="most" th:selected="${param.sort != null and #strings.equals(param.sort[0], 'most')}">리뷰 많은순</option>
                                </select>
                            </div>
                        </div>

                        <div class="cardGrid">
                            <div class="empty-msg" th:if="${#lists.isEmpty(coachList)}">일치하는 코치가 없습니다.</div>
                            
                            <article class="classCard coachCard" th:each="dto : ${coachList}" th:attr="data-href=@{/coach/detail(user_idx=${dto.user_idx})}">
                                <div class="card-body">
                                    <div class="profile-section">
                                        <div class="coach-thumb">
                                            <img th:src="${dto.photo != null} ? @{/uploads/{path}(path=${dto.photo})} : @{/img/profile/defaultProfile.jpg}" alt="coach">
                                        </div>
                                        <div class="name-rating">
                                            <div class="badge" th:text="${dto.rank_name}">등급</div>
                                            <div class="coach-name" th:text="${dto.nickname}">닉네임</div>
                                            <div class="coach-rating">★[[${dto.rating}]]([[${dto.review_count}]])</div>
                                        </div>
                                    </div>
                                    <div class="right">
                                        <div class="row">
                                            <div class="label">제공분야</div>
                                            <div class="tags">
                                                <a th:each="tag : ${dto.hashtags}" 
                                                   th:href="@{/coach/search(keyword=${tag})}" 
                                                   class="tag stop-card"
                                                   th:text="${tag}"></a>
                                            </div>
                                        </div>
                                        <div class="row">
                                            <div class="label">관심분야</div>
                                            <div class="tags">
                                                <a th:each="tag : ${dto.interhashtags}" 
                                                   th:href="@{/coach/search(keyword=${tag})}" 
                                                   class="tag stop-card" 
                                                   th:text="${tag}"></a>
                                            </div>
                                        </div>
                                    </div>
                                </div>
								<th:block th:unless="${session.user_type != null and #strings.equalsIgnoreCase(session.user_type, 'company')}">
                                <div class="card-footer" th:if="${dto.user_idx != session.user_idx}">
                                   <th:block th:if="${dto.matchStatus == 'ACCEPTED'}">
							    <button type="button" class="btn-chat stop-card" onclick="location.href='/chat'">
							        채팅방이동
							    </button>
								</th:block>
								
								<th:block th:unless="${dto.matchStatus == 'ACCEPTED'}" th:switch="${dto.chatStatus}">
								    <button type="button" th:case="'RECEIVED'" class="btn-chat stop-card" th:onclick="applyAction('A_CHAT', [[${dto.user_idx}]])">
								        채팅수락 <img th:src="@{/img/icon/dakcoach.png}" class="btn-icon">×1
								    </button>
								    <button type="button" th:case="'APPLIED'" class="btn-chat stop-card" disabled style="background:#eee; color:#999;">
								        신청됨
								    </button>
								    <button type="button" th:case="'ACCEPTED'" class="btn-chat stop-card" th:onclick="|location.href='/chat/room/${dto.chat_room_idx}?tab=COACH'|">
								        채팅방이동
								    </button>
								    <button type="button" th:case="*" class="btn-chat stop-card" th:onclick="applyAction('CHAT', [[${dto.user_idx}]])">
								        채팅신청 <img th:src="@{/img/icon/dakcoach.png}" class="btn-icon">×1
								    </button>
								</th:block>
								
								<th:block th:switch="${dto.matchStatus}">
								    <button type="button" th:case="'RECEIVED'" class="btn-match stop-card" th:onclick="applyAction('A_MATCH', [[${dto.user_idx}]])">
								        매칭수락 <img th:src="@{/img/icon/dakcoach.png}" class="btn-icon">×3
								    </button>
								    <button type="button" th:case="'APPLIED'" class="btn-match stop-card" disabled style="background:#666; color:#fff;">
								        신청됨
								    </button>
								    <button type="button" th:case="'ACCEPTED'" class="btn-match stop-card" disabled>
								        매칭완료
								    </button>
								    <button type="button" th:case="*" class="btn-match stop-card" th:onclick="applyAction('MATCH', [[${dto.user_idx}]])">
								        매칭신청 <img th:src="@{/img/icon/dakcoach.png}" class="btn-icon">×3
								    </button>
								</th:block>
                                </div>
                                </th:block>
                            </article>
                        </div>
                        <div id="pageStr" th:unless="${#strings.isEmpty(pageStr)}" th:utext="${pageStr}"></div>
                    </section>
                    
                </form>
            </div>
        </div>
    </main>

    <div th:replace="~{layout/footer :: siteFooter}"></div>

    <script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', () => {
        const form = document.getElementById('filterForm');
        
        // URL 파라미터에서 현재 선택된 소분류 값 가져오기
        const urlParams = new URLSearchParams(window.location.search);
        const selectedMinorField = urlParams.get('minorField');
        const selectedMinorRegion = urlParams.get('minorRegion');

        // 1. 카드 클릭 및 이벤트 전파 방지
        document.querySelectorAll('.coachCard').forEach(card => {
            card.addEventListener('click', (e) => {
                if (e.target.closest('.stop-card')) return;
                const href = card.getAttribute('data-href');
                if (href) window.location.href = href;
            });
        });

        document.querySelectorAll('.stop-card').forEach(el => {
            el.addEventListener('click', (e) => e.stopPropagation());
        });

        // 2. 정렬 변경 시 자동 검색
        document.getElementById('sortSelect')?.addEventListener('change', () => form.submit());

        // 3. 소분류 로드 및 자동 선택 함수
        async function handleMinorLoading(majorId, minorId, url, idKey, nmKey, paramName, initialValue) {
            const majorEl = document.getElementById(majorId);
            const minorEl = document.getElementById(minorId);

            const loadMinor = async (selectedValue) => {
                const val = majorEl.value;
                minorEl.innerHTML = '<option value="">소분류</option>';
                minorEl.disabled = true;

                if (!val) return;

                try {
                    const response = await fetch(`${url}?${paramName}=${encodeURIComponent(val)}`);
                    if (!response.ok) throw new Error('Network response was not ok');
                    const data = await response.json();

                    data.forEach(item => {
                        const opt = document.createElement('option');
                        opt.value = item[idKey];
                        opt.textContent = item[nmKey];
                        // URL에 저장된 값과 일치하면 선택 처리
                        if (selectedValue && String(item[idKey]) === String(selectedValue)) {
                            opt.selected = true;
                        }
                        minorEl.appendChild(opt);
                    });
                    minorEl.disabled = false;
                } catch (error) {
                    console.error('Fetching error:', error);
                }
            };

            // 대분류 변경 시 소분류 새로 로드
            majorEl.addEventListener('change', () => loadMinor());

            // 페이지 최초 로드 시 대분류에 값이 있으면 소분류 즉시 로드
            if (majorEl.value) {
                await loadMinor(initialValue);
            }
        }

        // 함수 호출
        handleMinorLoading('majorField', 'minorField', '/minorFields', 'MINOR_FIELD_IDX', 'MINOR_FIELD_NM', 'majorFieldIdx', selectedMinorField);
        handleMinorLoading('majorRegion', 'minorRegion', '/minorRegions', 'MINOR_REGION_IDX', 'DISTRICT_NM', 'majorRegionIdx', selectedMinorRegion);
    });

    // 신청 액션 함수
    function applyAction(type, targetIdx) {
    	  if (!IS_LOGGED_IN) {
    	    location.href = '/login';
    	    return;
    	  }

    	  const msgs = {
    	    'CHAT': "채팅 신청을 하시겠습니까? 닭꼬치 1개가 차감됩니다.",
    	    'MATCH': "매칭 신청을 하시겠습니까? 닭꼬치 3개가 차감됩니다.",
    	    'A_CHAT': "채팅 신청을 수락하시겠습니까? 닭꼬치 1개가 차감됩니다.",
    	    'A_MATCH': "매칭 신청을 수락하시겠습니까? 닭꼬치 3개가 차감됩니다."
    	  };

    	  if (!confirm(msgs[type])) return;

    	  fetch('/match/apply', {
    	    method: 'POST',
    	    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    	    body: new URLSearchParams({ type, target_idx: targetIdx })
    	  })
    	  .then(r => r.json())
    	  .then(res => {
    	    if (res.status === 'success' || (res.status && res.status.includes('accepted'))) {
    	      alert("완료되었습니다.");
    	      location.reload();
    	    }else if(res.status.includes('already')){
    	    	alert("상대방이 이미 신청했습니다");
    	    	location.reload();
    	    }
    	    else if (res.status === 'no_token') {
    	      alert("닭꼬치가 부족합니다.");
    	      location.href = '/tokenHistory';
    	    } else if (res.status === 'login_required') {
    	      location.href = '/login';
    	    } else {
    	      alert("오류가 발생했습니다.");
    	    }
    	  });
    	}
    </script>
</body>
</html>
