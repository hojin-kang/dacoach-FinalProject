<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>dacoach - 코치 찾기</title>
    <link rel="stylesheet" th:href="@{/css/main.css}" />
    <link rel="stylesheet" th:href="@{/css/coach/coach_search.css}" />
</head>
<body>
    <div th:replace="~{layout/header :: siteHeader}"></div>

    <main class="main">
        <div class="container">
            <h2 class="page-header">코치 찾기</h2>
            <hr>

            <div class="classPage">
                <form id="filterForm" class="filterForm" th:action="@{/coach/search}" method="get">
                    <aside class="searchArea">
                        <div class="searchHead">검색 조건</div>
                        <div class="filterRow">
                            <div class="filter">
                                <label class="filterLabel">분야</label>
                                <div>
                                	<select class="filterSelect" name="majorField" id="majorField">
	                                    <option value="">대분류</option>
	                                    <option th:each="m : ${majorFields}" th:value="${m.MAJOR_FIELD_IDX}" th:text="${m.MAJOR_FIELD_CD}"></option>
	                                </select> 
	                                <select class="filterSelect" name="minorField" id="minorField" disabled>
	                                    <option value="">소분류</option>
	                                </select>
                                </div>
                                
                            </div>
                            
                            <div class="filter">
                                <label class="filterLabel">지역</label>
                                <div>
                                	 <select class="filterSelect" name="majorRegion" id="majorRegion">
	                                    <option value="">대분류</option>
	                                    <option th:each="m : ${majorRegions}" th:value="${m.MAJOR_REGION_IDX}" th:text="${m.REGION_NM}"></option>
	                                </select> 
	                                <select class="filterSelect" name="minorRegion" id="minorRegion" disabled>
	                                    <option value="">소분류</option>
	                                </select>
                                </div>
                               
                            </div>
                            
                            <div class="keywordBox">
                                <input class="keywordInput" type="text" name="keyword" placeholder="코치명 또는 태그 검색" th:value="${param.keyword}"/>
                            </div>
                            <button class="keywordBtn" type="submit">검색</button>
                        </div>
                    </aside>

                    <section class="contentArea">
                        <div class="contentTop">
                            <div class="sortBox">
                                <select class="sortSelect" name="sort" id="sortSelect">
                                    <option value="latest" th:selected="${sort == 'latest'}">최신순</option>
                                    <option value="rating" th:selected="${sort == 'rating'}">평점순</option>
                                    <option value="most" th:selected="${sort == 'most'}">리뷰 많은순</option>
                                </select>
                            </div>
                        </div>

                        <div class="cardGrid">
                            <div class="empty-msg" th:if="${#lists.isEmpty(coachList)}">일치하는 코치가 없습니다.</div>
                            
                            <article class="classCard coachCard" th:each="dto : ${coachList}" th:attr="data-href=@{/coach/detail(user_idx=${dto.user_idx})}">
                                    <div class="card-body">
                                        <div class="profile-section">
                                            <div class="coach-thumb">
                                                <img th:src="${dto.photo != null} ? @{/uploads/{path}(path=${dto.photo})} : @{/img/profile/defaultProfile.jpg}" alt="coach">
                                            </div>
                                            <div class="name-rating">
                                            	<div class="badge" th:text="${dto.rank_name}">베테랑 코치</div>
                                                <div class="coach-name" th:text="${dto.nickname}">닉네임</div>
                                                <div class="coach-rating">★[[${dto.rating}]]([[${dto.review_count}]])</div>
                                            </div>
                                        </div>
                                        <div class="right">
							              <div class="row">
							                <div class="label">제공분야</div>
							                <div class="tags">
							                  <a th:each="tag : ${dto.hashtags}" 
											           th:href="@{/coach/search(keyword=${tag})}" 
											           class="tag stop-card"
											           style="text-decoration: none; color: inherit;"
											           th:text="${tag}">
											        </a>
							                </div>
							              </div>
							
							              <div class="row">
							                <div class="label">관심분야</div>
							                <div class="tags">
							                  <a th:each="tag : ${dto.interhashtags}" 
											           th:href="@{/coach/search(keyword=${tag})}" 
											           class="tag" 
											           style="text-decoration: none; color: inherit;"
											           th:text="${tag}">
											        </a>
							                </div>
							              </div>
							            </div>
                                        
                                    </div>

								<div class="card-footer" th:if="${dto.user_idx != session.user_idx}">
								    <th:block th:switch="${dto.chatStatus}">
								        <button type="button" th:case="'RECEIVED'" class="btn-chat stop-card" 
								                th:onclick="applyAction('A_CHAT', [[${dto.user_idx}]])">
								            채팅수락 <img src="/img/icon/dakcoach.png" class="btn-icon">×1
								        </button>
								        <button type="button" th:case="'APPLIED'" class="btn-chat stop-card" disabled style="background:#eee; color:#999;">
								            신청됨 <img src="/img/icon/dakcoach.png" class="btn-icon" style="filter: grayscale(1);">×1
								        </button>
								        <button type="button" th:case="'ACCEPTED'" class="btn-cha stop-cardt" onclick="location.href='/chat'">
								            채팅방이동 <img src="/img/icon/dakcoach.png" class="btn-icon">
								        </button>
								        <button type="button" th:case="*" class="btn-chat stop-card" 
								                th:onclick="applyAction('CHAT', [[${dto.user_idx}]])">
								            채팅신청 <img src="/img/icon/dakcoach.png" class="btn-icon">×1
								        </button>
								    </th:block>
								
								    <th:block th:switch="${dto.matchStatus}">
								        <button type="button" th:case="'RECEIVED'" class="btn-match stop-card" 
								                th:onclick="applyAction('A_MATCH', [[${dto.user_idx}]])">
								            매칭수락 <img src="/img/icon/dakcoach.png" class="btn-icon">×3
								        </button>
								        <button type="button" th:case="'APPLIED'" class="btn-match stop-card" disabled style="background:#666; color:#fff;">
								            신청됨 <img src="/img/icon/dakcoach.png" class="btn-icon">×3
								        </button>
								        <button type="button" th:case="'ACCEPTED'" class="btn-match stop-card" disabled>
								            매칭완료 <img src="/img/icon/dakcoach.png" class="btn-icon">
								        </button>
								        <button type="button" th:case="*" class="btn-match stop-card" 
								                th:onclick="applyAction('MATCH', [[${dto.user_idx}]])">
								            매칭신청 <img src="/img/icon/dakcoach.png" class="btn-icon">×3
								        </button>
								    </th:block>
								</div>
                            </article>
                        </div> </section>
                </form>
            </div>
        </div>
    </main>

    <div th:replace="~{layout/footer :: siteFooter}"></div>

	<script>
	document.addEventListener('DOMContentLoaded', () => {
	
	  // 카드 전체 클릭 시 상세로 이동
	  document.querySelectorAll('.coachCard').forEach(card => {
	    card.addEventListener('click', (e) => {
	      // 내부에서 stop 처리된 요소면 무시
	      if (e.target.closest('.stop-card')) return;
	
	      const href = card.getAttribute('data-href');
	      if (href) window.location.href = href;
	    });
	  });
	
	  // 태그/버튼 등은 카드 클릭으로 번지지 않게 확실히 차단
	  document.querySelectorAll('.stop-card').forEach(el => {
	    el.addEventListener('click', (e) => e.stopPropagation());
	  });
	
	});
	</script>
    <script th:inline="javascript">
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('filterForm');
            if (!form) return;

            // 정렬 변경 시 자동 검색
            document.getElementById('sortSelect')?.addEventListener('change', () => form.submit());

            // 소분류 로드 범용 함수
            async function handleMinorLoading(majorId, minorId, url, idKey, nmKey, paramName) {
                const majorEl = document.getElementById(majorId);
                const minorEl = document.getElementById(minorId);

                majorEl.addEventListener('change', async () => {
                    const val = majorEl.value;
                    minorEl.innerHTML = '<option value="">소분류</option>';
                    minorEl.disabled = true;

                    if (!val) return;

                    try {
                        const response = await fetch(`${url}?${paramName}=${encodeURIComponent(val)}`);
                        if (!response.ok) throw new Error('Network response was not ok');
                        const data = await response.json();

                        data.forEach(item => {
                            const opt = document.createElement('option');
                            opt.value = item[idKey];
                            opt.textContent = item[nmKey];
                            minorEl.appendChild(opt);
                        });
                        minorEl.disabled = false;
                    } catch (error) {
                        console.error('Fetching error:', error);
                    }
                });
            }

            handleMinorLoading('majorField', 'minorField', '/minorFields', 'MINOR_FIELD_IDX', 'MINOR_FIELD_NM', 'majorFieldIdx');
            handleMinorLoading('majorRegion', 'minorRegion', '/minorRegions', 'MINOR_REGION_IDX', 'DISTRICT_NM', 'majorRegionIdx');
        });

        function applyAction(type, targetIdx) {
            let msg =null;
            if(type === 'CHAT') {
                msg = "채팅 신청을 하시겠습니까? 토큰 1개가 차감됩니다.";
            } else if(type === 'MATCH') {
                msg = "매칭 신청을 하시겠습니까? 토큰 3개가 차감됩니다.";
            } else if(type === 'A_CHAT') {
                msg = "채팅 신청을 수락하시겠습니까?";
            } else if(type === 'A_MATCH') {
                msg = "매칭 신청을 수락하시겠습니까?";
            }
            if (!confirm(msg)) return;

            // @RequestParam을 처리하기 위해 URLSearchParams 사용
            const params = new URLSearchParams();
            params.append('type', type);
            params.append('target_idx', targetIdx);

            fetch('/match/apply', {
                method: 'POST',
                headers: {
                    // 서버가 @RequestParam으로 인식할 수 있도록 Content-Type 설정
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: params
            })
            .then(response => {
                if (!response.ok) throw new Error('Network response was not ok');
                return response.json();
            })
            .then(res => {
                if (res.status === 'success') {
                    alert("신청이 성공적으로 완료되었습니다.");
                    location.reload();
                } else if (res.status === 'login_required') {
                    alert("로그인이 필요합니다.");
                    location.href = '/login';
                } else if (res.status === 'no_token') {
                    alert("토큰이 부족합니다.");
                    location.href = '/tokenHistory';
                } else if(res.status === 'chat_accepted') {
                    alert("채팅이 수락되었습니다.");
                    location.reload();
                } else if(res.status === 'match_accepted') {
                    alert("매칭이 수락되었습니다.");
                    location.reload();
                }
                else {
                    alert("오류가 발생했습니다. 다시 시도해주세요.");
                }
            })
            .catch(error => {
                console.error('Fetch error:', error);
                alert("통신 중 오류가 발생했습니다.");
            });
        }
        </script>
</body>
</html>
