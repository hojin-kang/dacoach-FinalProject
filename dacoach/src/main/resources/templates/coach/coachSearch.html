<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
<title>dacoach - 코치 찾기</title>

<link rel="stylesheet" th:href="@{/css/main.css}" />
<link rel="stylesheet" th:href="@{/css/coach_class.css}" />

<style>
    .page-header {
        margin: 30px 0 10px;
    }
    
    .empty-msg {
        grid-column: span 2;
        text-align: center;
        padding: 50px;
        color: #666;
    }

    /* 코치 카드 전용 해시태그 스타일 추가 (기존 tag 스타일 활용) */
    .coach-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 5px;
        margin-top: 10px;
    }
    
    .coach-tag {
        display: inline-block;
        padding: 2px 8px;
        font-size: 11px;
        background: #e0e0e0;
        border-radius: 10px;
        color: #555;
    }

    /* 코치 아바타 스타일 (classCard 내부 thumb 대체용) */
    .coach-thumb {
        width: 100%;
        aspect-ratio: 1/1; /* 정사각형 프로필 */
        background: #f3f5f7;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    
    .coach-thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }
</style>
</head>
<body>
	<div th:replace="~{layout/header :: siteHeader}"></div>

	<main class="main">
		<div class="container">
			<h2 class="page-header">코치 찾기</h2>
			<hr>

			<div class="classPage">
				<form id="filterForm" class="filterForm" th:action="@{/coach/list}" method="get">
					<aside class="searchArea">
						<div class="searchHead">검색 조건</div>

						<div class="filterRow">
							<div class="filter">
								<label class="filterLabel">분야</label>
								<div>
									<select class="filterSelect majorField" name="majorField" id="majorField">
										<option value="">대분류</option>
										<option th:each="m : ${majorList}"
											th:value="${m.MAJOR_FIELD_IDX}" th:text="${m.MAJOR_FIELD_CD}"
											th:selected="${m.MAJOR_FIELD_IDX == majorField}"></option>
									</select> 
                                    <select class="filterSelect minorField" name="minorField" id="minorField" disabled>
										<option value="">소분류</option>
									</select>
								</div>
							</div>
                            
							<div class="filter">
								<label class="filterLabel">지역</label>
								<div>
									<select class="filterSelect majorRegion" name="majorRegion" id="majorRegion">
										<option value="">대분류</option>
										<option th:each="r : ${majorRegions}"
											th:value="${r.MAJOR_REGION_IDX}" th:text="${r.REGION_NM}"
											th:selected="${r.MAJOR_REGION_IDX == majorRegion}">
										</option>
									</select> 
                                    <select class="filterSelect minorRegion" name="minorRegion" id="minorRegion" disabled>
										<option value="">소분류</option>
									</select>
								</div>
							</div>
                            
							<div class="keywordBox">
								<input class="keywordInput" type="text" name="q" placeholder="코치명 또는 태그 검색" th:value="${q}" />
							</div>
							<button class="keywordBtn" type="submit">검색</button>
						</div>
					</aside>

					<section class="contentArea">
						<div class="contentTop">
							<div class="sortBox">
								<select class="sortSelect" name="sort" id="sortSelect">
									<option value="latest" th:selected="${sort == 'latest'}">최신순</option>
									<option value="rating" th:selected="${sort == 'rating'}">평점순</option>
									<option value="most" th:selected="${sort == 'most'}">리뷰 많은순</option>
								</select>
							</div>
						</div>

						<div class="cardGrid">
							<div class="empty-msg" th:if="${#lists.isEmpty(coachList)}">일치하는 코치가 없습니다.</div>

							<a class="classCard" th:each="coach : ${coachList}" th:href="@{/coach/detail(id=${coach.coach_idx})}">
								<div class="coach-thumb">
									<img th:src="${coach.profile_img != null} ? @{/uploads/profiles/{img}(img=${coach.profile_img})} : @{/images/default_user.png}" alt="coach">
								</div>

								<div class="meta">
									<div class="top">
										<div class="rating" th:text="|★ ${#numbers.formatDecimal(coach.avg_rating, 1, 1)} (${coach.review_cnt})|">★ 0.0 (0)</div>
										<div class="provider" th:text="${coach.user_name}">코치이름</div>
									</div>

									<div class="bottom">
										<div class="title" th:text="${coach.intro_title}">코치 소개 한줄평</div>
									</div>

                                    <div class="coach-tags">
                                        <span class="coach-tag" th:each="tag : ${coach.tags}" th:text="|#${tag}|">#태그</span>
                                    </div>
								</div>
							</a>
						</div>
					</section>
				</form>
			</div>
			
		</div>
	</main>

	<div th:replace="~{layout/footer :: siteFooter}"></div>
	<script>
        // 정렬 자동 제출
        document.getElementById('sortSelect')?.addEventListener('change', () => {
            document.getElementById('filterForm')?.submit();
        });

        // 소분류 로딩 (기존 스크립트 그대로 유지)
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('filterForm');
            if (!form) return;

            const majorField = form.querySelector('#majorField');
            const minorField = form.querySelector('#minorField');
            const majorRegion = form.querySelector('#majorRegion');
            const minorRegion = form.querySelector('#minorRegion');

            async function loadMinor(majorSelect, minorSelect, apiUrl, idKey, nameKey, placeholder, paramName) {
                minorSelect.innerHTML = `<option value="">${placeholder}</option>`;
                minorSelect.disabled = true;
                const majorIdx = majorSelect.value;
                if (!majorIdx) return;

                const res = await fetch(`${apiUrl}?${paramName}=${encodeURIComponent(majorIdx)}`);
                const data = await res.json();
                data.forEach(item => {
                    const opt = document.createElement('option');
                    opt.value = item[idKey];
                    opt.textContent = item[nameKey];
                    minorSelect.appendChild(opt);
                });
                minorSelect.disabled = false;
            }

            majorField?.addEventListener('change', () => loadMinor(majorField, minorField, '/minorFields', 'MINOR_FIELD_IDX', 'MINOR_FIELD_NM', '소분류', 'majorFieldIdx'));
            majorRegion?.addEventListener('change', () => loadMinor(majorRegion, minorRegion, '/minorRegions', 'MINOR_REGION_IDX', 'DISTRICT_NM', '소분류', 'majorRegionIdx'));
        });
    </script>
	
</body>
</html>
