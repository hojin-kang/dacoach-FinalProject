<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

	<meta charset="UTF-8" />
	<title>dacoach</title>

	<link rel="stylesheet" th:href="@{/css/main.css}" />
	<link rel="stylesheet" th:href="@{/css/token.css}" />
</head>
<body>
  <div th:replace="~{layout/header :: siteHeader}"></div>

  <main class="main">
    <div class="container">

      <h2>나의 닭꼬치</h2>

      <!-- 상단 요약 카드 -->
      <section class="tokenSummary">
        <div class="tokenSummary__left">
          <img class="tokenIcon" src="img/icon/dakcoach.png">

          <div class="tokenInfo">
            <div class="tokenLabel">보유 수량</div>
            <div class="tokenCount">
              <span class="num" th:text="${token_balance}">10</span>개
            </div>
          </div>
        </div>

        <div class="tokenSummary__right">
          <a class="tokenBtn tokenBtn--fill" th:href="@{/tokenChargeForm}">충전하기</a>
          <a class="tokenBtn tokenBtn--line" th:href="@{/myPayment}">충전내역</a>
        </div>
      </section>

      <hr>

      <!-- 사용 내역 -->
      <section class="tokenHistory">
        <h2 class="pageTitle">사용 내역</h2>

        <table class="historyTable">
          <thead>
            <tr>
              <th>사용 일시</th>
              <th>내용</th>
              <th>변동 개수</th>
              <th>남은 개수</th>
            </tr>
          </thead>

          <tbody>
            <!-- 예시: th:each로 반복 -->
            <tr th:each="h : ${thdto}">
              <td th:text="${#dates.format(h.created_at,'yyyy-MM-dd HH:mm:ss')}">시간</td>
              <td th:text="${h.hist_type}">타입</td>
              <td th:text="${h.amount}">사용 개수</td>
              <td th:text="${h.balance_after}">남은 개수</td>
            </tr>

            <!-- 데이터 없을 때 -->
            <tr th:if="${thdto == null or #lists.isEmpty(thdto)}">
              <td class="emptyRow" colspan="4">사용 내역이 없습니다.</td>
            </tr>
          </tbody>
        </table>
      </section>

    </div>
  </main>

  <div th:replace="~{layout/footer :: siteFooter}"></div>
</body>
</html>
