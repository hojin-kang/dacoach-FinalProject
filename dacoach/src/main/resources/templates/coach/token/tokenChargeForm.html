<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

	<meta charset="UTF-8" />
	<title>dacoach</title>

	<link rel="stylesheet" th:href="@{/css/main.css}" />
	<link rel="stylesheet" th:href="@{/css/token.css}" />
	<script th:src="@{/js/KakaoPayModule.js}"></script>
</head>
<body>
  <div th:replace="~{layout/header :: siteHeader}"></div>

  <main class="main">
    <div class="container">

      <h2>닭꼬치 충전</h2>
      <hr>

      <!-- 사용 내역 -->
      <section class="tokenPkg">
      	<div>
      		<span class="dakTitle">닭꼬치 1개</span>
      		<img alt="닭꼬치1" src="/img/icon/dakcoach.png">
      		<span class="price">1,000원</span>
      	</div>
      	<div>
      		<span class="dakTitle">닭꼬치 3개</span>
      		<img alt="닭꼬치3" src="/img/icon/dak3.png">
      		<span class="price">2,800원</span>
      	</div>
      	<div>
      		<span class="dakTitle">닭꼬치 10개</span>
      		<img alt="닭꼬치10" src="/img/icon/dak10.png">
      		<span class="price">9,000원</span>
      	</div>
      </section>
      <button id="kakaoPayBtn">카카오페이</button>

    </div>
  </main>

  <div th:replace="~{layout/footer :: siteFooter}"></div>
  
  <script>
  let selected = { item_name: "", quantity: 0, total_amount: 0, vat_amount: 0, tax_free: 0 };

  // 패키지 클릭 시 선택값 저장
  document.querySelectorAll(".tokenPkg > div").forEach((el, idx) => {
    el.addEventListener("click", () => {
      // 간단: idx로 분기
      if (idx === 0) selected = { item_name: "닭꼬치 1개", quantity: 1, total_amount: 1000, vat_amount: 0, tax_free: 0 };
      if (idx === 1) selected = { item_name: "닭꼬치 3개", quantity: 3, total_amount: 2800, vat_amount: 0, tax_free: 0 };
      if (idx === 2) selected = { item_name: "닭꼬치 10개", quantity: 10, total_amount: 9000, vat_amount: 0, tax_free: 0 };

      // 선택 표시(원하면 CSS로 강조)
      document.querySelectorAll(".tokenPkg > div").forEach(x => x.style.outline = "none");
      el.style.outline = "3px solid #328889";
    });
  });

  document.getElementById("kakaoPayBtn").addEventListener("click", () => {
    if (!selected.quantity) {
      alert("충전하실 상품을 선택해주세요.");
      return;
    }
    // url은 서버의 ready 엔드포인트 prefix
    // 예: /kakaopay/token
    kakaopayModule(
      "order_" + Date.now(),     // order_id
      "sessionUser",             // user_id (서버에서 세션으로 덮어쓰는 걸 추천)
      selected.item_name,
      selected.quantity,
      selected.total_amount,
      selected.vat_amount,
      selected.tax_free,
      "/kakaopay/token"          // 여기 중요: 아래 2)에서 만들 컨트롤러 mapping과 맞춰
    );
  });
</script>
  
</body>
</html>
