<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
<title>dacoach - chat</title>

<link rel="stylesheet" th:href="@{/css/main.css}" />
<link rel="stylesheet" th:href="@{/css/chat.css}" />
</head>
<body>
<div th:replace="~{layout/header :: siteHeader}"></div>

<main class="main">
  <div class="container">

    <h2>채팅</h2>
    <hr>

    <div class="chatLayout">

      <!-- ===== LEFT: 방 리스트 ===== -->
      <aside class="chatSide">

        <div class="chatTabs">
		  <button type="button" class="chatTab1 active" data-type="COACH">코치</button>
		  <button type="button" class="chatTab2" data-type="COMPANY">컴퍼니</button>
		</div>

        <div class="chatSearch">
          <input type="text" placeholder="검색" class="chatSearchInput">
        </div>

        <div class="roomList">
          <a class="roomItem"
             th:each="r : ${rooms}"
   				th:attr="data-other-type=${r.otherType}"
             th:href="@{/chat/room/{id}(id=${r.chatRoomIdx}, tab=${r.otherType})}"
             th:classappend="${activeRoomIdx != null and activeRoomIdx == r.chatRoomIdx} ? ' active' : ''">
            <div class="roomAvatar">
              <img th:src="${r.otherPhoto == 'default_profile.png'} 
              ? @{/images/default_profile.png} 
              : @{/uploads/profile/{img}(img=${r.otherPhoto})}"
     alt="profile">
            </div>

            <div class="roomInfo">
              <div class="roomTopLine">
                <div class="roomName" th:text="${r.otherName}">상대이름</div>
                
              </div>
              <div class="roomBottomLine">
                <div class="roomPreview" th:text="${r.lastMessage != null ? r.lastMessage : ''}">미리보기</div>
                <span class="roomBadge" th:if="${r.unreadCount > 0}" th:text="${r.unreadCount}">1</span>
              </div>
            </div>
          </a>

          <div class="roomEmpty" th:if="${rooms == null or #lists.isEmpty(rooms)}">
            아직 채팅방이 없습니다.
          </div>
        </div>
      </aside>

      <!-- ===== RIGHT: 채팅 영역 ===== -->
      <section class="chatMain">

        <div class="chatEmpty"
             th:if="${activeRoom == null}">
          채팅방을 선택해주세요.
        </div>

        <div class="chatWindow" th:if="${activeRoom != null}"
             th:attr="data-room-idx=${activeRoom.chatRoomIdx},
              data-my-idx=${myIdx},
              data-other-name=${activeRoom.otherName},
              data-other-photo=${activeRoom.otherPhoto}">

          <div class="chatMessages" id="chatMessages">
            <!-- JS로 txt를 파싱해서 렌더 -->
          </div>
          <div th:if="${isLeft == true}">상대방이 나갔습니다.</div>
          <div class="chatInputRow">
          	<img src="/img/icon/menu.png" id="menuBtn">
          	<div class="quickMenu" id="quickMenu" aria-hidden="true">
			    <a href="/schedule/write" class="quickItem" th:if="${isLeft == false && status == 'MATCHED'}">
			      <img class="qiIcon" src="/img/icon/write.png">
			      <span class="qiText">서약서<br>작성</span>
			    </a>
					<th:block th:if="${isLeft == false && status != 'MATCHED'}" th:switch="${status}">
						<button type="button" th:case="'RECEIVED'" class="btn-match stop-card" th:onclick="applyAction('A_MATCH', [[${target_idx}]])">
							매칭수락 <img src="/img/icon/dakcoach.png" class="btn-icon">×3
						</button>
						<button type="button" th:case="'APPLIED'" class="btn-match stop-card" disabled style="background:#666; color:#fff;">
							매칭신청됨 <img src="/img/icon/dakcoach.png" class="btn-icon">×3
						</button>
						<button type="button" th:case="*" class="btn-match stop-card" th:onclick="applyAction('MATCH', [[${target_idx}]])">
							매칭신청 <img src="/img/icon/dakcoach.png" class="btn-icon">×3
						 </button>
					</th:block>			    
			    <a href="/schedule/create" class="quickItem" th:if="${isLeft == false}">
			      <img class="qiIcon" src="/img/icon/calendarPlus.png">
			      <span class="qiText">일정<br>등록</span>
			    </a>
			    <a href="/schedule/list" class="quickItem">
			      <img class="qiIcon" src="/img/icon/calendar.png">
			      <span class="qiText">모든<br>일정</span>
			    </a>
			    <button type="button" class="quickItem danger" id="leaveRoomBtn">
			      <img class="qiIcon" src="/img/icon/exit.png">
			      <span class="qiText" th:unless="${status=='MATCHED'}">채팅방<br>나가기</span>
			      <span class="qiText" th:if="${status=='MATCHED'}">매칭<br>종료</span>
			    </button>
			</div>
            <input type="text" id="chatInput" class="chatInput" placeholder="메세지 입력">
            <button type="button" id="sendBtn" class="chatSendBtn" th:if="${isLeft != true}">전송</button>
          </div>
        </div>

      </section>
    </div>

  </div>
</main>

<div th:replace="~{layout/footer :: siteFooter}"></div>

<!-- SockJS / STOMP는 먼저 로드돼야 함 (중요: 너가 지금은 위에 script가 먼저라 순서가 반대였음) -->
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

<script>
/* =========================
   1) 탭 필터 (COACH/COMPANY)
   ========================= */
(function(){
	  const tabs = document.querySelectorAll('.chatTab1, .chatTab2');
	  const items = Array.from(document.querySelectorAll('.roomItem'));

	  function setActive(type){
	    tabs.forEach(b => b.classList.remove('active'));
	    const btn = Array.from(tabs).find(b => b.dataset.type === type);
	    (btn || tabs[0])?.classList.add('active');
	  }

	  function apply(type){
	    items.forEach(el => {
	      const t = (el.dataset.otherType || '').trim(); // COACH / COMPANY
	      el.style.display = (t === type) ? '' : 'none';
	    });
	  }

	  // URL ?tab=COMPANY 우선
	  const params = new URLSearchParams(location.search);
	  const initial = (params.get('tab') || '').toUpperCase();

	  const initType = (initial === 'COMPANY' || initial === 'COACH') ? initial : 'COACH';
	  setActive(initType);
	  apply(initType);

	  tabs.forEach(btn => {
	    btn.addEventListener('click', () => {
	      const type = btn.dataset.type;
	      setActive(type);
	      apply(type);

	      // 탭 바꿀 때도 URL 유지(새로고침해도 유지됨)
	      const url = new URL(location.href);
	      url.searchParams.set('tab', type);
	      history.replaceState(null, '', url);
	    });
	  });
})();


/* =========================
   2) WebSocket(STOMP) 채팅
   - 최초 1회만 히스토리 로드
   - 이후 실시간으로 append
   ========================= */
   /* =========================
   2) WebSocket(STOMP) 채팅
   - 최초 1회만 히스토리 로드
   - 이후 실시간으로 append
   - avatar DOM을 미리 만들고 cloneNode로 재사용
   ========================= */
(function(){
  const win = document.querySelector('.chatWindow');
  if(!win) return;

  const roomIdx = win.dataset.roomIdx;
  const myIdx = parseInt(win.dataset.myIdx, 10);

  const msgBox = document.getElementById('chatMessages');
  const input = document.getElementById('chatInput');
  const sendBtn = document.getElementById('sendBtn');

  function escapeHtml(s){
    return (s || '')
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;');
  }

  const otherName = win.dataset.otherName || '상대';
  const otherPhoto = win.dataset.otherPhoto || 'default_profile.png';

  function resolvePhoto(p){
    if(!p || p === 'default_profile.png') return '/images/default_profile.png';
    return `/uploads/profile/${encodeURIComponent(p)}`;
  }

  /* 1) 상대 아바타 DOM을 "한 번만" 만들어둔다 */
  const baseYouAvatar = document.createElement('div');
  baseYouAvatar.className = 'youAvatar';

  const baseYouImg = document.createElement('img');
  baseYouImg.alt = 'profile';
  baseYouImg.src = resolvePhoto(otherPhoto);
  baseYouImg.onerror = function(){
    this.onerror = null;
    this.src = '/images/default_profile.png';
  };

  baseYouAvatar.appendChild(baseYouImg);

  function createYouAvatarNode(){
    // cloneNode(true)로 DOM 복제
    // img src는 그대로, onerror는 clone에 안 복사될 수 있어서 다시 걸어줌
    const node = baseYouAvatar.cloneNode(true);
    const img = node.querySelector('img');
    if(img){
      img.onerror = function(){
        this.onerror = null;
        this.src = '/images/default_profile.png';
      };
    }
    return node;
  }

  /* 2) 메시지 Row를 DOM으로 만든다 (문자열 insertAdjacentHTML X) */
  function makeMineRow(hhmm, msg){
    const row = document.createElement('div');
    row.className = 'msgRow me';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    const text = document.createElement('div');
    text.className = 'text';
    text.innerHTML = escapeHtml(msg);

    bubble.appendChild(text);

    const time = document.createElement('div');
    time.className = 'time';
    time.textContent = hhmm;

    row.appendChild(bubble);
    row.appendChild(time);
    return row;
  }

  function makeYouRow(hhmm, msg){
    const row = document.createElement('div');
    row.className = 'msgRow you';

    const avatar = createYouAvatarNode();

    const body = document.createElement('div');
    body.className = 'youBody';

    const name = document.createElement('div');
    name.className = 'youName';
    name.textContent = otherName;

    const line = document.createElement('div');
    line.className = 'youLine';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    const text = document.createElement('div');
    text.className = 'text';
    text.innerHTML = escapeHtml(msg);

    bubble.appendChild(text);

    const time = document.createElement('div');
    time.className = 'time';
    time.textContent = hhmm;

    line.appendChild(bubble);
    line.appendChild(time);

    body.appendChild(name);
    body.appendChild(line);

    row.appendChild(avatar);
    row.appendChild(body);
    return row;
  }

  // 기존 TXT 히스토리 렌더 (yyyy-MM-dd HH:mm:ss|senderIdx|message)
  function renderHistory(raw){
    msgBox.innerHTML = '';

    const lines = raw.split(/\r?\n/).filter(Boolean);
    for(const line of lines){
      const parts = line.split('|');
      if(parts.length < 3) continue;

      const ts = parts[0];
      const sender = parseInt(parts[1],10);
      const msg = parts.slice(2).join('|');

      const hhmm = ts.length >= 16 ? ts.substring(11,16) : '';

      const node = (sender === myIdx)
        ? makeMineRow(hhmm, msg)
        : makeYouRow(hhmm, msg);

      msgBox.appendChild(node);
    }
    msgBox.scrollTop = msgBox.scrollHeight;
  }

  // WS로 받은 단일 메시지 append
  function appendMsg(ts, sender, msg){
    const hhmm = (ts && ts.length >= 16) ? ts.substring(11,16) : '';

    const node = (sender === myIdx)
      ? makeMineRow(hhmm, msg)
      : makeYouRow(hhmm, msg);

    msgBox.appendChild(node);
    msgBox.scrollTop = msgBox.scrollHeight;
  }

  // 최초 1회만 히스토리 로딩
  async function loadHistory(){
    const res = await fetch(`/chat/messages/${roomIdx}`, { cache: 'no-store' });
    const raw = await res.text();
    renderHistory(raw);
  }

  // STOMP 연결/구독
  let stompClient = null;

  function connectWs(){
    const socket = new SockJS('/ws');
    stompClient = Stomp.over(socket);
    stompClient.debug = null;

    stompClient.connect({}, function(){
      stompClient.subscribe(`/topic/room.${roomIdx}`, function(frame){
        try{
          const data = JSON.parse(frame.body);
          appendMsg(data.ts, data.senderIdx, data.message);
        }catch(e){
          // 무시
        }
      });
    });
  }

  function sendWs(){
    const message = input.value.trim();
    if(!message || !stompClient) return;

    stompClient.send('/app/chat.send', {}, JSON.stringify({
      roomIdx: parseInt(roomIdx, 10),
      message: message
    }));

    input.value = '';
  }

  sendBtn.addEventListener('click', sendWs);
  input.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter'){
      e.preventDefault();
      sendWs();
    }
  });

  loadHistory();
  connectWs();
})();
</script>
<script>
/* =========================
   3) 메뉴(quickMenu) 토글
   ========================= */
(() => {
  const btn = document.getElementById('menuBtn');
  const menu = document.getElementById('quickMenu');
  if(!btn || !menu) return;

  function open(){
    menu.classList.add('open');
    menu.setAttribute('aria-hidden', 'false');
  }

  function close(){
    menu.classList.remove('open');
    menu.setAttribute('aria-hidden', 'true');
  }

  function toggle(){
    menu.classList.contains('open') ? close() : open();
  }

  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    toggle();
  });

  // 메뉴 클릭은 닫히지 않게
  menu.addEventListener('click', (e) => e.stopPropagation());

  // 바깥 클릭 시 닫기
  document.addEventListener('click', close);

  // ESC 닫기
  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape') close();
  });
})();
   
   // 채팅방 나가기
   document.getElementById('leaveRoomBtn')?.addEventListener('click', async () => {
	  if(!confirm('채팅(매칭)을 종료 하시겠습니까?')) return;
	 
	  const win = document.querySelector('.chatWindow');
	  if(!win) return;
	
	  const roomIdx = win.dataset.roomIdx;
	
	  const res = await fetch(`/chat/room/${roomIdx}/leave`, {
	    method: 'POST',
	    headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
	  });
	
	  const text = await res.text();
	  if(text === 'OK'){
	    location.href = '/chat'; // 나가고 채팅 메인
	  }else if(text === 'FAIL'){
	    alert('나가기 실패');
	  }else{
		  // 상대의 인덱스가 넘어온 경우 리뷰 작성 페이지로 이동
		  location.href = `/coach/coachReview?target_idx=${text}`;
	  }
	});
   
   function applyAction(type, targetIdx) {
       let msg = "";
       if(type === 'CHAT') msg = "채팅 신청을 하시겠습니까? 토큰 1개가 차감됩니다.";
       else if(type === 'MATCH') msg = "매칭 신청을 하시겠습니까? 토큰 3개가 차감됩니다.";
       else if(type === 'A_CHAT') msg = "채팅 신청을 수락하시겠습니까?";
       else if(type === 'A_MATCH') msg = "매칭 신청을 수락하시겠습니까?";
       
       if (!confirm(msg)) return;

       const params = new URLSearchParams();
       params.append('type', type);
       params.append('target_idx', targetIdx);

       fetch('/match/apply', {
           method: 'POST',
           headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
           body: params
       })
       .then(response => response.json())
       .then(res => {
           if (res.status === 'success'|| res.status.includes('accepted')) { alert("완료되었습니다."); location.reload(); }
           else if (res.status === 'login_required') { alert("로그인이 필요합니다."); location.href = '/login'; }
           else if (res.status === 'no_token') { alert("토큰이 부족합니다."); location.href = '/tokenHistory'; }
           else { alert("오류가 발생했습니다."); }
       })
       .catch(error => { console.error('Error:', error); alert("통신 중 오류 발생"); });
   }
</script>

</body>
</html>
