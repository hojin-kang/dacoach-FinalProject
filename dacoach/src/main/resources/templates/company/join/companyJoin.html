<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

   <meta charset="UTF-8" />
   <title>dacoach</title>
<link rel="stylesheet" th:href="@{/css/main.css}" />
    <style>
        /* [1] 기본 레이아웃 및 초기화 */
        body { 
            background-color: #ffffff; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
            font-family: 'Pretendard', -apple-system, sans-serif;
        }

        nav a, .header-container a, [th\:replace] a { 
            text-decoration: none !important; 
            color: inherit !important; 
        }

        main {
            flex: 1; 
            display: flex;
            justify-content: center;
            padding: 80px 0;
        }

        .signup-container { 
            width: 450px; 
            text-align: center; 
        }

        .signup-title { 
            font-weight: bold; 
            margin-bottom: 60px; 
            border-bottom: 1px solid #eee; 
            padding-bottom: 25px; 
            font-size: 24px;
            color: #333;
        }

        /* [2] 폼 레이아웃 */
        .form-section { text-align: left; }

        .form-group {
            margin-bottom: 20px;
        }
        
        /* 특정 간격 조정용 */
        .mt-40 { margin-top: 40px; }

        /* 입력창 스타일 */
        .input-row {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .form-control { 
            flex: 1;
            width: 100%; /* 기존 인라인 100% 통합 */
            background-color: #f8f9fa !important; 
            border: none !important; 
            border-radius: 12px !important; 
            padding: 16px; 
            font-size: 16px;
            outline: none;
            transition: background 0.2s;
        }
        
        .form-control:focus {
            background-color: #f1f3f5 !important;
        }

        /* 입력창 비활성화 상태 스타일 */
        .form-control:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* 보조 버튼 */
        .btn-sub {
            background-color: #3d8b89;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 10px 18px;
            font-size: 13px;
            cursor: pointer;
            white-space: nowrap;
            font-weight: bold;
        }
        
        /* 인증 버튼 강조 색상 */
        .btn-auth-confirm {
            background-color: #52a3a1;
        }

        .btn-sub:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* [3] 메인 저장 버튼 */
        .btn-submit { 
            background-color: #3d8b89; 
            color: white; 
            border: none; 
            border-radius: 15px; 
            padding: 20px 0; 
            font-weight: bold; 
            font-size: 18px;
            width: 100%;
            margin-top: 50px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-submit:hover { background-color: #2d6b69; }
        
        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* [4] 메시지 스타일 */
        .error-msg {
            color: red;
            font-size: 12px;
            display: none;
            margin-top: 5px;
        }

        .success-msg {
            color: #3d8b89;
            font-size: 12px;
            display: none;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div th:replace="~{layout/header :: siteHeader}"></div>

    <main>
        <div class="signup-container">
            <h4 class="signup-title">코치 회원가입</h4>

            <form class="form-section" action="company/join/loginInfoOK" method="post">
                <div class="form-group">
                    <div class="input-row">
                        <input type="text" id="username" name="login_id" class="form-control" placeholder="아이디">
                        <button type="button" id="checkDuplicate" class="btn-sub" disabled>중복확인</button>
                    </div>
                    <span id="usernameError" class="error-msg">아이디는 영문과 숫자를 모두 사용해 8~20자로 입력해주세요.</span>
                    <span id="usernameSuccess" class="success-msg">사용 가능한 아이디입니다.</span>
                </div>

                <div class="form-group">
                    <input type="password" id="password" name="password" class="form-control" placeholder="비밀번호" disabled>
                    <span id="passwordError" class="error-msg">비밀번호는 영문 대문자, 소문자, 숫자, 특수문자를 모두 사용해 8~20자로 입력해주세요.</span>
                </div>

                <div class="form-group mt-40">
                    <input type="text" id="name" name="user_name" class="form-control" placeholder="기업명">
                </div>

				<input type="hidden" name="user_type" value="COMPANY">
				<input type="hidden" name="status" value="INACTIVE">
                <button type="submit" id="submitBtn" class="btn-submit" disabled>저장 후 계속하기</button>
            </form>
        </div>
    </main>

    <div th:replace="~{layout/footer :: siteFooter}"></div>
</body>
<script>
	const usernameInput = document.getElementById('username');
	const passwordInput = document.getElementById('password');
	
	const checkDuplicateButton = document.getElementById('checkDuplicate');
	const submitBtn = document.getElementById('submitBtn');
	
	const usernameError = document.getElementById('usernameError');
    const usernameSuccess = document.getElementById('usernameSuccess');
    const passwordError = document.getElementById('passwordError');
    
    let isIdVerified = false; // 중복 확인 통과 여부

    // [2] 전체 유효성 검사 함수 (버튼 활성화 여부 결정)
    function checkAllValid() {
        // 유효성 체크 조건들
        const isUserOk = isIdVerified && usernameInput.value !== "";
        const isPassOk = passwordError.style.display === 'none' && passwordInput.value !== "";

        // 모든 조건 만족 시 가입 버튼 활성화
        submitBtn.disabled = !(isUserOk && isPassOk);
    }

	//[3] 아이디 실시간 유효성 및 상태 제어
	usernameInput.addEventListener('input', function() {
	    const username = this.value;
	    const isValid = /^(?=.*[a-zA-Z])(?=.*\d)[a-zA-Z0-9]{8,20}$/.test(username);
	
	    // 아이디 변경 시 무조건 중복확인 다시 해야함
	    isIdVerified = false;
	    usernameSuccess.style.display = 'none';
	    passwordInput.disabled = true;
	    passwordInput.value = "";
	
	    if (!isValid) {
	        usernameError.style.display = (username === "") ? 'none' : 'block';
	        checkDuplicateButton.disabled = true;
	    } else {
	        usernameError.style.display = 'none';
	        checkDuplicateButton.disabled = false;
	    }
	    checkAllValid();
	});
	
	// [5] 비밀번호 유효성 검사
    passwordInput.addEventListener('input', function() {
        const password = this.value;
        const isValid = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[!@#$%^&*])[A-Za-z\d!@#$%^&*]{8,20}$/.test(password);

        if (password === "") {
            passwordError.style.display = 'none';
        } else {
            passwordError.style.display = isValid ? 'none' : 'block';
        }
        checkAllValid();
    });
	
 	// [4] 중복확인 AJAX 요청
    checkDuplicateButton.addEventListener('click', function() {
        const username = usernameInput.value;

        fetch(`/api/member/idCheck?username=${username}`)
            .then(response => response.json())
            .then(isAvailable => {
                if (isAvailable) {
                    usernameSuccess.style.display = 'block';
                    usernameError.style.display = 'none';
                    isIdVerified = true;
                    passwordInput.disabled = false;
                    alert("사용 가능한 아이디입니다.");
                } else {
                    usernameError.textContent = "이미 사용 중인 아이디입니다.";
                    usernameError.style.display = 'block';
                    usernameSuccess.style.display = 'none';
                    isIdVerified = false;
                }
                checkAllValid();
            })
            .catch(error => {
                console.error('Error:', error);
                alert("중복 확인 중 오류가 발생했습니다.");
            });
    });
</script>
</html>
