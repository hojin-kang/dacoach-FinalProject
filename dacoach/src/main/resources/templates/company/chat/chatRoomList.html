<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
<title>dacoach - chat</title>

<link rel="stylesheet" th:href="@{/css/main.css}" />
<link rel="stylesheet" th:href="@{/css/chat.css}" />
</head>
<body>
<div th:replace="~{layout/header :: siteHeader}"></div>

<main class="main">
  <div class="container">

    <h2>채팅</h2>
    <hr>

    <div class="chatLayout">

      <!-- ===== LEFT: 방 리스트 ===== -->
      <aside class="chatSide">

        <div class="chatTabs">
		  <button type="button" class="chatTab1 active" data-type="COACH">코치</button>
		  <button type="button" class="chatTab2" data-type="CLASS">클래스</button>
		</div>

        <div class="chatSearch">
          <input type="text" placeholder="검색" class="chatSearchInput" id="chatSearch">
        </div>

        <div class="roomList" id="roomList">
          <a class="roomItem"
             th:each="r : ${rooms}"
   				th:attr="data-other-type=${r.otherType}"
             th:href="@{/company/chat/room/{id}(id=${r.chatRoomIdx}, tab=${r.otherType})}"
             th:classappend="${activeRoomIdx != null and activeRoomIdx == r.chatRoomIdx} ? ' active' : ''">
            <div class="roomAvatar">
              <img th:src="${r.otherPhoto == 'default_profile.png'} 
              ? @{/img/profile/defaultProfile.jpg} 
              : @{/uploads/{img}(img=${r.otherPhoto})}"
     alt="profile">
            </div>

            <div class="roomInfo">
              <div class="roomTopLine">
                <div class="roomName" th:text="${r.otherName}">상대이름</div>
                
              </div>
              <div class="roomBottomLine">
                <div class="roomPreview" th:text="${r.lastMessage != null ? r.lastMessage : ''}">미리보기</div>
                <span class="roomBadge" th:if="${r.unreadCount > 0}" th:text="${r.unreadCount}">1</span>
              </div>
            </div>
          </a>
          
			<a class="roomItem"
			   th:each="c : ${class}"
			   th:attr="data-other-type='CLASS'"
			   th:href="@{/company/chat/start(targetIdx=${c.class_idx}, tab='CLASS')}"
			   th:classappend="${activeRoomIdx != null and activeRoomIdx == c.class_idx} ? ' active' : ''">
			    
			    <div class="roomAvatar">
			        <img th:src="${c.photo == null or c.photo == ''} 
			              ? @{/img/profile/defaultProfile.jpg} 
			              : @{/uploads/{img}(img=${c.photo})}"
			             alt="profile">
			    </div>
			
			    <div class="roomInfo">
			        <div class="roomTopLine">
			            <div class="roomName" th:text="${c.title}">클래스 제목</div>
			        </div>
			        <div class="roomBottomLine">
			            <div class="roomPreview" th:text="${c.region_detail != null ? c.region_detail : ''}">지역 정보</div>
			        </div>
			    </div>
			</a>
          <div class="roomEmpty" th:if="${(rooms == null or #lists.isEmpty(rooms)) and (class == null or #lists.isEmpty(class))}">
            아직 채팅방이 없습니다.
          </div>
        </div>
      </aside>

      <!-- ===== RIGHT: 채팅 영역 ===== -->
      <section class="chatMain">

        <div class="chatEmpty"
             th:if="${activeRoom == null}">
          채팅방을 선택해주세요.
        </div>

        <div class="chatWindow" th:if="${activeRoom != null}"
             th:attr="data-room-idx=${activeRoom.chatRoomIdx},
              data-my-idx=${myIdx},
              data-other-name=${activeRoom.otherName},
              data-other-photo=${activeRoom.otherPhoto}">

          <div class="chatMessages" id="chatMessages">
            <!-- JS로 txt를 파싱해서 렌더 -->
          </div>

          <div class="chatInputRow">
          	<img src="/img/icon/menu.png" id="menuBtn">
          	<div class="quickMenu" id="quickMenu" aria-hidden="true">
			    
			    <button type="button" class="quickItem danger" id="leaveRoomBtn">
			      <img class="qiIcon" src="/img/icon/exit.png">
			      <span class="qiText">채팅방<br>나가기</span>
			    </button>
			</div>
            <input type="text" id="chatInput" class="chatInput" placeholder="메세지 입력">
            <button type="button" th:id="${tab=='CLASS'?'classSendBtn':'sendBtn'}" class="chatSendBtn">전송</button>
          </div>
        </div>

      </section>
    </div>

  </div>
</main>

<div th:replace="~{layout/footer :: siteFooter}"></div>

<!-- SockJS / STOMP는 먼저 로드돼야 함 (중요: 너가 지금은 위에 script가 먼저라 순서가 반대였음) -->
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>


<script>
var stompClient = null;
/* =========================
   1) 탭 필터 (COACH/COMPANY)
   ========================= */
(function(){
	  const tabs = document.querySelectorAll('.chatTab1, .chatTab2');
	  const items = Array.from(document.querySelectorAll('.roomItem'));

	  function setActive(type){
	    tabs.forEach(b => b.classList.remove('active'));
	    const btn = Array.from(tabs).find(b => b.dataset.type === type);
	    (btn || tabs[0])?.classList.add('active');
	  }

	  function apply(type){
	    items.forEach(el => {
	      const t = (el.dataset.otherType || '').trim(); // COACH / COMPANY
	      el.style.display = (t === type) ? '' : 'none';
	    });
	  }

	  // URL ?tab=COMPANY 우선
	  const params = new URLSearchParams(location.search);
	  const initial = (params.get('tab') || '').toUpperCase();

	  var initType = (initial === 'CLASS' || initial === 'COACH') ? initial : 'COACH';
	  setActive(initType);
	  apply(initType);

	  tabs.forEach(btn => {
	    btn.addEventListener('click', () => {
	      const type = btn.dataset.type;
	      setActive(type);
	      apply(type);

	      // 탭 바꿀 때도 URL 유지(새로고침해도 유지됨)
	      const url = new URL(location.href);
	      url.searchParams.set('tab', type);
	      history.replaceState(null, '', url);
	    });
	  });
})();


/* =========================
   2) WebSocket(STOMP) 채팅
   - 최초 1회만 히스토리 로드
   - 이후 실시간으로 append
   ========================= */
   /* =========================
   2) WebSocket(STOMP) 채팅
   - 최초 1회만 히스토리 로드
   - 이후 실시간으로 append
   - avatar DOM을 미리 만들고 cloneNode로 재사용
   ========================= */
(function(){
  const win = document.querySelector('.chatWindow');
  if(!win) return;

  const roomIdx = win.dataset.roomIdx;
  const myIdx = parseInt(win.dataset.myIdx, 10);

  const msgBox = document.getElementById('chatMessages');
  const input = document.getElementById('chatInput');
  const sendBtn = document.getElementById('sendBtn');

  function escapeHtml(s){
    return (s || '')
      .replace(/&/g,'&amp;')
      .replace(/</g,'&lt;')
      .replace(/>/g,'&gt;');
  }

  const otherName = win.dataset.otherName || '상대';
  const otherPhoto = win.dataset.otherPhoto || 'default_profile.png';

  function resolvePhoto(p){
    if(!p || p === 'default_profile.png') return '/img/profile/defaultProfile.jpg';
    return `/uploads/profile/${encodeURIComponent(p)}`;
  }

  /* 1) 상대 아바타 DOM을 "한 번만" 만들어둔다 */
  const baseYouAvatar = document.createElement('div');
  baseYouAvatar.className = 'youAvatar';

  const baseYouImg = document.createElement('img');
  baseYouImg.alt = 'profile';
  baseYouImg.src = resolvePhoto(otherPhoto);
  baseYouImg.onerror = function(){
    this.onerror = null;
    this.src = '/img/profile/defaultProfile.jpg';
  };

  baseYouAvatar.appendChild(baseYouImg);

  function createYouAvatarNode(){
    // cloneNode(true)로 DOM 복제
    // img src는 그대로, onerror는 clone에 안 복사될 수 있어서 다시 걸어줌
    const node = baseYouAvatar.cloneNode(true);
    const img = node.querySelector('img');
    if(img){
      img.onerror = function(){
        this.onerror = null;
        this.src = '/img/profile/defaultProfile.jpg';
      };
    }
    return node;
  }

  /* 2) 메시지 Row를 DOM으로 만든다 (문자열 insertAdjacentHTML X) */
  function makeMineRow(hhmm, msg){
    const row = document.createElement('div');
    row.className = 'msgRow me';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    const text = document.createElement('div');
    text.className = 'text';
    text.innerHTML = escapeHtml(msg);

    bubble.appendChild(text);

    const time = document.createElement('div');
    time.className = 'time';
    time.textContent = hhmm;

    row.appendChild(bubble);
    row.appendChild(time);
    return row;
  }

  function makeYouRow(hhmm, msg){
    const row = document.createElement('div');
    row.className = 'msgRow you';

    const avatar = createYouAvatarNode();

    const body = document.createElement('div');
    body.className = 'youBody';

    const name = document.createElement('div');
    name.className = 'youName';
    name.textContent = otherName;

    const line = document.createElement('div');
    line.className = 'youLine';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    const text = document.createElement('div');
    text.className = 'text';
    text.innerHTML = escapeHtml(msg);

    bubble.appendChild(text);

    const time = document.createElement('div');
    time.className = 'time';
    time.textContent = hhmm;

    line.appendChild(bubble);
    line.appendChild(time);

    body.appendChild(name);
    body.appendChild(line);

    row.appendChild(avatar);
    row.appendChild(body);
    return row;
  }

  // 기존 TXT 히스토리 렌더 (yyyy-MM-dd HH:mm:ss|senderIdx|message)
  function renderHistory(raw){
    msgBox.innerHTML = '';

    const lines = raw.split(/\r?\n/).filter(Boolean);
    for(const line of lines){
      const parts = line.split('|');
      if(parts.length < 3) continue;

      const ts = parts[0];
      const sender = parseInt(parts[1],10);
      const msg = parts.slice(2).join('|');

      const hhmm = ts.length >= 16 ? ts.substring(11,16) : '';

      const node = (sender === myIdx)
        ? makeMineRow(hhmm, msg)
        : makeYouRow(hhmm, msg);

      msgBox.appendChild(node);
    }
    msgBox.scrollTop = msgBox.scrollHeight;
  }

  // WS로 받은 단일 메시지 append
  function appendMsg(ts, sender, msg){
    const hhmm = (ts && ts.length >= 16) ? ts.substring(11,16) : '';

    const node = (sender === myIdx)
      ? makeMineRow(hhmm, msg)
      : makeYouRow(hhmm, msg);

    msgBox.appendChild(node);
    msgBox.scrollTop = msgBox.scrollHeight;
    
    updateLeftList(roomIdx, msg);
  }
  
  function updateLeftList(targetRoomIdx, lastMsg) {
	    // data-room-idx 속성이나 href를 이용해 해당 방 요소를 찾습니다.
	    const roomItems = document.querySelectorAll('.roomItem');
	    roomItems.forEach(item => {
	        // href에 해당 방 번호가 포함되어 있는지 확인
	        if (item.getAttribute('href').includes('/room/' + targetRoomIdx)) {
	            // 미리보기 텍스트 업데이트
	            const preview = item.querySelector('.roomPreview');
	            if (preview) preview.textContent = lastMsg;

	            // 안 읽은 배지(Badge) 처리 (현재 내가 보고 있는 방이 아닐 때만 숫자를 올림)
	            const currentWin = document.querySelector('.chatWindow');
	            const currentRoomIdx = currentWin ? currentWin.dataset.roomIdx : null;

	            if (targetRoomIdx != currentRoomIdx) {
	                let badge = item.querySelector('.roomBadge');
	                if (!badge) {
	                    // 배지가 없으면 새로 생성
	                    const bottomLine = item.querySelector('.roomBottomLine');
	                    badge = document.createElement('span');
	                    badge.className = 'roomBadge';
	                    badge.textContent = '0';
	                    bottomLine.appendChild(badge);
	                }
	                badge.textContent = parseInt(badge.textContent) + 1;
	                badge.style.display = 'block';
	            }

	            // 가장 최근 메시지가 왔으므로 목록 맨 위로 올리기 (선택 사항)
	            const parent = item.parentNode;
	            parent.prepend(item);
	        }
	    });
	}
  
  // 최초 1회만 히스토리 로딩
  async function loadHistory(){
    const res = await fetch(`/company/chat/messages/${roomIdx}`, { cache: 'no-store' });
    const raw = await res.text();
    renderHistory(raw);
  }


  function connectWs(){
    const socket = new SockJS('/ws');
    stompClient = Stomp.over(socket);
    stompClient.debug = null;

    stompClient.connect({}, function(){
      stompClient.subscribe(`/topic/room.${roomIdx}`, function(frame){
        try{
          const data = JSON.parse(frame.body);
          appendMsg(data.ts, data.senderIdx, data.message);
          if (data.senderIdx !== myIdx) {
              
              fetch(`/company/chat/room/${roomIdx}/read`, { method: 'POST' });
              
              
              const badge = document.querySelector(`.roomItem[href*="/room/${roomIdx}"] .roomBadge`);
              if (badge) {
                  badge.textContent = '0';
                  badge.style.display = 'none';
              }
          }
        }catch(e){
          // 무시
        }
      });
    });
  }

  function sendWs(){
    const message = input.value.trim();
    if(!message || !stompClient) return;

    stompClient.send('/app/chat.send', {}, JSON.stringify({
      roomIdx: parseInt(roomIdx, 10),
      message: message
    }));

    input.value = '';
  }


  if (sendBtn) { 
      sendBtn.addEventListener('click', sendWs);
  }
  if (input) {
	    input.addEventListener('keydown', (e) => {
	      if(e.key === 'Enter'){
	        e.preventDefault();
	        // CLASS 탭이면 classSendWs를, 아니면 sendWs를 호출하거나 
	        // 그냥 현재 클릭 가능한 버튼을 클릭하게 만듭니다.
	        const activeBtn = document.getElementById('classSendBtn') || document.getElementById('sendBtn');
	        if(activeBtn) activeBtn.click();
	      }
	    });
	  }
  loadHistory();
  connectWs();
})();
</script>
<script>
/* =========================
   3) 메뉴(quickMenu) 토글
   ========================= */
(() => {
  const btn = document.getElementById('menuBtn');
  const menu = document.getElementById('quickMenu');
  if(!btn || !menu) return;

  function open(){
    menu.classList.add('open');
    menu.setAttribute('aria-hidden', 'false');
  }

  function close(){
    menu.classList.remove('open');
    menu.setAttribute('aria-hidden', 'true');
  }

  function toggle(){
    menu.classList.contains('open') ? close() : open();
  }

  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    toggle();
  });

  // 메뉴 클릭은 닫히지 않게
  menu.addEventListener('click', (e) => e.stopPropagation());

  // 바깥 클릭 시 닫기
  document.addEventListener('click', close);

  // ESC 닫기
  document.addEventListener('keydown', (e) => {
    if(e.key === 'Escape') close();
  });
})();
   
   // 채팅방 나가기
   document.getElementById('leaveRoomBtn')?.addEventListener('click', async () => {
	  if(!confirm('채팅방을 나가시겠습니까?')) return;
	
	  const win = document.querySelector('.chatWindow');
	  if(!win) return;
	
	  const roomIdx = win.dataset.roomIdx;
	
	  const res = await fetch(`/company/chat/room/${roomIdx}/leave`, {
	    method: 'POST',
	    headers: { 'Content-Type': 'application/x-www-form-urlencoded' }
	  });
	
	  const text = await res.text();
	  if(text === 'OK'){
	    location.href = '/company/chat'; // 나가고 채팅 메인
	  }else{
	    alert('나가기 실패');
	  }
	});
</script>
<script th:inline="javascript">

var chatInputForClass = document.getElementById('chatInput'); 

function classSendWs(userRoom){
    const message = chatInputForClass.value.trim(); 
    if(!message || !stompClient) return;
    stompClient.send('/app/class.send', {}, JSON.stringify({
      roomIdx: parseInt(userRoom, 10),
      message: message
    }));
}

var classSendBtn = document.getElementById('classSendBtn');

if (classSendBtn) { 
    classSendBtn.addEventListener('click', function() {
        var userRoom = [[${userClassRoom}]] || [];
        
        for (let i = 0; i < userRoom.length; i++) {
            classSendWs(userRoom[i]);
        }
        	
        if (chatInputForClass) chatInputForClass.value = ''; 
    });
}


function tapSet(){
	  const tabs = document.querySelectorAll('.chatTab1, .chatTab2');
	  const items = Array.from(document.querySelectorAll('.roomItem'));

	  function setActive(type){
	    tabs.forEach(b => b.classList.remove('active'));
	    const btn = Array.from(tabs).find(b => b.dataset.type === type);
	    (btn || tabs[0])?.classList.add('active');
	  }

	  function apply(type){
	    items.forEach(el => {
	      const t = (el.dataset.otherType || '').trim(); // COACH / class
	      el.style.display = (t === type) ? '' : 'none';
	    });
	  }

	  // URL ?tab=COMPANY 우선
	  const params = new URLSearchParams(location.search);
	  const initial = (params.get('tab') || '').toUpperCase();

	  var initType = (initial === 'CLASS' || initial === 'COACH') ? initial : 'COACH';
	  setActive(initType);
	  apply(initType);

	  tabs.forEach(btn => {
	    btn.addEventListener('click', () => {
	      const type = btn.dataset.type;
	      setActive(type);
	      apply(type);

	      // 탭 바꿀 때도 URL 유지(새로고침해도 유지됨)
	      const url = new URL(location.href);
	      url.searchParams.set('tab', type);
	      history.replaceState(null, '', url);
	    });
	  });
}

var chatSearch=document.getElementById('chatSearch');
var roomListHTML=document.getElementById('roomList').innerHTML;

chatSearch.onkeyup=function(){
	const roomList=document.getElementById('roomList');
	const searchValue=chatSearch.value.trim();
	const rooms=[[${rooms}]];
	const users=[[${userList}]];
	var newHTML='';
	
	if(!searchValue){
		roomList.style.display='';
		roomList.innerHTML=roomListHTML;
		tapSet();
		return
	}else{
		roomList.style.display='none';
		var count=0;
		for (let i = 0; i < rooms.length; i++) {
		   
		    const r = rooms[i]; 
		    const roomName = r.otherName;
		    
		    if (roomName.startsWith(searchValue)) {
		        count++;
		        const imgPath = (r.otherPhoto === 'default_profile.png') 
		                        ? '/img/profile/defaultProfile.jpg' 
		                        : `/uploads/${r.otherPhoto}`;

		       
		        const activeClass = ([[${activeRoomIdx}]] != null && [[${activeRoomIdx}]] == r.chatRoomIdx) ? ' active' : '';

		       
		        newHTML += `
		            <a class="roomItem${activeClass}" 
		               data-other-type="COACH"
		               href="/company/chat/room/${r.chatRoomIdx}?tab=${r.otherType}">
		               
		               <div class="roomAvatar">
		                 <img src="${imgPath}" alt="profile">
		               </div>

		               <div class="roomInfo">
		                 <div class="roomTopLine">
		                   <div class="roomName">${r.otherName}</div>
		                 </div>
		                 <div class="roomBottomLine">
		                   <div class="roomPreview">${r.lastMessage || ''}</div>
		                   ${r.unreadCount > 0 ? `<span class="roomBadge">${r.unreadCount}</span>` : ''}
		                 </div>
		               </div>
		            </a>`;
		    }
		}
		if(count===0){
			for(let z=0;z<users.length;z++){
				
				const u= users[z];
				const userName=u.USER_NAME;
				const nickName=u.NICKNAME;
				
					u.PHOTO='default_profile.png';//변경해야됨
				
				if(userName.startsWith(searchValue)||nickName.startsWith(searchValue)){
					count++;
					const userImgPath = (u.PHOTO === 'default_profile.png') 
                    ? '/img/profile/defaultProfile.jpg' 
                    : `/uploads/${u.PHOTO}`;
					
                    const userActiveClass = ([[${activeRoomIdx}]] != null ) ? ' active' : '';

					newHTML += `
						<a class="roomItem${userActiveClass}" 
						   data-other-type="COACH";
			               href="/company/chat/start?targetIdx=${u.USER_IDX}&tab=COACH">
			               
			               <div class="roomAvatar">
			                 <img src="${userImgPath}" alt="profile">
			               </div>

			               <div class="roomInfo">
			                 <div class="roomTopLine">
			                   <div class="roomName">${u.NICKNAME}</div>
			                 </div>
			                 <div class="roomBottomLine">
			                   <div class="roomPreview">${u.INTRO || ''}</div>
			                   
			                 </div>
			               </div>
			            </a>`;
				}				
				}
				if(count===0){
				newHTML='검색 결과가 없습니다';
			}
			}
			
			roomList.innerHTML=newHTML;
			roomList.style.display='';
			tapSet();
		}
		
	}
	

</script>
</body>
</html>
