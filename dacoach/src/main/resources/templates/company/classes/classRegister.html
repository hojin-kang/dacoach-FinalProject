<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
<title>클래스 등록 - dacoach</title>
<link rel="stylesheet" th:href="@{/css/main.css}" />
<link rel="stylesheet" th:href="@{/css/company/company_class.css}" />
<style>
.hashtag-input-area {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 4px;
    min-height: 50px;
    background: #f9f9f9;
}

.hashtag-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 6px 12px;
    background: #328889;
    color: white;
    border-radius: 20px;
    font-size: 14px;
}

.hashtag-chip button {
    background: none;
    border: none;
    color: white;
    cursor: pointer;
    font-size: 16px;
    padding: 0;
    margin: 0;
    line-height: 1;
}

.hashtag-chip button:hover {
    color: #ff6b6b;
}

#hashtagInput {
    flex: 1;
    min-width: 150px;
    border: none;
    background: transparent;
    outline: none;
    font-size: 14px;
}

</style>
</head>
<body>
	<div th:replace="~{layout/header :: siteHeader}"></div>

	<main class="main">
		<div class="container">
			<h2>클래스 관리</h2>
			<hr>

			<div class="classPage">
				<!-- LEFT: 메뉴 패널 -->
				<aside class="menuArea">
					<div class="menuHead">관리 메뉴</div>
					<div class="menuButtons">
						<button type="button" class="menuBtn"
							onclick="location.href='/class/company/classList'">컴퍼니</button>
						<button type="button" class="menuBtn"
							style="background: #328889; color: #fff;"
							onclick="location.href='/class/company/register'">클래스 등록</button>
						<button type="button" class="menuBtn"
							onclick="location.href='/class/company/status'">클래스 통계</button>
						<button type="button" class="menuBtn"
							onclick="location.href='/class/company/reviews'">후기 관리</button>
					</div>
				</aside>

				<!-- RIGHT: 등록 폼 -->
				<section class="contentArea">
					<div class="registerForm">
						<!-- 알림 메시지 -->
						<div th:if="${msg}" class="alert success" th:text="${msg}"></div>
						<div th:if="${error}" class="alert error" th:text="${error}"></div>

						<form id="classInsert" th:action="@{/class/company/register}"
							method="post" enctype="multipart/form-data">

							<h1>클래스 등록</h1>

							<!-- CSRF 토큰 -->
							<input type="hidden" th:name="${_csrf.parameterName}"
								th:value="${_csrf.token}" th:if="${_csrf}" />

							<div class="form-group">
								<h3 class="required">클래스 제목</h3>
								<input type="text" id="classTitle" name="title"
									th:value="${classDTO?.title}"
									placeholder="클래스 제목을 입력하세요 (최대 200자)" maxlength="200" required>
								<div id="titleError" class="error-message"></div>
							</div>

							<div class="form-group">
								<h3 class="required">클래스 내용</h3>
								<textarea id="classContent" name="intro"
									th:text="${classDTO?.intro}"
									placeholder="클래스 내용을 자세히 작성해주세요 (최대 3000자)" maxlength="3000"
									required></textarea>
								<div id="contentError" class="error-message"></div>
							</div>

							<div class="form-group">
								<h3 class="required">클래스 제공 분야</h3>
								<div class="select-group">
									<select id="mainCategory" required>
										<option value="">대분류 선택</option>
									</select> <select id="subCategory" name="minor_field_idx" required>
										<option value="">소분류 선택</option>
									</select>
								</div>
								<div id="fieldError" class="error-message"></div>
							</div>

							<div class="form-group">
								<h3 class="required">클래스 제공 장소</h3>
								<div class="select-group">
									<select id="majorRegion" required>
										<option value="">시/도 선택</option>
									</select> <select id="minorRegion" name="minor_region_idx" required>
										<option value="">구/군 선택</option>
									</select>
								</div>
								<div id="regionError" class="error-message"></div>
							</div>

							<div class="form-group">
								<h3 class="required">클래스 가격</h3>
								<input type="number" id="classCost" name="price"
									th:value="${classDTO?.price}" placeholder="클래스 가격을 입력하세요 (원)"
									min="0" max="10000000" required>
								<div id="priceError" class="error-message"></div>
							</div>

							<!-- ⭐ 해시태그 입력 폼 추가 ⭐ -->
							<div class="form-group">
								<h3>해시태그</h3>
								<div class="hashtag-input-area" id="hashtagArea">
									<input type="text" id="hashtagInput"
										placeholder="#해시태그 입력 후 Enter (띄어쓰기 자동 제거) 최대 3개" autocomplete="off">
								</div>
								<!-- 숨겨진 필드로 해시태그 전송 -->
								<input type="hidden" id="hashtagsData" name="hashtags">
							</div>

							<!-- 사진 업로드 -->
							<div class="form-group">
								<h3>클래스 소개 사진</h3>
								<div class="file-upload-area">
									<input type="file" id="photoUpload" name="photoFile"
										accept="image/*" style="display: none;">
									<button type="button" class="upload-btn"
										onclick="document.getElementById('photoUpload').click()">
										📷 사진 업로드</button>
									<div class="file-info">권장: 1200x800 이상, 최대 50MB (JPG,
										PNG, GIF, WEBP)</div>
								</div>
								<div id="photoPreviewContainer" class="file-preview-container"></div>
							</div>

							<!-- 영상 업로드 -->
							<div class="form-group">
								<h3>클래스 소개 영상</h3>
								<div class="file-upload-area">
									<input type="file" id="videoUpload" name="videoFile"
										accept="video/*" style="display: none;">
									<button type="button" class="upload-btn"
										onclick="document.getElementById('videoUpload').click()">
										🎥 영상 업로드</button>
									<div class="file-info">형식: MP4, AVI, MOV, WEBM 등, 최대 50MB</div>
								</div>
								<div id="videoPreviewContainer" class="file-preview-container"></div>
							</div>

							<div class="form-group">
								<h3 class="required">클래스 기간</h3>
								<div class="date-time-group">
									<div class="date-time-input">
										<label for="startDate">시작일</label> <input
											type="datetime-local" id="startDate" name="start_date"
											required>
									</div>
									<div class="date-time-input">
										<label for="endDate">종료일</label> <input type="datetime-local"
											id="endDate" name="end_date" required>
									</div>
								</div>
								<div id="dateError" class="error-message"></div>
							</div>

							<div class="form-group">
								<h3 class="required">수강인원 제한</h3>
								<div class="range-group">
									<input type="range" id="participantLimit" name="max_user_cnt"
										min="1" max="99" value="10">
									<output id="participantOutput">10명</output>
								</div>
							</div>

							<div class="form-group">
								<button type="submit" id="submitBtn" class="submit-btn">등록하기</button>
							</div>
						</form>
					</div>
				</section>
			</div>
		</div>
	</main>

	<div th:replace="~{layout/footer :: siteFooter}"></div>

	<script th:inline="javascript">
		// 전역 변수
		let selectedPhoto = null;
		let selectedVideo = null;
		let hashtags = []; // ⭐ 해시태그 배열

		// 페이지 로드 시 초기화
		document.addEventListener('DOMContentLoaded', function() {
			loadMajorFields();
			loadMajorRegions();
			
			// 이벤트 리스너 등록
			document.getElementById('mainCategory').addEventListener('change', onMainCategoryChange);
			document.getElementById('majorRegion').addEventListener('change', onMajorRegionChange);
			document.getElementById('participantLimit').addEventListener('input', onParticipantChange);
			document.getElementById('photoUpload').addEventListener('change', onPhotoUpload);
			document.getElementById('videoUpload').addEventListener('change', onVideoUpload);
			
			// ⭐ 해시태그 입력 이벤트
			document.getElementById('hashtagInput').addEventListener('keydown', onHashtagKeydown);
			
			// ⭐ 폼 제출 시 해시태그 데이터 설정
			document.getElementById('classInsert').addEventListener('submit', function(e) {
				document.getElementById('hashtagsData').value = hashtags.join(',');
			});
		});

		// ⭐ 해시태그 입력 처리
		function onHashtagKeydown(e) {
			if (e.key === 'Enter') {
				e.preventDefault();
				
				let input = e.target.value.trim();
				if (!input) return;
				
				// 띄어쓰기 제거
				input = input.replace(/\s+/g, '');
				
				// # 자동 추가
				if (!input.startsWith('#')) {
					input = '#' + input;
				}
				
				// 중복 체크
				if (hashtags.includes(input)) {
					alert('이미 추가된 해시태그입니다.');
					e.target.value = '';
					return;
				}
				
				// 최대 개수 체크
				if (hashtags.length >= 3) {
					alert('해시태그는 최대 3개까지 추가할 수 있습니다.');
					e.target.value = '';
					return;
				}
				
				// 해시태그 추가
				addHashtag(input);
				e.target.value = '';
			}
		}

		// ⭐ 해시태그 추가 (화면에 표시)
		function addHashtag(tag) {
			hashtags.push(tag);
			
			const chip = document.createElement('div');
			chip.className = 'hashtag-chip';
			chip.innerHTML = `
				<span>${tag}</span>
				<button type="button" onclick="removeHashtag('${tag}', this)">&times;</button>
			`;
			
			const input = document.getElementById('hashtagInput');
			input.parentElement.insertBefore(chip, input);
		}

		// ⭐ 해시태그 제거
		function removeHashtag(tag, btn) {
			hashtags = hashtags.filter(t => t !== tag);
			btn.parentElement.remove();
		}

		// 대분류 로드
		function loadMajorFields() {
			fetch('/class/majorFields')
				.then(response => response.json())
				.then(data => {
					const select = document.getElementById('mainCategory');
					data.forEach(item => {
						const option = document.createElement('option');
						option.value = item.MAJOR_FIELD_IDX;
						option.textContent = item.MAJOR_FIELD_CD;
						select.appendChild(option);
					});
				})
				.catch(error => {
					console.error('대분류 로드 실패:', error);
					alert('대분류 데이터를 불러오는데 실패했습니다.');
				});
		}

		// 대지역 로드
		function loadMajorRegions() {
			fetch('/class/majorRegions')
				.then(response => response.json())
				.then(data => {
					const select = document.getElementById('majorRegion');
					data.forEach(item => {
						const option = document.createElement('option');
						option.value = item.MAJOR_REGION_IDX;
						option.textContent = item.REGION_NM;
						select.appendChild(option);
					});
				})
				.catch(error => {
					console.error('대지역 로드 실패:', error);
					alert('대지역 데이터를 불러오는데 실패했습니다.');
				});
		}

		// 대분류 변경 이벤트
		function onMainCategoryChange(e) {
			const majorIdx = e.target.value;
			const subSelect = document.getElementById('subCategory');
			
			// 소분류 초기화
			subSelect.innerHTML = '<option value="">소분류 선택</option>';
			
			if (majorIdx) {
				fetch('/class/minorFields?majorFieldIdx=' + majorIdx)
					.then(response => response.json())
					.then(data => {
						data.forEach(item => {
							const option = document.createElement('option');
							option.value = item.MINOR_FIELD_IDX;
							option.textContent = item.MINOR_FIELD_NM;
							subSelect.appendChild(option);
						});
					})
					.catch(error => {
						console.error('소분류 로드 실패:', error);
						alert('소분류 데이터를 불러오는데 실패했습니다.');
					});
			}
		}

		// 대지역 변경 이벤트
		function onMajorRegionChange(e) {
			const majorRegionIdx = e.target.value;
			const minorSelect = document.getElementById('minorRegion');
			
			// 소지역 초기화
			minorSelect.innerHTML = '<option value="">구/군 선택</option>';
			
			if (majorRegionIdx) {
				fetch('/class/minorRegions?majorRegionIdx=' + majorRegionIdx)
					.then(response => response.json())
					.then(data => {
						data.forEach(item => {
							const option = document.createElement('option');
							option.value = item.MINOR_REGION_IDX;
							option.textContent = item.DISTRICT_NM;
							minorSelect.appendChild(option);
						});
					})
					.catch(error => {
						console.error('소지역 로드 실패:', error);
						alert('소지역 데이터를 불러오는데 실패했습니다.');
					});
			}
		}

		// 수강인원 변경 이벤트
		function onParticipantChange(e) {
			document.getElementById('participantOutput').textContent = e.target.value + '명';
		}

		// 사진 업로드
		function onPhotoUpload(e) {
			const file = e.target.files[0];
			if (!file) return;

			// 이미지 파일 검증
			if (!file.type.startsWith('image/')) {
				alert('이미지 파일만 업로드 가능합니다.');
				e.target.value = '';
				return;
			}

			// 파일 크기 검증 (50MB)
			if (file.size > 50 * 1024 * 1024) {
				alert('파일 크기는 50MB 이하여야 합니다.');
				e.target.value = '';
				return;
			}

			selectedPhoto = file;

			// 미리보기 생성
			const reader = new FileReader();
			reader.onload = function(event) {
				const container = document.getElementById('photoPreviewContainer');
				container.innerHTML = '';

				const previewDiv = document.createElement('div');
				previewDiv.className = 'file-preview';

				const img = document.createElement('img');
				img.src = event.target.result;

				const removeBtn = document.createElement('button');
				removeBtn.className = 'remove-btn';
				removeBtn.textContent = '✕';
				removeBtn.type = 'button';
				removeBtn.onclick = function() {
					selectedPhoto = null;
					container.innerHTML = '';
					document.getElementById('photoUpload').value = '';
				};

				previewDiv.appendChild(img);
				previewDiv.appendChild(removeBtn);
				container.appendChild(previewDiv);
			};
			reader.readAsDataURL(file);
		}

		// 영상 업로드
		function onVideoUpload(e) {
			const file = e.target.files[0];
			if (!file) return;

			// 비디오 파일 검증
			if (!file.type.startsWith('video/')) {
				alert('비디오 파일만 업로드 가능합니다.');
				e.target.value = '';
				return;
			}

			// 파일 크기 검증 (50MB)
			if (file.size > 50 * 1024 * 1024) {
				alert('파일 크기는 50MB 이하여야 합니다.');
				e.target.value = '';
				return;
			}

			selectedVideo = file;

			// 미리보기 생성
			const reader = new FileReader();
			reader.onload = function(event) {
				const container = document.getElementById('videoPreviewContainer');
				container.innerHTML = '';

				const previewDiv = document.createElement('div');
				previewDiv.className = 'file-preview';

				const video = document.createElement('video');
				video.src = event.target.result;
				video.controls = true;

				const removeBtn = document.createElement('button');
				removeBtn.className = 'remove-btn';
				removeBtn.textContent = '✕';
				removeBtn.type = 'button';
				removeBtn.onclick = function() {
					selectedVideo = null;
					container.innerHTML = '';
					document.getElementById('videoUpload').value = '';
				};

				previewDiv.appendChild(video);
				previewDiv.appendChild(removeBtn);
				container.appendChild(previewDiv);
			};
			reader.readAsDataURL(file);
		}
	</script>
</body>
</html>
