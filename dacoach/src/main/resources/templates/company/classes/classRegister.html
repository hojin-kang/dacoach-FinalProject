<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
<title>클래스 등록 - dacoach</title>
<link rel="stylesheet" th:href="@{/css/main.css}" />
<style>
.error-message {
	color: red;
	font-size: 14px;
	margin-top: 5px;
}

.form-group {
	margin-bottom: 20px;
}

.required::after {
	content: " *";
	color: red;
}

.date-time-input {
	display: inline-block;
	margin-right: 10px;
}

/* 이미지 미리보기 스타일 */
.image-preview-container {
	margin-top: 10px;
	display: flex;
	flex-wrap: wrap;
	gap: 10px;
}

.image-preview {
	position: relative;
	width: 150px;
	height: 150px;
	border: 1px solid #ddd;
	border-radius: 5px;
	overflow: hidden;
}

.image-preview img {
	width: 100%;
	height: 100%;
	object-fit: cover;
}

.image-preview .remove-btn {
	position: absolute;
	top: 5px;
	right: 5px;
	background: rgba(255, 0, 0, 0.7);
	color: white;
	border: none;
	border-radius: 50%;
	width: 25px;
	height: 25px;
	cursor: pointer;
	font-weight: bold;
}

.image-preview .remove-btn:hover {
	background: rgba(255, 0, 0, 0.9);
}

.upload-btn {
	padding: 10px 20px;
	margin: 5px;
	background: #4CAF50;
	color: white;
	border: none;
	border-radius: 5px;
	cursor: pointer;
}

.upload-btn:hover {
	background: #45a049;
}
</style>
</head>
<body>
	<div th:replace="layout/header :: siteHeader"></div>

	<main class="main">
		<div class="container">
			<form id="classInsert" enctype="multipart/form-data">
				<div>
					<h1>클래스 등록</h1>
				</div>

				<!-- 메시지 표시 -->
				<div th:if="${msg}"
					style="color: green; padding: 10px; border: 1px solid green; margin: 10px 0;"
					th:text="${msg}"></div>
				<div th:if="${error}"
					style="color: red; padding: 10px; border: 1px solid red; margin: 10px 0;"
					th:text="${error}"></div>

				<div class="form-group">
					<h3 class="required">클래스 제목</h3>
					<div>
						<input type="text" id="classTitle" name="title"
							placeholder="클래스 제목을 입력하세요 (최대 200자)" maxlength="200" required>
					</div>
					<div id="titleError" class="error-message"></div>
				</div>

				<div class="form-group">
					<h3 class="required">클래스 내용</h3>
					<div>
						<textarea id="classContent" name="intro"
							placeholder="클래스 내용을 자세히 작성해주세요 (최대 3000자)" maxlength="3000"
							rows="10" required></textarea>
					</div>
					<div id="contentError" class="error-message"></div>
				</div>

				<div class="form-group">
					<h3 class="required">클래스 제공 분야</h3>
					<div>
						<select id="mainCategory" required>
							<option value="">대분류 선택</option>
						</select> <select id="subCategory" name="minor_field_idx" required>
							<option value="">소분류 선택</option>
						</select>
					</div>
					<div id="fieldError" class="error-message"></div>
				</div>

				<div class="form-group">
					<h3 class="required">클래스 제공 장소</h3>
					<div>
						<select id="majorRegion" required>
							<option value="">시/도 선택</option>
						</select> <select id="minorRegion" name="minor_region_idx" required>
							<option value="">구/군 선택</option>
						</select>
					</div>
					<div id="regionError" class="error-message"></div>
				</div>

				<div class="form-group">
					<h3 class="required">클래스 가격</h3>
					<div>
						<input type="number" id="classCost" name="price"
							placeholder="클래스 가격을 입력하세요 (원)" min="0" max="10000000" required>
						<span>원</span>
					</div>
					<div id="priceError" class="error-message"></div>
				</div>

				<div class="form-group">
					<h3>클래스 이미지</h3>
					<div>
						<input type="file" id="imageUpload" accept="image/*" multiple
							style="display: none;">
						<button type="button" class="upload-btn"
							onclick="document.getElementById('imageUpload').click()">
							<span>사진 업로드</span>
						</button>
					</div>
					<div id="imagePreviewContainer" class="image-preview-container"></div>
				</div>

				<div class="form-group">
					<h3 class="required">클래스 기간</h3>
					<div>
						<div class="date-time-input">
							<label for="startDate">시작일:</label> <input type="datetime-local"
								id="startDate" name="start_date" required>
						</div>

						<div class="date-time-input">
							<label for="endDate">종료일:</label> <input type="datetime-local"
								id="endDate" name="end_date" required>
						</div>
					</div>
					<div id="dateError" class="error-message"></div>
				</div>

				<div class="form-group">
					<h3 class="required">수강인원 제한</h3>
					<div>
						<input type="range" id="participantLimit" name="max_user_cnt"
							min="1" max="100" value="10">
						<output id="participantOutput">10명</output>
					</div>
				</div>

				<div class="form-group">
					<button type="submit" id="submitBtn">
						<span>등록하기</span>
					</button>
				</div>
			</form>
		</div>
	</main>

	<div th:replace="layout/footer :: siteFooter"></div>

	<script>
		// 전역 변수
		let selectedImages = [];
		
		// 페이지 로드 시 초기화
		document.addEventListener('DOMContentLoaded', function() {
			loadMajorFields();
			loadMajorRegions();
			
			// 이벤트 리스너 등록
			document.getElementById('mainCategory').addEventListener('change', onMainCategoryChange);
			document.getElementById('majorRegion').addEventListener('change', onMajorRegionChange);
			document.getElementById('participantLimit').addEventListener('input', onParticipantChange);
			document.getElementById('imageUpload').addEventListener('change', onImageUpload);
			document.getElementById('classInsert').addEventListener('submit', onFormSubmit);
		});
		
		// 대분류 로드
		function loadMajorFields() {
			fetch('/class/majorFields')
				.then(response => response.json())
				.then(data => {
					const select = document.getElementById('mainCategory');
					data.forEach(item => {
						const option = document.createElement('option');
						option.value = item.MAJOR_FIELD_IDX;
						option.textContent = item.MAJOR_FIELD_CD;
						select.appendChild(option);
					});
				})
				.catch(error => {
					console.error('대분류 로드 실패:', error);
					alert('대분류 데이터를 불러오는데 실패했습니다.');
				});
		}
		
		// 대지역 로드
		function loadMajorRegions() {
			fetch('/class/majorRegions')
				.then(response => response.json())
				.then(data => {
					const select = document.getElementById('majorRegion');
					data.forEach(item => {
						const option = document.createElement('option');
						option.value = item.MAJOR_REGION_IDX;
						option.textContent = item.REGION_NM;
						select.appendChild(option);
					});
				})
				.catch(error => {
					console.error('대지역 로드 실패:', error);
					alert('대지역 데이터를 불러오는데 실패했습니다.');
				});
		}
		
		// 대분류 변경 이벤트
		function onMainCategoryChange(e) {
			const majorIdx = e.target.value;
			const subSelect = document.getElementById('subCategory');
			
			// 소분류 초기화
			subSelect.innerHTML = '<option value="">소분류 선택</option>';
			
			if (majorIdx) {
				fetch('/class/minorFields?majorFieldIdx=' + majorIdx)
					.then(response => response.json())
					.then(data => {
						data.forEach(item => {
							const option = document.createElement('option');
							option.value = item.MINOR_FIELD_IDX;
							option.textContent = item.MINOR_FIELD_NM;
							subSelect.appendChild(option);
						});
					})
					.catch(error => {
						console.error('소분류 로드 실패:', error);
						alert('소분류 데이터를 불러오는데 실패했습니다.');
					});
			}
		}
		
		// 대지역 변경 이벤트
		function onMajorRegionChange(e) {
			const majorRegionIdx = e.target.value;
			const minorSelect = document.getElementById('minorRegion');
			
			// 소지역 초기화
			minorSelect.innerHTML = '<option value="">구/군 선택</option>';
			
			if (majorRegionIdx) {
				fetch('/class/minorRegions?majorRegionIdx=' + majorRegionIdx)
					.then(response => response.json())
					.then(data => {
						data.forEach(item => {
							const option = document.createElement('option');
							option.value = item.MINOR_REGION_IDX;
							option.textContent = item.DISTRICT_NM;
							minorSelect.appendChild(option);
						});
					})
					.catch(error => {
						console.error('소지역 로드 실패:', error);
						alert('소지역 데이터를 불러오는데 실패했습니다.');
					});
			}
		}
		
		// 수강인원 변경 이벤트
		function onParticipantChange(e) {
			document.getElementById('participantOutput').textContent = e.target.value + '명';
		}
		
		// 이미지 업로드 이벤트
		function onImageUpload(e) {
			const files = Array.from(e.target.files);
			
			files.forEach(file => {
				// 이미지 파일 검증
				if (!file.type.startsWith('image/')) {
					alert('이미지 파일만 업로드 가능합니다.');
					return;
				}
				
				// 파일 크기 검증 (5MB)
				if (file.size > 5 * 1024 * 1024) {
					alert('파일 크기는 5MB 이하여야 합니다.');
					return;
				}
				
				// 이미지 저장
				selectedImages.push(file);
				
				// 미리보기 생성
				const reader = new FileReader();
				reader.onload = function(event) {
					createImagePreview(event.target.result, selectedImages.length - 1);
				};
				reader.readAsDataURL(file);
			});
			
			// input 초기화 (같은 파일 재선택 가능하도록)
			e.target.value = '';
		}
		
		// 이미지 미리보기 생성
		function createImagePreview(src, index) {
			const container = document.getElementById('imagePreviewContainer');
			
			const previewDiv = document.createElement('div');
			previewDiv.className = 'image-preview';
			previewDiv.dataset.index = index;
			
			const img = document.createElement('img');
			img.src = src;
			
			const removeBtn = document.createElement('button');
			removeBtn.className = 'remove-btn';
			removeBtn.textContent = 'X';
			removeBtn.type = 'button';
			removeBtn.onclick = function() {
				removeImage(index);
			};
			
			previewDiv.appendChild(img);
			previewDiv.appendChild(removeBtn);
			container.appendChild(previewDiv);
		}
		
		// 이미지 제거
		function removeImage(index) {
			selectedImages[index] = null; // 배열에서 제거하지 않고 null로 설정 (인덱스 유지)
			
			// 미리보기 제거
			const previewDiv = document.querySelector(`.image-preview[data-index="${index}"]`);
			if (previewDiv) {
				previewDiv.remove();
			}
		}
		
		// 폼 제출 이벤트
		function onFormSubmit(e) {
			e.preventDefault();
			
			// 에러 메시지 초기화
			document.querySelectorAll('.error-message').forEach(el => el.textContent = '');
			
			// 제출 버튼 비활성화 (중복 제출 방지)
			const submitBtn = document.getElementById('submitBtn');
			submitBtn.disabled = true;
			submitBtn.textContent = '등록 중...';
			
			// FormData 생성
			const formData = new FormData();
			
			// 일반 필드 추가
			formData.append('title', document.getElementById('classTitle').value);
			formData.append('intro', document.getElementById('classContent').value);
			formData.append('minor_field_idx', document.getElementById('subCategory').value);
			formData.append('minor_region_idx', document.getElementById('minorRegion').value);
			formData.append('price', document.getElementById('classCost').value);
			formData.append('start_date', document.getElementById('startDate').value);
			formData.append('end_date', document.getElementById('endDate').value);
			formData.append('max_user_cnt', document.getElementById('participantLimit').value);
			
			// 이미지 파일 추가
			selectedImages.forEach((file, index) => {
				if (file !== null) {
					formData.append('images', file);
				}
			});
			
			// Ajax 요청
			fetch('/class/register', {
				method: 'POST',
				body: formData
			})
			.then(response => {
				if (response.redirected) {
					window.location.href = response.url;
				} else if (response.ok) {
					alert('클래스 등록이 완료되었습니다!');
					window.location.href = '/class/list';
				} else {
					return response.text().then(text => {
						throw new Error(text || '등록 실패');
					});
				}
			})
			.catch(error => {
				alert('등록 실패: ' + error.message);
				submitBtn.disabled = false;
				submitBtn.textContent = '등록하기';
			});
		}
	</script>
</body>
</html>
