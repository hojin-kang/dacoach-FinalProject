<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
<title>dacoach</title>
<link rel="stylesheet" th:href="@{/css/main.css}" />
<link rel="stylesheet" th:href="@{/css/company/company_class.css}" />
<!-- 카카오맵 API -->
<script type="text/javascript"
	src="//dapi.kakao.com/v2/maps/sdk.js?appkey=6f04c74845d3e7a3116d5982f61b9eb9&libraries=services"></script>
</head>
<body>
	<div th:replace="~{layout/header :: siteHeader}"></div>

	<main class="main">
		<div class="container">

			<!-- 상단 프로필/타이틀 영역 -->
			<section class="classDetailTop">
				<div class="topLeft">
					<!-- 프로필 이미지 (provider) -->
					<div class="providerAvatar">
						<img th:if="${providerPhoto != null and providerPhoto != ''}"
							th:src="'/uploads/' + ${providerPhoto}" alt="provider" /> <img
							th:unless="${providerPhoto != null and providerPhoto != ''}"
							th:src="@{/img/profile/defaultProfile.jpg}" alt="provider" />
					</div>

					<div class="topInfo">
						<div class="providerLine">
							<div class="providerName" th:text="${providerName}"></div>
						</div>

						<div class="classTitle" th:text="${classDTO.title}"></div>
					</div>
				</div>

				<div class="topRight">
					<th:block
						th:unless="${session.user_type != null and #strings.equalsIgnoreCase(session.user_type, 'company')}">
						<div class="topIcons" th:if="${dto.user_idx != session.user_idx}">
							<!-- 찜 -->
							<a class="iconBtn likeBtn" aria-label="찜"
								th:href="${isLiked} 
		       ? @{/class/unlike(target_idx=${dto.user_idx})} 
		       : @{/class/like(target_idx=${dto.user_idx})}">
								<img class="icon"
								th:src="${isLiked} ? @{/img/icon/heart_fill.png} : @{/img/icon/heart.png}"
								alt="heart">
							</a>

							<!-- 신고 -->
							<form th:action="@{/report/form}" method="post"
								style="display: inline;">
								<input type="hidden" name="reported_idx"
									th:value="${dto.user_idx}"> <input type="hidden"
									name="returnUrl"
									th:value="@{/class/classDetail(user_idx=${dto.user_idx})}">
								<button type="submit" class="iconBtn" aria-label="신고">
									<img src="/img/icon/siren.png" alt="siren">
								</button>
							</form>
						</div>

					</th:block>
				</div>

			</section>

			<!-- 탭(상세정보 / 클래스후기) -->
			<nav class="detail-tabs">
				<a class="tab active" href="#detail">상세정보</a> <a class="tab"
					href="#reviews">클래스 후기</a>
			</nav>

			<div class="classDetailPage">

				<!-- LEFT: 상세 -->
				<section class="detailArea" id="detail">

					<!-- 클래스소개 -->
					<article class="detailBlock">
						<h3 class="blockTitle">클래스 소개</h3>
						<p class="blockText" th:text="${classDTO.intro}"></p>
					</article>

					<!-- 해시태그 -->
					<article class="detailBlock">
						<h3 class="blockTitle">해시태그</h3>
						<div class="tagRow">
							<span class="tag" th:each="tag : ${hashtagList}" th:text="${tag}"></span>
							<span class="tag tag-empty"
								th:if="${hashtagList == null or #lists.isEmpty(hashtagList)}">#해시태그없음</span>
						</div>
					</article>

					<!-- 제공분야 블록 -->
					<article class="detailBlock">
						<h3 class="blockTitle">분야</h3>
						<!-- 분야 정보 (대분류 > 소분류) -->
						<div class="field-info">
							<span class="field-text" th:if="${fieldInfo != null}"
								th:text="${fieldInfo.MAJOR_FIELD_CD} + ' > ' + ${fieldInfo.MINOR_FIELD_NM}"></span>
							<span class="field-empty" th:if="${fieldInfo == null}">분야
								정보 없음</span>
						</div>
					</article>

					<!-- 제공지역 -->
					<article class="detailBlock">
						<h3 class="blockTitle">위치</h3>
						<!-- 분야 정보 (대지역 > 소지역) -->
						<div class="region-info">
							<span class="region-text" th:if="${regionInfo != null}"
								th:text="${regionInfo.REGION_NM} + ' ' + ${regionInfo.DISTRICT_NM} + ' ' + ${classDTO.region_detail}"></span>
							<span class="region-empty" th:if="${regionInfo == null}">지역
								정보 없음</span>
							<!-- 카카오맵 -->
							<div id="kakaoMap"></div>
						</div>

						<!-- 숨겨진 필드로 주소 정보 전달 (지도용)-->
						<input type="hidden" id="addressData"
							th:value="${regionInfo != null ? (regionInfo.REGION_NM + ' ' + regionInfo.DISTRICT_NM + ' ' + (classDTO.region_detail != null ? classDTO.region_detail : '')) : ''}" />
					</article>

					<!-- 사진/동영상 -->
					<article class="detailBlock">
						<h3 class="blockTitle">사진/동영상</h3>

						<div class="mediaRow">
							<!-- 동영상(있으면) -->
							<div class="mediaBox">
								<span th:if="${classDTO.video == null or classDTO.video == ''}"
									class="no-media-message">🎥 영상이 없습니다</span>
								<video class="mediaVideo" controls
									th:if="${classDTO.video != null and classDTO.video != ''}">
									<source th:src="'/uploads/' + ${classDTO.video}"
										type="video/mp4">
								</video>
							</div>

							<!-- 사진(대표 1장) -->
							<div class="mediaBox">
								<span th:if="${classDTO.photo == null or classDTO.photo == ''}"
									class="no-media-message">📷 이미지가 없습니다</span> <img
									class="mediaImg"
									th:if="${classDTO.photo != null and classDTO.photo != ''}"
									th:src="'/uploads/' + ${classDTO.photo}" alt="class photo" />
							</div>

						</div>
					</article>

					<!-- 후기 블록 (앵커 목적지) -->
					<article class="detailBlock" id="reviews">
						<div class="reviewHead">
							<h3 class="blockTitle">클래스 후기</h3>

							<!-- 요약: 리뷰수/평점 -->
							<div class="reviewSummary">
								<span class="summaryText"> <b
									th:text="${reviewCount != null ? reviewCount : 0}"></b>명이 해당
									클래스를 긍정적 (★<b th:text="${avgRating != null ? avgRating : 0}"></b>/5.0)으로
									평가했습니다.
								</span>
							</div>
						</div>

						<!-- 후기 카드 슬라이더 느낌 -->
						<div class="reviewSlider">

							<div class="reviewCards">
								<!-- 리뷰 1개 -->
								<div class="reviewCard" th:each="r : ${reviewList}">
									<div class="reviewTop">
										<!-- 왼쪽: 프로필 사진 + 이름 -->
										<div class="reviewAuthor">
											<div class="reviewAvatar">
												<a class="reviewerLink"
													th:href="@{/coach/detail(user_idx=${r.REVIEWER_IDX})}">
													<span
													th:if="${r.REVIEWER_PHOTO == null or r.REVIEWER_PHOTO == ''}"
													class="no-media-message"
													style="width: 40px; height: 40px; border-radius: 50%; font-size: 11px;">👤</span>
													<img
													th:if="${r.REVIEWER_PHOTO != null and r.REVIEWER_PHOTO != ''}"
													th:src="'/uploads/' + ${r.REVIEWER_PHOTO}" alt="reviewer" />
												</a>
											</div>
											<div class="reviewerName" th:text="${r.REVIEWER_NAME}"></div>
										</div>

										<!-- 오른쪽: 별점 + 내용 -->
										<div class="reviewMeta">
											<div class="reviewStars">
												<span class="stars" th:text="|★ ${r.RATING}|"></span>
											</div>
											<div class="reviewText" th:text="${r.CONTENT}"></div>
										</div>
									</div>

									<!-- 하단: 태그 -->
									<div class="reviewBottom">
										<div class="reviewTag"
											th:if="${r.TAG != null and r.TAG != ''}" th:text="${r.TAG}"></div>
									</div>
								</div>

								<!-- reviewList 없을 때 -->
								<div class="reviewCard"
									th:if="${reviewList == null or #lists.isEmpty(reviewList)}">
									<div class="reviewTop">
										<div class="reviewMeta">
											<div class="reviewText">아직 후기가 없습니다.</div>
										</div>
									</div>
								</div>
							</div>

						</div>
					</article>

				</section>

				<!-- RIGHT: (원하면) 고정 사이드 요약 박스 -->
				<aside class="sideArea">
					<div class="sideCard">
						<div class="sideTitle">클래스 정보</div>

						<div class="sideRow">
							<span class="sideLabel">수강 가능 기간</span> <span class="sideValue"
								th:text="|${#dates.format(classDTO.start_date,'yyyy.MM.dd')} ~ ${#dates.format(classDTO.end_date,'yyyy.MM.dd')}|">
							</span>
						</div>

						<div class="sideRow">
							<span class="sideLabel">수강 가격(하루)</span> <span class="sideValue"
								th:text="|${#numbers.formatInteger(classDTO.price, 3, 'COMMA')}₩|"></span>
						</div>

						<div class="sideRow">
							<span class="sideLabel">하루 수강 정원</span> <span class="sideValue"
								th:text="|${classDTO.max_user_cnt}명|"></span>
						</div>

						<div class="sideBtns"
							th:with="today=${#dates.format(#dates.createToday(),'yyyy-MM-dd')}, end=${#dates.format(classDTO.end_date,'yyyy-MM-dd')}">
							<!-- 종료일까지 수정 가능 (문자열 비교) -->
							<a class="actionBtn solid" th:if="${today <= end}"
								th:href="@{/class/company/update(classId=${classDTO.class_idx})}">수정하기</a>
							<button class="actionBtn solid disabled" th:if="${today > end}"
								disabled title="종료된 클래스는 수정할 수 없습니다">수정하기</button>
						</div>
					</div>
				</aside>

			</div>
		</div>
	</main>

	<div th:replace="~{layout/footer :: siteFooter}"></div>

	<script th:inline="javascript">
		// 앵커 이동 (nav 높이 offset 보정)
		document.querySelectorAll('a[href^="#"]').forEach(a => {
			a.addEventListener('click', (e) => {
				const id = a.getAttribute('href');
				const el = document.querySelector(id);
				if (!el) return;
				e.preventDefault();
				const nav = document.querySelector('.detail-tabs');
				const navH = nav ? nav.getBoundingClientRect().height : 0;
				const top = el.getBoundingClientRect().top + window.scrollY - navH;
				window.scrollTo({ top, behavior: 'smooth' });
			});
		});

		// 탭 active 토글
		const tabs = document.querySelectorAll('.detail-tabs .tab');

		function setActiveByHash() {
			const hash = window.location.hash;
			tabs.forEach(t => t.classList.remove('active'));
			if (hash === '#reviews') {
				document.querySelector('.detail-tabs .tab[href="#reviews"]')?.classList.add('active');
			} else {
				document.querySelector('.detail-tabs .tab[href="#detail"]')?.classList.add('active');
			}
		}

		tabs.forEach(tab => {
			tab.addEventListener('click', () => {
				tabs.forEach(t => t.classList.remove('active'));
				tab.classList.add('active');
			});
		});

		window.addEventListener('hashchange', setActiveByHash);
		document.addEventListener('DOMContentLoaded', setActiveByHash);

		// 카카오맵 초기화
		window.addEventListener('DOMContentLoaded', function() {
			const addressData = document.getElementById('addressData').value;
			
			if (!addressData || addressData.trim() === '') {
				console.log('주소 정보가 없습니다.');
				return;
			}

			// 지도를 표시할 div 
			const mapContainer = document.getElementById('kakaoMap');
			const mapOption = {
				center: new kakao.maps.LatLng(37.5565426, 126.9195486), // 쌍용강북교육센터 = 기본 좌표
				level: 4 // 지도 확대 레벨
			};

			// 지도 생성
			const map = new kakao.maps.Map(mapContainer, mapOption);

			// 주소-좌표 변환 객체 생성
			const geocoder = new kakao.maps.services.Geocoder();

			// 주소로 좌표를 검색
			geocoder.addressSearch(addressData, function(result, status) {
				// 정상적으로 검색이 완료됐으면 
				if (status === kakao.maps.services.Status.OK) {
					const coords = new kakao.maps.LatLng(result[0].y, result[0].x);

					// 결과값으로 받은 위치를 마커로 표시
					const marker = new kakao.maps.Marker({
						map: map,
						position: coords
					});

					// 지도의 중심을 결과값으로 받은 위치로 이동
					map.setCenter(coords);
				} else {
					
					// 검색 실패 시 지도 위에 메시지 표시
					const message = document.createElement('div');
					message.style.cssText = 'position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(255,255,255,0.9);padding:15px 20px;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,0.2);z-index:1000;font-size:14px;color:#666;text-align:center;';
					message.innerHTML = '🗺️ 주소 정보가 정확하지 않습니다.<br><small style="font-size:12px;color:#999;">검색 주소: ' + addressData + '</small>';
					mapContainer.style.position = 'relative';
					mapContainer.appendChild(message);
				}
			});
		});
	</script>
</body>
</html>
