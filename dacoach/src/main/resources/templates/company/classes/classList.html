<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
<title>dacoach</title>
<link rel="stylesheet" th:href="@{/css/main.css}" />
<link rel="stylesheet" th:href="@{/css/company/company_class.css}" />
</head>
<body>
	<div th:replace="~{layout/header :: siteHeader}"></div>
	<main class="main">
		<div class="container">
			<h2>클래스</h2>
			<hr>

			<div class="classPage">
				<!-- LEFT: 버튼 패널 -->
				<div th:replace="~{company/classes/classAside :: classMenu('list')}"></div>

				<!-- RIGHT: 컨텐츠 -->
				<section class="contentArea">
					<div class="contentTop">

						<div class="sortBox">
							<select class="sortSelect" name="sort" id="sortSelect"
								onchange="handleSortChange(this.value)">
								<option value="all" th:selected="${sort == 'all'}">전체</option>
								<option value="will" th:selected="${sort == 'will'}">예정된</option>
								<option value="ongoing" th:selected="${sort == 'ongoing'}">진행중</option>
								<option value="done" th:selected="${sort == 'done'}">종료된</option>
							</select>

						</div>
					</div>
					<div class="cardGrid">
						<!-- 데이터 반복 출력 -->
						<a th:each="classItem : ${classList}" class="classCard"
							th:href="@{/class/company/classDetail(id=${classItem.class_idx})}">

							<div class="thumb">
								<!-- 동료 방식: /uploads/ + 전체 경로 -->
								<span
									th:if="${classItem.photo == null or classItem.photo == ''}"
									class="no-media-message">📷 이미지가 없습니다</span> <img
									th:if="${classItem.photo != null and classItem.photo != ''}"
									th:src="'/uploads/' + ${classItem.photo}"
									th:alt="${classItem.title}" />

								<!-- 상태 배지 -->
								<span class="statusBadge"
									th:classappend="${now > classItem.end_date} ? 'done' : (${now < classItem.start_date} ? 'will' : 'ongoing')"
									th:text="${now > classItem.end_date} ? '종료' : (${now < classItem.start_date} ? '예정' : '진행중')">
								</span>
							</div>

							<div class="meta">
								<div class="title" th:text="${classItem.title}">클래스 제목</div>
								<div class="price"
									th:text="${#numbers.formatInteger(classItem.price, 0, 'COMMA')} + '원'">0원</div>
								<div class="classInfo">
									<span
										th:text="${#dates.format(classItem.start_date, 'MM.dd')} + ' ~ ' + ${#dates.format(classItem.end_date, 'MM.dd')}">기간</span>
									<span th:text="${classItem.max_user_cnt} + '명'">인원</span>
								</div>
								<div class="intro"
									th:text="${#strings.abbreviate(classItem.intro, 20)}">소개</div>
							</div>
						</a>

						<!-- 데이터 없을 때 -->
						<div th:if="${classList == null || #lists.isEmpty(classList)}"
							class="noData">
							<p th:if="${sort == 'all'}">📭 등록된 클래스가 없습니다.</p>
							<p th:if="${sort == 'will'}">📅 예정된 클래스가 없습니다.</p>
							<p th:if="${sort == 'ongoing'}">⏳ 진행중인 클래스가 없습니다.</p>
							<p th:if="${sort == 'done'}">✅ 종료된 클래스가 없습니다.</p>
							<p>
								<a th:href="@{/class/company/register}" class="btnRegister">클래스
									등록하기</a>
							</p>
						</div>
					</div>
				</section>
			</div>
		</div>
	</main>
	<div th:replace="~{layout/footer :: siteFooter}"></div>

	<script th:inline="javascript">
		function handleSortChange(sortValue) {
			// 현재 URL에 sort 파라미터 추가하여 페이지 이동
			window.location.href = '/class/company/classList?sort=' + sortValue;
		}
	</script>
</body>
</html>
