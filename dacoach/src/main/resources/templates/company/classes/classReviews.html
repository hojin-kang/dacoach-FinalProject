<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
<title>클래스 후기 - dacoach</title>
<link rel="stylesheet" th:href="@{/css/main.css}" />
<link rel="stylesheet" th:href="@{/css/company/company_class.css}" />
</head>
<body>
	<div th:replace="~{layout/header :: siteHeader}"></div>

	<main class="main">
		<div class="container">
			<h2>클래스 후기</h2>
			<hr>

			<div class="classPage">
				<!-- LEFT: 메뉴 패널 -->
				<div
					th:replace="~{company/classes/classAside :: classMenu('reviews')}"></div>

				<!-- RIGHT: 후기 컨텐츠 -->
				<section class="statsContent">
					<!-- 클래스 선택 -->
					<div class="classSelector">
						<select id="classSelect" onchange="loadClassReviews()">
							<option value="">클래스를 선택하세요</option>
						</select>
					</div>

					<!-- 후기 컨테이너 -->
					<div id="reviewsContainer" style="display: none;">
						<!-- 요약 카드 -->
						<div class="summaryCards">
							<div class="summaryCard blue">
								<div class="cardLabel">평균 평점</div>
								<div class="cardValue" id="avgRating">0.0</div>
							</div>
							<div class="summaryCard green">
								<div class="cardLabel">총 후기 수</div>
								<div class="cardValue" id="reviewCount">0</div>
							</div>
							<div class="summaryCard orange">
								<div class="cardLabel">클래스 이름</div>
								<div class="cardValue" id="classTitle" style="font-size: 1rem;">-</div>
							</div>
						</div>

						<!-- 후기 리스트 -->
						<div class="statsSection">
							<div class="sectionTitle">후기 목록</div>
							<div id="reviewListContainer">
								<div class="reviewList" id="reviewList">
									<!-- 후기 데이터가 여기에 로드됨 -->
								</div>
							</div>
						</div>
					</div>

					<!-- 로딩/에러 메시지 -->
					<div id="loadingMessage" class="loadingSpinner"
						style="display: none;">
						<p>📝 후기를 불러오는 중...</p>
					</div>

					<div id="noClassMessage" class="noData">
						<p>📭 클래스를 선택하면 후기를 확인할 수 있습니다.</p>
					</div>

					<div id="errorMessage" class="errorMessage" style="display: none;">
						<p>⚠️ 데이터를 불러오는 중 오류가 발생했습니다.</p>
					</div>
				</section>
			</div>
		</div>
	</main>

	<div th:replace="~{layout/footer :: siteFooter}"></div>

	<script>
		// 페이지 로드 시 클래스 목록 불러오기
		document.addEventListener('DOMContentLoaded', function() {
			loadClassList();
		});

		// 클래스 목록 로드
		function loadClassList() {
			fetch('/class/company/classListForStats')
				.then(response => response.json())
				.then(data => {
					const select = document.getElementById('classSelect');
					select.innerHTML = '<option value="">클래스를 선택하세요</option>';
					
					data.forEach(classItem => {
						const option = document.createElement('option');
						option.value = classItem.class_idx;
						option.textContent = classItem.title;
						select.appendChild(option);
					});
				})
				.catch(error => {
					console.error('클래스 목록 로드 실패:', error);
					showError();
				});
		}

		// 클래스 후기 로드
		function loadClassReviews() {
			const classIdx = document.getElementById('classSelect').value;
			
			if (!classIdx) {
				document.getElementById('reviewsContainer').style.display = 'none';
				document.getElementById('noClassMessage').style.display = 'block';
				document.getElementById('errorMessage').style.display = 'none';
				return;
			}

			showLoading();

			fetch(`/class/company/reviews/api?classIdx=${classIdx}`)
				.then(response => response.json())
				.then(data => {
					hideLoading();
					displayReviews(data);
				})
				.catch(error => {
					console.error('후기 로드 실패:', error);
					hideLoading();
					showError();
				});
		}

		// 후기 데이터 표시
		function displayReviews(data) {
			document.getElementById('reviewsContainer').style.display = 'block';
			document.getElementById('noClassMessage').style.display = 'none';
			document.getElementById('errorMessage').style.display = 'none';

			// 요약 카드 업데이트
			document.getElementById('avgRating').textContent = '⭐ ' + data.avgRating.toFixed(1);
			document.getElementById('reviewCount').textContent = data.reviewCount + '개';
			document.getElementById('classTitle').textContent = data.classTitle;

			// 후기 리스트 업데이트
			displayReviewList(data.reviews);
		}

		// 후기 리스트 표시
		function displayReviewList(reviews) {
			const reviewList = document.getElementById('reviewList');
			reviewList.innerHTML = '';

			if (!reviews || reviews.length === 0) {
				reviewList.innerHTML = '<div class="noData"><p>아직 작성된 후기가 없습니다.</p></div>';
				return;
			}

			reviews.forEach(review => {
				const reviewCard = document.createElement('div');
				reviewCard.className = 'reviewCard';
				reviewCard.style.cursor = 'pointer';
				reviewCard.onclick = () => location.href = `/coach/reviewDetail?reviewIdx=${review.REVIEW_CLASS_IDX}`;
				
				// 별점 표시
				const stars = '⭐'.repeat(Math.floor(review.RATING));
				
				// 프로필 이미지 경로 처리
				const profileImg = review.REVIEWER_PHOTO ? '/uploads/' + review.REVIEWER_PHOTO : '/img/profile/defaultProfile.jpg';
				
				// 해시태그 파싱 및 표시 로직
				let tagHtml = '';
				if (review.TAG) {
					const tags = review.TAG.split('#').filter(tag => tag.trim() !== '');
					if (tags.length > 0) {
						const firstTag = tags[0].trim();
						const remainingCount = tags.length - 1;
						
						tagHtml = '<div class="reviewTagContainer">';
						tagHtml += `<div class="reviewTag">#${firstTag}</div>`;
						if (remainingCount > 0) {
							tagHtml += `<span class="reviewTagMore">+${remainingCount}</span>`;
						}
						tagHtml += '</div>';
					}
				}
				
				reviewCard.innerHTML = `
					<div class="reviewCardHeader">
						<div class="reviewerInfo">
						<a class="name-link" href="/coach/detail?user_idx=${review.REVIEWER_IDX}">
							<img src="${profileImg}" 
								 alt="reviewer" 
								 class="reviewerAvatar"
									 onerror="this.src='/img/profile/defaultProfile.jpg'">
							</a>
							<div class="reviewerMeta">
								<div class="reviewerName">${review.REVIEWER_NAME}</div>
								<div class="reviewDate">${formatDate(review.CREATED_AT)}</div>
							</div>
						</div>
						<div class="reviewRating">
							<span class="stars">${stars} ${review.RATING.toFixed(1)}</span>
						</div>
					</div>
					<div class="reviewCardBody">
						${tagHtml}
						<div class="reviewContent">${review.CONTENT || '내용 없음'}</div>
					</div>

				`;
				
				reviewList.appendChild(reviewCard);
			});
		}

		// 날짜 포맷팅
		function formatDate(dateString) {
			if (!dateString) return '-';
			const date = new Date(dateString);
			return date.toLocaleDateString('ko-KR', {
				year: 'numeric',
				month: '2-digit',
				day: '2-digit'
			});
		}

		// 로딩 표시
		function showLoading() {
			document.getElementById('loadingMessage').style.display = 'block';
			document.getElementById('reviewsContainer').style.display = 'none';
			document.getElementById('noClassMessage').style.display = 'none';
			document.getElementById('errorMessage').style.display = 'none';
		}

		// 로딩 숨김
		function hideLoading() {
			document.getElementById('loadingMessage').style.display = 'none';
		}

		// 에러 표시
		function showError() {
			document.getElementById('errorMessage').style.display = 'block';
			document.getElementById('reviewsContainer').style.display = 'none';
			document.getElementById('noClassMessage').style.display = 'none';
			document.getElementById('loadingMessage').style.display = 'none';
		}
	</script>
</body>
</html>
