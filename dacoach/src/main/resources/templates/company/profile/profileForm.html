<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

   <meta charset="UTF-8" />
   <title>dacoach</title>
	<script>
	function getMinorRegion(){ 
		var regionIdx=document.profileInfo.majorRegion.value;
	fetch('/api/company/getMinorRegion?regionIdx='+regionIdx)
			
	.then(function(resp){
		if(resp.ok){
			return resp.text();
		}else{
			throw new Error('에러남');
		}
		
	})
	
	.then(function(data){
		var regionValue=JSON.parse(data);
		
		var getRegionTag=document.getElementById('MinorRegion');
		var html='';
		for(var i=0;i<regionValue.length;i++){
			var dto=regionValue[i];
			html+='<input type="radio" name="minorRegion" th:value="'+dto.MAJOR_REGION_IDX+'" onclick="minorRegionVal()">'+dto.DISTRICT_NM;
		}
		getRegionTag.innerHTML=html;
		
	})
	
	.catch(function(error){
		alert(error.message);
	});
	}
	</script>
   <link rel="stylesheet" th:href="@{/css/main.css}" />
</head>
<body>
   <div th:replace="layout/header :: siteHeader"></div>

   <main class="main">
   <div class="container">
   	<form name="profileInfo" action="companyJoinOk" method="post">
      <div class="picUpload">
      	<p class="profilePic">업로드한 사진 올릴영역</p>
      	<p class="picUpBtn"><input type="file" name="profilePicFile" id="profilePicFileId"></p>
      </div>
      <div class="profileInfoArea">
      	<textarea rows="4" cols="8" name="profileArea" placeholder="프로필 설명을 입력해주세요"></textarea>
      </div>
      <div class="classRegion">
      	<p class="classMagerRegion" id="MagerRegion">
      		<span th:each="region:${region_con}">
      		<input type="radio" name="majorRegion" th:value="${region.MAJOR_REGION_IDX}" onclick="getMinorRegion()">[[${region.REGION_NM}]]
      		</span>
      	</p>
		<p class="classMinorRegion" id="MinorRegion">
			소분류태그가져올거
		</p>
		<p><input type="text" name="regionDetal" placeholder="상세주소를 입력해주세요"></p>
		<p class="classAddRegion" id="AddRegion">
			<input type="button" value="주소 추가하기" id="addRegion">
		</p>
      </div>
      <div class="tags">
      	<p class="majorFieldClass">     		
      		<span th:each="field:${field_con}">
      		<input type="radio" name="majorField" th:value="${field.MAJOR_FIELD_IDX}" onclick="getMinorField()">[[${field.MAJOR_FIELD_CD}]]
      		</span>
      	</p>
      	<p class="minorField">
      		<input type="button" id="minorField" value="분야소분류">
      	</p>
      </div>
     </form>
   </div>
   </main>
  
   <div th:replace="layout/footer :: siteFooter"></div>

</body>
</html>
