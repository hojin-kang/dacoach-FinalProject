<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

<meta charset="UTF-8" />
<title>dacoach</title>

<link rel="stylesheet" th:href="@{/css/main.css}" />
</head>
<body>
	<div th:replace="layout/header :: siteHeader"></div>

	<main class="main">
		<div class="container">
			<form name="regionForm">
			<div class="classRegion">
			<div class="companyRegion" th:if="${regionList!=null}">
				<span th:each="list:${regionList}">[[${list.REGION_NM}]] [[${list.DISTRICT_NM}]]
					[[${list.REGION_DETAIL}]] [[${list.BRANCH_NAME}]] [[${list.BRANCH_TEL}]]
				</span>
			</div>
				<p class="classMagerRegion" id="MagerRegion">
					<select name="major_region_idx" id="majorSelect">
						<option>대분류</option>
						<option th:each="region:${region_con}"
							th:value="${region.MAJOR_REGION_IDX}">[[${region.REGION_NM}]]</option>
					</select>

				</p>
				<p class="classMinorRegion">
					<select name="minor_region_idx" id="MinorRegion">
						<option id="m_intro">소분류</option>
					</select>
				</p>
				<p id="regionResultTag">
					
				</p>
				<p>
					<input type="text" name="region_detail" placeholder="상세주소를 입력해주세요" id="region_detail_text">
					<input type="text" name="branch_name" placeholder="지점 명을 입력해주세요" id="branch_name_text">
					<input type="text" name="branch_tel" placeholder="지점 전화번호를 입력해주세요" id="branch_tel_text">
				</p>
				<p class="classAddRegion" id="AddRegion">
					<input type="button" value="주소 추가하기" id="addRegion">
				</p>
			</div>
			<input type="hidden" name="company_num" th:value=${company_num}>
			</form>
			
			<form name="profileInfo" action="/company/profile/provideOk" method="post" id="submitOk">
				<div class="tags">
					<p class="majorFieldClass">
						<select name="major_field_idx" id="majorFieldSelect">
						<option id="magor_field_intro">분야선택</option>
						<option	th:each="field:${field_con}"
							 th:value="${field.MAJOR_FIELD_IDX}"
							id="major_field_con">[[${field.MAJOR_FIELD_CD}]]
						</select>
						<select name="minor_field_idx" id="minorFieldSelect">
							<option id="minor_field_intro">소분야선택</option>
						</select>
					</p>
					<p class="minorField">
					<input type="hidden" name="company_idx" th:value=${company_num}>
						<input type="submit" value="회원가입 완료">
					</p>
				</div>
			</form>
		</div>
	</main>

	<div th:replace="layout/footer :: siteFooter"></div>
</body>
<script>
var val = '';
var addRegionCount = 0;
var addedRegionIds = []; //  선택된 소분류 ID를 담을 배열

var region_text=document.getElementById('region_detail_text');
var b_name=document.getElementById('branch_name_text');
var b_tel=document.getElementById('branch_tel_text');

var submitBtn = document.querySelector('input[type="submit"]');
var majorFieldSelect = document.getElementById('majorFieldSelect');
var minorFieldSelect = document.getElementById('minorFieldSelect');
var addRegionBtn=document.getElementById('addRegion');
// 가입 완료 버튼 활성화 체크
function checkSubmitVaild() {
    if (addRegionCount > 0 && minorFieldSelect.value !== "" && minorFieldSelect.value !== "minor_field_intro") {
        submitBtn.disabled = false;
        submitBtn.style.opacity = "1";
        submitBtn.style.cursor = "pointer";
    } else {
        submitBtn.disabled = true;
        submitBtn.style.opacity = "0.5";
        submitBtn.style.cursor = "not-allowed";
    }
}
function addRegionVaild(){
	if(b_name.value==null||b_name.value==""||b_tel.value==null||b_tel.value==""||region_text.value==null||region_text.value==""){
		addRegionBtn.disabled=true;
	}else{
		addRegionBtn.disabled=false;
	}
}

checkSubmitVaild();
addRegionVaild()
b_name.oninput=function(){
	addRegionVaild();
}
b_tel.oninput=function(){
	addRegionVaild();
}
region_text.oninput=function(){
	addRegionVaild();
}

// 분야 대분류 선택 시 분야선택 옵션 삭제
majorFieldSelect.addEventListener('change', function() {
    var introOption = document.getElementById('magor_field_intro');
    if (introOption) introOption.remove();

    var major_field_idx = this.value;
    var select = document.getElementById('minorFieldSelect');
    
    fetch('/api/company/getMinorField?fieldIdx=' + major_field_idx)
        .then(resp => resp.ok ? resp.json() : Promise.reject('에러'))
        .then(data => {
            var html = '<option value="">소분야선택</option>';
            data.forEach(item => {
                html += `<option value="${item.MINOR_FIELD_IDX}">${item.MINOR_FIELD_NM}</option>`;
            });
            select.innerHTML = html;
            checkSubmitVaild();
        })
        .catch(err => alert("데이터를 불러오지 못했습니다."));
});

minorFieldSelect.addEventListener('change', checkSubmitVaild);

// 주소 추가 함수 (중복 체크 로직 포함)
function addRegionFun() {
    var majorSelect = document.getElementById('majorSelect');
    var minorSelect = document.getElementById('MinorRegion');
    var majorIdx = majorSelect.value;
    var minorIdx = minorSelect.value;
    var detail = document.regionForm.region_detail.value;
    var companyIdx = document.regionForm.company_num.value;

    //  유효성 검사
    if (majorIdx === "대분류" || minorIdx === "소분류" || !minorIdx) {
        alert("지역을 정확히 선택해주세요.");
        return;
    }

    // 중복 체크 이미 배열에 존재하는 ID인지 확인
    if (addedRegionIds.includes(minorIdx)) {
        alert("이미 추가된 지역입니다.");
        // 초기화 시켜줌
        majorSelect.selectedIndex = 0;
        minorSelect.innerHTML = '<option id="m_intro">소분류</option>';
        return;
    }

    var minorName = minorSelect.options[minorSelect.selectedIndex].text;
    var data = {
        company_idx: companyIdx,
        major_region_idx: majorIdx,
        minor_region_idx: minorIdx,
        region_detail: detail,
        branch_name:b_name.value,
        branch_tel:b_tel.value
    };

    fetch('/api/company/addRegion?minorName=' + encodeURIComponent(minorName), {
        method: 'POST',
        headers: { 'Content-type': 'application/json' },
        body: JSON.stringify(data)
    })
    .then(resp => resp.ok ? resp.text() : Promise.reject('실패'))
    .then(resultText => {
        var ResultTag = document.getElementById('regionResultTag');
        if (resultText && resultText !== "실패") {
            // 주소 표시 상세주소 포함
            ResultTag.innerHTML += `<span style='display:inline-block; margin-right:10px; padding:5px; background:#e8f5e9; border:1px solid #c8e6c9; border-radius:4px;'>${resultText} ${detail} ${b_name.value} ${b_tel.value}</span>`;
            
            // 중복 방지용 저장 성공하면 배열에 추가
            addedRegionIds.push(minorIdx);
            
            // 입력값 초기화
            document.regionForm.region_detail.value = "";
            majorSelect.selectedIndex = 0;
            minorSelect.innerHTML = '<option id="m_intro">소분류</option>';
            document.regionForm.branch_name.value='' ;
            document.regionForm.branch_tel.value='' ;
            addRegionCount++;
            checkSubmitVaild();
        } else {
            alert('주소 추가 중 오류가 발생하였습니다.');
        }
    })
    .catch(error => alert("서버 통신에 실패했습니다."));
}

document.getElementById('addRegion').onclick = addRegionFun;

// 소분류 불러오기
document.getElementById('majorSelect').addEventListener('change', function() {
    var regionIdx = this.value; 
    var minorRegionSelect = document.getElementById('MinorRegion');

    fetch('/api/company/getMinorRegion?regionIdx=' + regionIdx)
        .then(resp => resp.ok ? resp.json() : Promise.reject('에러'))
        .then(data => {
            var html = '<option value="">소분류</option>';
            data.forEach(val => {
                html += `<option value="${val.MINOR_REGION_IDX}">${val.DISTRICT_NM}</option>`;
            });
            minorRegionSelect.innerHTML = html;
        });
});
	</script>
</html>
