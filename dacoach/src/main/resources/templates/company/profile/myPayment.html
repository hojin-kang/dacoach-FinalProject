<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link rel="stylesheet" th:href="@{/css/main.css}" />
<link rel="stylesheet" th:href="@{/css/mypage.css}" />
</head>
<body>
	<div th:replace="~{layout/header :: siteHeader}"></div>

	<main class="main">
		<div class="container">
			<div class="breadcrumb">
				<a th:href="@{/company/mypage}">마이페이지</a>
				<span class="sep">&gt;</span>
				<span>나의 결제 내역</span>
			</div>

			<h2 class="pageTitle">나의 결제 내역</h2>
			<hr class="line" />

			<div>
			<table class="paymentTable">
  <thead>
    <tr>
      <th>승인 일시a</th>
      <th>상품명</th>
      <th>수량</th>
      <th>결제금액</th>
      <th>결제종류</th>
      <th>결제수단</th>
      <th>결제상태</th>
    </tr>
  </thead>

  <tbody>
    <tr th:each="p : ${payList}">
      <td th:text="${#strings.replace(p.APPROVED_AT,'T',' ')}">2026-02-12 14:24:28</td>
      <td th:text="${p.ITEM_NAME}">프리미엄</td>
      <td th:text="${p.QUANTITY}">1</td>
      <td th:text="${#numbers.formatInteger(p.TOTAL, 0, 'COMMA')} + '원'">9,000원</td>
      <td th:text="${p.PAY_TYPE}">MEMBERSHIP</td>
      <td>카카오페이</td>
      <td th:text="${p.STATUS}">완료</td>
    </tr>

    <tr th:if="${payList == null or #lists.isEmpty(payList)}">
      <td class="emptyRow" colspan="5">결제 내역이 없습니다.</td>
    </tr>
  </tbody>
</table>
			</div>
			

		</div>
	</main>

	<div th:replace="~{layout/footer :: siteFooter}"></div>
</body>
</html>
