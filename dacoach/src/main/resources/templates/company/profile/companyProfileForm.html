<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

   <meta charset="UTF-8" />
   <title>dacoach</title>

   <link rel="stylesheet" th:href="@{/css/main.css}" />
</head>
<body>
   <div th:replace="~{layout/header :: siteHeader}"></div>

   <main class="main">
   <div class="container">
      준비중입니다
      프사	이름	소개글	전화번호	문의하기	별점/리뷰	클래스 지역??및 분야?
      <div class="profileTop">
      	<span id="photoSpan">
      		<img th:src="'/uploads/'+${profile.PHOTO}" id="photoImgTag">
      	</span>
      	<span id="nameSpan">
      		[[${profile.USER_NAME}]]
      	</span>
      	<span id="introSpan">
      		[[${profile.INTRO}]]
      	</span>
      	<span id="emailSpan">
      		E-MAIL: [[${profile.EMAIL}]]
      	</span>
      	<span id="addressSapn">
      		주소: [[${profile.ADDRESS}]]
      	</span>
      	<span id="phoneSpan">
      		전화번호: [[${profile.PHONE}]]
      	</span>
      </div>
      <div class="profileMiddle_field">
      	<span id="fieldSpan">
      		제공분야: [[${profile.MAJOR_FIELD_CD}]] [[${profile.MINOR_FIELD_NM}]]
      	</span>
      <div class="profileMiddle_field">	
      	<span id="regionSpan" th:each="region:${regionList}">
      		[[${region.REGION_NM}]] [[${region.DISTRICT_NM}]]
      	</span>
      </div>
      <div class="profileBottom">
      	<span id="classSpan">
      		
      	</span>
      </div>
      </div>
      

   </div>
   </main>
  
   <div th:replace="~{layout/footer :: siteFooter}"></div>
</body>
