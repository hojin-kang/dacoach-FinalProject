<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

   <meta charset="UTF-8" />
   <title>dacoach</title>

   <link rel="stylesheet" th:href="@{/css/main.css}" />
</head>
<body>
   <div th:replace="layout/header :: siteHeader"></div>

   <main class="main">
   <div class="container">  
   <form name="companyInfoForm" action="profileForm">
   
      <div class="companyInfo">
      	<p class="comTel"><input type="text" name="phone" placeholder="사업장 전화번호를 입력해주세요"></p>
      	<p class="comAddr"><input type="text" name="address" placeholder="사업장 주소를 입력해주세요"></p>
      	<p class="comAddr"><input type="text" name="email" placeholder="E-mail 주소를 입력해주세요"></p>
      </div>
   
   	<div class="comCert">
   		<p class=companyNum><input type="text" name="company_num" placeholder="사업자 번호를 입력해주세요"></p>
   		<input type="hidden" name="cert_name" value="cert"><input type="hidden" name="cert_status" value="yet">
   		<p class="certFile"><input type="file" name="cert_file"></p>
   	</div>
   
  
  <p><input type="submit" value="저장하고 다음으로"></p>
  </form>
  </div>
  </main>
   <div th:replace="layout/footer :: siteFooter"></div>
</body>
</html>
