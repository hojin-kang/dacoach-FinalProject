<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입 선택</title>
    <link rel="stylesheet" th:href="@{/css/main.css}" />
    <style>
        /* [1] Bootstrap 핵심 유틸리티 (내부 코드로 대체) */
        .d-flex { display: flex !important; }
        .flex-column { flex-direction: column !important; }
        .justify-content-center { justify-content: center !important; }
        .align-items-center { align-items: center !important; }
        .flex-grow-1 { flex-grow: 1 !important; }
        .gap-2 { gap: 0.5rem !important; }
        .gap-4 { gap: 1.5rem !important; }
        .w-100 { width: 100% !important; }
        .my-4 { margin-top: 1.5rem !important; margin-bottom: 1.5rem !important; }

        /* [2] 전체 레이아웃 고정 */
        body { 
            background-color: #ffffff; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        /* [3] 헤더 메뉴 밑줄 및 스타일 제거 */
        nav a, .header-container a, [th\:replace] a { 
            text-decoration: none !important; 
            color: inherit !important; 
        }

        /* [4] 본문 중앙 정렬 영역 */
        main {
            flex: 1; 
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 0;
        }

        .selection-container { 
            width: 850px; 
            text-align: center; 
        }

        .selection-title { 
            font-weight: bold; 
            margin-bottom: 50px; 
            border-bottom: 1px solid #eee; 
            padding-bottom: 20px; 
            font-size: 26px;
            color: #333;
        }

        /* [5] 카드 배치 및 스타일 */
        .card-wrapper { 
            display: flex; 
            gap: 40px; 
            justify-content: center; 
        }

        .type-card { 
            flex: 1; 
            padding: 50px 30px; 
            border: 1px solid #eee; 
            border-radius: 20px; 
            background-color: #fff;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .type-card:hover { 
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.08); 
        }

        /* 코치 섹션 (청록색) */
        .title-coach { color: #3d8b89; font-weight: bold; font-size: 24px; margin-bottom: 25px; }
        .btn-coach { 
            background-color: #3d8b89; 
            color: white; 
            border: none; 
            border-radius: 10px; 
            padding: 14px 0; 
            font-weight: bold; 
            width: 85%;
            margin-top: auto;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-coach:hover { background-color: #2d6b69; }

        /* 컴퍼니 섹션 (주황색) */
        .title-company { color: #d67d1d; font-weight: bold; font-size: 24px; margin-bottom: 25px; }
        .btn-company { 
            background-color: transparent; 
            color: #d67d1d; 
            border: 2px solid #d67d1d; 
            border-radius: 10px; 
            padding: 12px 0; 
            font-weight: bold; 
            width: 85%;
            margin-top: auto;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-company:hover { background-color: #fff5eb; }

        /* 아이콘 및 텍스트 */
        .type-icon { 
            width: 110px; 
            height: 110px; 
            margin-bottom: 30px; 
            object-fit: contain; 
        }

        .type-desc { 
            font-size: 16px; 
            color: #555; 
            line-height: 1.7; 
            margin-bottom: 40px;
        }
    </style>
</head>
<body>

    <div th:replace="~{layout/header :: siteHeader}"></div>

    <main>
        <div class="selection-container">
            <h4 class="selection-title">회원가입</h4>

            <div class="card-wrapper">
                <div class="type-card">
                    <div class="title-coach">코치</div>
                    <img th:src="@{/img/coach_icon.png}" class="type-icon" alt="코치 아이콘">
                    <p class="type-desc">
                        코치 회원이 되어<br>
                        재능을 무료로 교환하거나<br>
                        클래스를 수강해 보세요!
                    </p>
                    <button class="btn-coach" onclick="location.href='/signup/coach'">가입하기</button>
                </div>

                <div class="type-card">
                    <div class="title-company">컴퍼니</div>
                    <img th:src="@{/img/company_icon.png}" class="type-icon" alt="컴퍼니 아이콘">
                    <p class="type-desc">
                        컴퍼니 회원이 되어<br>
                        클래스별 수강생을 모집하고<br>
                        통계 데이터를 관리해보세요!
                    </p>
                    <button class="btn-company" onclick="location.href='/signup/company'">가입하기</button>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{layout/footer :: siteFooter}"></div>

</body>
</html>
