<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
    <link rel="stylesheet" th:href="@{/css/main.css}" />
    <style>
        /* 1. 전체 레이아웃 설정 */
        body { 
            background-color: #ffffff; 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
        }

        /* 2. 헤더 메뉴 밑줄 삭제 (핵심!) */
        nav a, .header-container a, th\:replace a {
            text-decoration: none !important;
            color: inherit; /* 기존 글자 색상 유지 */
        }

        /* 3. 본문 중앙 정렬 */
        main {
            flex: 1; 
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 0;
        }

        .login-container { width: 400px; text-align: center; }
        .login-title { font-weight: bold; margin-bottom: 30px; border-bottom: 1px solid #eee; padding-bottom: 15px; }
        
        .user-type { margin-bottom: 20px; color: #666; }
        .user-type input { margin-right: 5px; }
        .user-type label { margin-right: 15px; cursor: pointer; }

        /* 4. 입력창 + 버튼 그리드 배치 */
        .login-input-grid {
            display: grid;
            grid-template-columns: 1fr 100px;
            gap: 10px;
            width: 100%;
        }

        .input-stack {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .form-control { 
            background-color: #f8f9fa !important; 
            border: none !important; 
            border-radius: 10px !important; 
            padding: 12px; 
            margin: 0 !important;
            width: 100%;
        }

        .btn-login { 
            background-color: #3d8b89; 
            color: white; 
            border: none; 
            border-radius: 10px; 
            font-weight: bold;
            height: 100%;
            transition: background-color 0.2s;
        }
        .btn-login:hover { background-color: #2d6b69; color: white; }

        /* 하단 스타일 */
        .find-links { font-size: 13px; color: #999; margin-top: 10px; margin-bottom: 25px; }
        .find-links a { text-decoration: none !important; color: #999; margin: 0 5px; }

        .btn-kakao { 
            background-color: #fee500; 
            border: none; 
            border-radius: 10px; 
            width: 100%; 
            padding: 12px; 
            font-weight: bold; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            text-decoration: none !important;
            color: #000;
        }

        .divider { margin: 15px 0; font-size: 12px; color: #ccc; }

        .btn-signup { 
            background-color: transparent; 
            border: 1px solid #3d8b89; 
            border-radius: 20px; 
            width: 100%; 
            padding: 10px; 
            color: #3d8b89; 
            font-weight: bold; 
        }
    </style>
</head>
<body>
    <div th:replace="~{layout/header :: siteHeader}"></div>

    <main>
        <div class="login-container">
            <h4 class="login-title" style="border-bottom: none;">로그인</h4>

            <form action="/login" method="post">
                <div class="user-type">
                    <input type="radio" name="type" id="coach" checked><label for="coach">코치</label>
                    <input type="radio" name="type" id="company"><label for="company">컴퍼니</label>
                </div>

                <div class="login-input-grid">
                    <div class="input-stack">
                        <input type="text" name="username" class="form-control" placeholder="아이디">
                        <input type="password" name="password" class="form-control" placeholder="비밀번호">
                    </div>
                    <button type="submit" class="btn-login">로그인</button>
                </div>

                <div class="find-links">
                    <a href="#">아이디 찾기</a> | <a href="#">비밀번호 찾기</a>
                </div>

                <button type="button" class="btn-kakao">💬 카카오로 시작하기</button>
                <div class="divider">or</div>
                <button type="button" class="btn-signup" id="memberJoin">회원가입</button>
            </form>
        </div>
    </main>

    <div th:replace="~{layout/footer :: siteFooter}"></div>

    <script>
        document.querySelector('.btn-signup').addEventListener('click', function() {
            window.location.href = '/memberJoin';
        });
    </script>
</body>
</html>
